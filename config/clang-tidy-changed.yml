# Changed-line clang-tidy policy (./scripts/check <preset> --tidy-changed).
#
# These checks enforce AGENTS.md rules that the legacy code base does not yet
# satisfy, so they apply only to lines a change adds or modifies (clang-tidy
# --line-filter). Test sources use clang-tidy-changed-tests.yml, which omits
# readability-magic-numbers. The repository-wide policy stays in .clang-tidy.
#
#   readability-identifier-naming     AGENTS.md "Naming" case rules
#   readability-magic-numbers         AGENTS.md "No magic sizes" / representation constants
#   readability-implicit-bool-conversion  pointers/integers compared explicitly
---
Checks: >
  -*,
  readability-identifier-naming,
  readability-magic-numbers,
  readability-implicit-bool-conversion
WarningsAsErrors: '*'
FormatStyle: file
CheckOptions:
  - key: readability-identifier-naming.ClassCase
    value: CamelCase
  - key: readability-identifier-naming.StructCase
    value: CamelCase
  - key: readability-identifier-naming.FunctionCase
    value: CamelCase
  - key: readability-identifier-naming.PublicMethodCase
    value: CamelCase
  - key: readability-identifier-naming.ProtectedMethodCase
    value: camelBack
  - key: readability-identifier-naming.PrivateMethodCase
    value: camelBack
  - key: readability-identifier-naming.PrivateMemberPrefix
    value: m
  - key: readability-identifier-naming.PrivateMemberCase
    value: CamelCase
  - key: readability-identifier-naming.ParameterCase
    value: camelBack
  - key: readability-identifier-naming.LocalVariableCase
    value: camelBack
  - key: readability-identifier-naming.ConstexprVariableCase
    value: UPPER_CASE
  - key: readability-identifier-naming.StaticConstantCase
    value: UPPER_CASE
  # 0 is always accepted; 1, 2 and 0.5 need no name (AGENTS.md).
  - key: readability-magic-numbers.IgnoredIntegerValues
    value: '1;2'
  - key: readability-magic-numbers.IgnoredFloatingPointValues
    value: '0.5;1.0;2.0'
  - key: readability-magic-numbers.IgnorePowersOf2IntegerValues
    value: 'false'
  - key: readability-magic-numbers.IgnoreBitFieldsWidths
    value: 'true'
  - key: readability-implicit-bool-conversion.AllowPointerConditions
    value: 'false'
  - key: readability-implicit-bool-conversion.AllowIntegerConditions
    value: 'false'
