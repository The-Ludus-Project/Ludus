# Platform/tooling owns this advisory baseline. Stable LLVM 23 checkers only;
# promotion requires the supported native/browser scans and reviewed findings.
# Thanks to LLVM, "Available Checkers", for the core/C++/Unix family contracts:
# https://clang.llvm.org/docs/analyzer/checkers.html
---
Checks: '-*,clang-analyzer-core.*,clang-analyzer-cplusplus.*,clang-analyzer-unix.*'
WarningsAsErrors: '*'
# Match whole directory components: an unanchored 'tools/' also matched
# out/host-tools/ (vendored libc++ headers on macOS).
HeaderFilterRegex: '(^|.*/)(modules|apps|tools|tests|examples)/.*'
CheckOptions:
  # LLVM 23's released Move option retains checks for modeled standard types,
  # while respecting Ludus-owned types' documented empty/reusable moved state.
  # https://github.com/llvm/llvm-project/blob/llvmorg-23.1.3/clang/include/clang/StaticAnalyzer/Checkers/Checkers.td#L673
  - key: clang-analyzer-cplusplus.Move:WarnOn
    value: KnownsOnly
