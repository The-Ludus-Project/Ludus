name: Prepare native CI
description: Install pinned tools and prepare one locked native preset
inputs:
  preset:
    description: Native preset to prepare
    required: true
  compiler-cache:
    description: Enable compiler caching (disable for timing profiles)
    default: 'true'
  cache-variant:
    description: Distinguish compiler configurations such as PCH
    default: native
  conan-cache-writer:
    description: Save Conan packages (one writer per preset)
    default: 'true'
  compiler-cache-writer:
    description: Save compiler outputs (one writer per variant)
    default: 'true'
  prerequisites-only:
    description: Install system packages for a test runner restoring a prepared build.
    default: 'false'
  configure-editor-only:
    description: Configure the optional Editor for a subsequent explicit build
    default: 'false'
  editor:
    description: Install and build the optional editor
    default: 'false'
runs:
  using: composite
  steps:
    - name: Select software-driver correctness profile
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
      run: |
        # The captured action must also work with older trusted main workflows.
        # Thanks to GitHub's Variables reference: GITHUB_JOB is the current job ID.
        # https://docs.github.com/en/actions/reference/workflows-and-actions/variables
        # Thanks to Mesa's Gallivm authors, lp_bld_init.c, lp_bld_perf_flags/create_pass_manager:
        # https://chromium.googlesource.com/chromiumos/third_party/mesa/+/refs/heads/stabilize-13982.70.B-chromeos-amd/src/gallium/auxiliary/gallivm/lp_bld_init.c
        case "$RUNNER_OS:$GITHUB_JOB:$PRESET" in
          Linux:development:linux-clang-development|Linux:sanitizers:linux-clang-asan-ubsan|Linux:editor:linux-clang-development)
            printf 'GALLIVM_PERF=nopt\n' >> "$GITHUB_ENV"
            echo 'Mesa correctness profile: nopt'
            ;;
        esac
    - name: Prepare native prerequisites
      shell: bash
      env:
        WITH_EDITOR: ${{ inputs.editor }}
      run: |
        if [[ -d /opt/ludus-ci/venv ]]; then
          # The job pulled the image selected for this checkout's dependency inputs.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash /opt/ludus-ci/use-tools.sh
          echo 'Using preinstalled native prerequisites and pinned host tools.'
        else
          # An unused hosted source failing its index update would fail the job.
          bash .github/actions/apt-install/use-required-sources.sh
          bash .github/actions/native-setup/install-packages.sh
        fi
    - name: Select Lavapipe for Linux sanitizer tests
      if: runner.os == 'Linux' && github.job == 'sanitizers' && inputs.preset == 'linux-clang-asan-ubsan' && inputs.editor == 'true'
      shell: bash
      run: |
        # The hosted Vulkan tests exercise Mesa's software device. Default discovery also
        # loads other drivers, which can leak during enumeration on hosted Ubuntu.
        # Thanks to Khronos, Vulkan Loader Driver Interface, "Overriding the Default Driver Discovery".
        # https://github.com/KhronosGroup/Vulkan-Loader/blob/main/docs/LoaderDriverInterface.md#overriding-the-default-driver-discovery
        manifest="$(dpkg-query -L mesa-vulkan-drivers | awk '/\/lvp_icd(\.[[:alnum:]_]+)?\.json$/ { print }')"
        if [[ ! -f "$manifest" || ! -r "$manifest" ]]; then
          echo '::error::Expected one readable Lavapipe manifest. Restore the Ubuntu mesa-vulkan-drivers package.'
          exit 1
        fi
        printf 'VK_DRIVER_FILES=%s\n' "$manifest" >> "$GITHUB_ENV"
        printf 'Vulkan software driver manifest: %s\n' "$manifest"
    # Each batch starts about ten Linux jobs at once, and each downloaded the pinned
    # shader tools; a 403 from one package host then failed them all. Only the
    # SHA-256-verified archives are cached: scripts/shader-probe re-verifies and
    # re-extracts them, and downloads from its mirrors on a miss.
    - name: Cache pinned shader tool archives
      if: inputs.prerequisites-only != 'true'
      uses: actions/cache@v4
      with:
        path: |
          out/shader-tools/slang.tar.gz
          out/shader-tools/spirv-tools.deb
        key: shader-tool-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/shader_toolchain.json') }}
    - name: Cache pip downloads
      if: inputs.prerequisites-only != 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/tool_versions.json') }}
    # Thanks to GitHub's "Dependency caching reference": immutable dependency
    # snapshots use input identities; compiler snapshots roll forward per commit.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
    # Conan keys hash only Conan inputs: the local recipes and the support files the
    # Catch2 recipe exports. Vendored FetchContent or source trees under third_party
    # would give develop pull requests a key that the batch on main never saves.
    - name: Cache selected Conan packages
      if: inputs.prerequisites-only != 'true' && inputs.conan-cache-writer == 'true'
      uses: actions/cache@v4
      with:
        path: out/conan/home
        key: conan-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ hashFiles('conanfile.py', 'conan.lock', 'third_party/*/conanfile.py', 'tests/support/prepare_catch_headers.py', 'tests/support/catch_stream.*', 'config/conan/**', 'config/tool_versions.json', 'CMakePresets.json') }}
    - name: Restore selected Conan packages without saving
      if: inputs.prerequisites-only != 'true' && inputs.conan-cache-writer != 'true'
      uses: actions/cache/restore@v4
      with:
        path: out/conan/home
        key: conan-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ hashFiles('conanfile.py', 'conan.lock', 'third_party/*/conanfile.py', 'tests/support/prepare_catch_headers.py', 'tests/support/catch_stream.*', 'config/conan/**', 'config/tool_versions.json', 'CMakePresets.json') }}
        # Read-only jobs never save, so an older package set is a safe start: the
        # locked install reuses matching packages and builds only what is missing.
        restore-keys: |
          conan-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-
    - name: Cache compiler outputs
      if: inputs.prerequisites-only != 'true' && inputs.compiler-cache == 'true' && inputs.compiler-cache-writer == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ inputs.cache-variant }}-${{ hashFiles('config/tool_versions.json', 'config/conan/**') }}-${{ env.LUDUS_CI_COMMIT_SHA || github.sha }}
        restore-keys: |
          ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ inputs.cache-variant }}-${{ hashFiles('config/tool_versions.json', 'config/conan/**') }}-
    - name: Restore compiler outputs without saving
      if: inputs.prerequisites-only != 'true' && inputs.compiler-cache == 'true' && inputs.compiler-cache-writer != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ccache
        key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ inputs.cache-variant }}-${{ hashFiles('config/tool_versions.json', 'config/conan/**') }}-${{ env.LUDUS_CI_COMMIT_SHA || github.sha }}
        restore-keys: |
          ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ inputs.cache-variant }}-${{ hashFiles('config/tool_versions.json', 'config/conan/**') }}-
    - name: Configure compiler caching
      if: inputs.prerequisites-only != 'true'
      shell: bash
      env:
        COMPILER_CACHE: ${{ inputs.compiler-cache }}
      run: |
        if [[ "$COMPILER_CACHE" == true ]]; then
          echo 'LUDUS_ENABLE_CCACHE=1' >> "$GITHUB_ENV"
          ccache --zero-stats
        else
          echo 'LUDUS_ENABLE_CCACHE=0' >> "$GITHUB_ENV"
        fi
    - name: Prepare selected locked preset
      if: inputs.prerequisites-only != 'true'
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        CONFIGURE_EDITOR_ONLY: ${{ inputs.configure-editor-only }}
        WITH_EDITOR: ${{ inputs.editor }}
      run: |
        options=(--cli --no-system-install --locked --with-tests --preset-only "$PRESET")
        if [[ "$WITH_EDITOR" == true ]]; then
          options+=(--with-editor)
          if [[ "$CONFIGURE_EDITOR_ONLY" == true ]]; then options+=(--configure-editor-only); fi
        fi
        ./init.sh "${options[@]}"
        git diff --exit-code -- conan.lock
