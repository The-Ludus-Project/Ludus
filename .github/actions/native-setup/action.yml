name: Prepare native CI
description: Install pinned tools and prepare one locked native preset
inputs:
  preset:
    description: Native preset to prepare
    required: true
  compiler-cache:
    description: Enable compiler caching (disable for timing profiles)
    default: 'true'
  cache-variant:
    description: Distinguish compiler configurations such as PCH
    default: native
  conan-cache-writer:
    description: Save Conan packages (one writer per preset)
    default: 'true'
  compiler-cache-writer:
    description: Save compiler outputs (one writer per variant)
    default: 'true'
  editor:
    description: Install and build the optional editor
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install native prerequisites
      shell: bash
      env:
        WITH_EDITOR: ${{ inputs.editor }}
      run: |
        # Ubuntu 24.04 does not package the pinned LLVM; use its pinned apt.llvm.org suite.
        python3 scripts/python/llvm_apt_source.py
        packages=(gdb clang-23 llvm-23 lld-23 clang-format-23 clang-tidy-23 libclang-rt-23-dev python3-venv ccache libwayland-dev wayland-protocols libwayland-bin)
        if [[ "$WITH_EDITOR" == true ]]; then
          # Preview is included in editor setup; offscreen rendering tests
          # still need a Vulkan loader and Mesa's software device.
          packages+=(qt6-base-dev qt6-declarative-dev qt6-wayland libvulkan1 mesa-vulkan-drivers)
        fi
        # Stalled package mirrors must fail promptly so the job can be retried.
        apt_options=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3)
        # Network inactivity timeouts do not bound the whole operation. One
        # runner remained in update for 47 minutes without producing output.
        timeout --signal=TERM --kill-after=30s 5m sudo apt-get "${apt_options[@]}" update -qq
        timeout --signal=TERM --kill-after=30s 10m sudo apt-get "${apt_options[@]}" install -y -qq "${packages[@]}"
    - name: Cache pip downloads
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/tool_versions.json') }}
    # Thanks to GitHub's "Dependency caching reference": immutable dependency
    # snapshots use input identities; compiler snapshots roll forward per commit.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
    - name: Cache selected Conan packages
      if: inputs.conan-cache-writer == 'true'
      uses: actions/cache@v4
      with:
        path: out/conan/home
        key: conan-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ hashFiles('conanfile.py', 'conan.lock', 'third_party/**', 'config/conan/**', 'config/tool_versions.json', 'CMakePresets.json') }}
    - name: Restore selected Conan packages without saving
      if: inputs.conan-cache-writer != 'true'
      uses: actions/cache/restore@v4
      with:
        path: out/conan/home
        key: conan-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ hashFiles('conanfile.py', 'conan.lock', 'third_party/**', 'config/conan/**', 'config/tool_versions.json', 'CMakePresets.json') }}
    - name: Cache compiler outputs
      if: inputs.compiler-cache == 'true' && inputs.compiler-cache-writer == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ inputs.cache-variant }}-${{ hashFiles('config/tool_versions.json', 'config/conan/**') }}-${{ env.LUDUS_CI_COMMIT_SHA || github.sha }}
        restore-keys: |
          ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ inputs.cache-variant }}-${{ hashFiles('config/tool_versions.json', 'config/conan/**') }}-
    - name: Restore compiler outputs without saving
      if: inputs.compiler-cache == 'true' && inputs.compiler-cache-writer != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ccache
        key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ inputs.cache-variant }}-${{ hashFiles('config/tool_versions.json', 'config/conan/**') }}-${{ env.LUDUS_CI_COMMIT_SHA || github.sha }}
        restore-keys: |
          ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ inputs.cache-variant }}-${{ hashFiles('config/tool_versions.json', 'config/conan/**') }}-
    - name: Configure compiler caching
      shell: bash
      env:
        COMPILER_CACHE: ${{ inputs.compiler-cache }}
      run: |
        if [[ "$COMPILER_CACHE" == true ]]; then
          echo 'LUDUS_ENABLE_CCACHE=1' >> "$GITHUB_ENV"
          ccache --zero-stats
        else
          echo 'LUDUS_ENABLE_CCACHE=0' >> "$GITHUB_ENV"
        fi
    - name: Prepare selected locked preset
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        WITH_EDITOR: ${{ inputs.editor }}
      run: |
        options=(--cli --no-system-install --locked --with-tests --preset-only "$PRESET")
        if [[ "$WITH_EDITOR" == true ]]; then
          options+=(--with-editor)
        fi
        ./init.sh "${options[@]}"
        git diff --exit-code -- conan.lock
