name: Prepare macOS CI
description: Prepare pinned macOS tools with locked dependency and compiler caches
inputs:
  preset:
    description: Native preset to prepare
    required: true
  cache-variant:
    description: Compiler and dependency cache owner (native or sanitizers)
    default: native
  editor:
    description: Prepare optional editor dependencies and configuration
    default: 'true'
  build-editor:
    description: Build the editor during setup when no later build owns it
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install upstream Clang 23 and native prerequisites
      shell: bash
      env:
        WITH_EDITOR: ${{ inputs.editor }}
      run: |
        # llvm@23/lld@23 alias the unversioned formulae until Homebrew versions
        # them; ./init.sh rejects an alias that has moved to another major.
        packages=(llvm@23 lld@23 ccache)
        if [[ "$WITH_EDITOR" == true ]]; then packages+=(qtbase qtdeclarative); fi
        # Runner images can carry stale formula metadata (llvm 23.1.0 against
        # the 23.1.3 minimum); refresh it so brew installs the current bottle.
        brew update --quiet
        brew install "${packages[@]}"
    # Match Linux cache policy: locked dependency identities and rolling compiler
    # snapshots. Do not cache CMake trees, SDKs, shims or generated preset files.
    - name: Restore locked macOS dependencies
      id: dependencies
      uses: actions/cache/restore@v4
      with:
        path: out/conan/home
        key: conan-macos-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-variant }}-${{ hashFiles('conanfile.py', 'conan.lock', 'third_party/*/conanfile.py', 'tests/support/prepare_catch_headers.py', 'tests/support/catch_stream.*', 'config/conan/**', 'config/tool_versions.json', 'CMakePresets.json') }}
        # The locked install validates recipe and package IDs. If this lane has
        # no snapshot yet, start from packages built by the other macOS lane.
        restore-keys: |
          conan-macos-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-variant }}-
          conan-macos-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore macOS compiler outputs
      id: compiler
      uses: actions/cache/restore@v4
      with:
        path: out/ccache
        key: ccache-macos-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-variant }}-${{ hashFiles('config/tool_versions.json', 'config/conan/**', 'config/luau_toolchain.json') }}-${{ env.LUDUS_CI_COMMIT_SHA || github.sha }}
        restore-keys: |
          ccache-macos-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-variant }}-${{ hashFiles('config/tool_versions.json', 'config/conan/**', 'config/luau_toolchain.json') }}-
    - name: Configure compiler caching
      shell: bash
      run: |
        ccache_program="$(command -v ccache)"
        echo "CCACHE_DIR=$GITHUB_WORKSPACE/out/ccache" >> "$GITHUB_ENV"
        echo 'LUDUS_ENABLE_CCACHE=1' >> "$GITHUB_ENV"
        # CMake environment defaults also cover independent SDK consumers and
        # Luau host tools; the engine configures its C/C++ launchers explicitly.
        echo "CMAKE_C_COMPILER_LAUNCHER=$ccache_program" >> "$GITHUB_ENV"
        echo "CMAKE_CXX_COMPILER_LAUNCHER=$ccache_program" >> "$GITHUB_ENV"
        echo "CMAKE_OBJCXX_COMPILER_LAUNCHER=$ccache_program" >> "$GITHUB_ENV"
        CCACHE_DIR="$GITHUB_WORKSPACE/out/ccache" ccache --max-size=500M
        CCACHE_DIR="$GITHUB_WORKSPACE/out/ccache" ccache --zero-stats
    - name: Prepare pinned native dependencies
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        WITH_EDITOR: ${{ inputs.editor }}
        BUILD_EDITOR: ${{ inputs.build-editor }}
      run: |
        arguments=(--cli --preset "$PRESET" --preset-only --locked --with-tests --no-system-install)
        if [[ "$WITH_EDITOR" == true ]]; then
          arguments+=(--with-editor)
          if [[ "$BUILD_EDITOR" == false ]]; then arguments+=(--configure-editor-only); fi
        fi
        ./init.sh "${arguments[@]}"
        git diff --exit-code -- conan.lock
    - name: Prepare pinned Metal shader compiler for engine-only setup
      if: inputs.editor != 'true'
      shell: bash
      run: out/host-tools/venv/bin/python scripts/shader-probe bootstrap
    - name: Prepare pinned Behavior tools and acceptance data
      shell: bash
      run: |
        out/host-tools/venv/bin/python scripts/script-provider bootstrap
        out/host-tools/venv/bin/python scripts/script-provider cook
outputs:
  dependency-cache-key:
    description: Locked dependency snapshot key to save after all profiles are prepared
    value: ${{ steps.dependencies.outputs.cache-primary-key }}
  dependency-cache-hit:
    description: Whether the locked dependency snapshot already exists
    value: ${{ steps.dependencies.outputs.cache-hit }}
  compiler-cache-key:
    description: Exact rolling compiler snapshot key to save after builds
    value: ${{ steps.compiler.outputs.cache-primary-key }}
  compiler-cache-hit:
    description: Whether the exact compiler snapshot already exists
    value: ${{ steps.compiler.outputs.cache-hit }}
