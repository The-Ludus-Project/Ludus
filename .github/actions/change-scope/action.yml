name: Change scope
description: Conservatively identify documentation-only changes without installing native tools.
outputs:
  native_required:
    description: Whether native engine and host-tooling validation must run.
    value: ${{ steps.classify.outputs.native_required }}
  validation_tier:
    description: Whether this run is the cheap integration tier, full batch tier, or standalone nightly tier.
    value: ${{ steps.classify.outputs.validation_tier }}
  validated_by:
    description: Earlier run of this workflow whose native validation this unchanged pull-request commit reuses, or empty.
    value: ${{ steps.classify.outputs.validated_by }}
runs:
  using: composite
  steps:
    - name: Test CI change routing and required gate
      shell: bash
      run: python3 -m unittest discover -s scripts/python -p test_ci_scope.py -v
    - name: Classify the complete change
      id: classify
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 scripts/python/ci_scope.py classify
    - name: Require an explicit routing output
      shell: bash
      env:
        NATIVE_REQUIRED: ${{ steps.classify.outputs.native_required }}
        VALIDATION_TIER: ${{ steps.classify.outputs.validation_tier }}
        VALIDATED_BY: ${{ steps.classify.outputs.validated_by }}
      run: |
        case "$NATIVE_REQUIRED" in
          true|false) ;;
          *) echo 'Missing or invalid CI routing output.' >&2; exit 1 ;;
        esac
        case "$VALIDATION_TIER" in
          full|integration|nightly) ;;
          *) echo 'Missing or invalid CI validation tier.' >&2; exit 1 ;;
        esac
        if [[ -n "$VALIDATED_BY" && ! "$VALIDATED_BY" =~ ^[1-9][0-9]*$ ]]; then
          echo 'Invalid CI validating run.' >&2
          exit 1
        fi
