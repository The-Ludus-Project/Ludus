name: Ludus Wiki

# Thanks to GitHub, "Using custom workflows with GitHub Pages": build a
# dedicated static artifact; only the main deployment job receives Pages/OIDC
# permissions. PR checks never publish. Adapted for MkDocs and link validation.
# https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_call:
    inputs:
      batch_sha:
        description: Frozen develop commit selected by the trusted batch coordinator.
        required: true
        type: string
      batch_base_sha:
        description: Stable main commit captured with this candidate.
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

# Thanks to GitHub's "Concurrency" guidance: superseded PR checks can cancel.
# https://docs.github.com/en/actions/concepts/workflows-and-actions/concurrency
# Only a push (synchronize) supersedes the runs for earlier commits. Other PR
# activity (opened, ready_for_review, edited, ...) can fire for the commit a
# concurrent push run is validating, so it runs in a per-commit group that never
# cancels. A cancelled duplicate would otherwise leave a cancelled or failed
# required check on the head commit and block the PR.
concurrency:
  group: wiki-${{ inputs.batch_sha || github.ref }}${{ github.event_name == 'pull_request' && github.event.action != 'synchronize' && format('-head-{0}', github.event.pull_request.head.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  api-documentation:
    name: Public API documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
          # The PR base commit must be available for the shrink-only baseline gate.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/wiki-requirements.txt
      - name: Install pinned documentation tools
        run: python -m pip install -r docs/wiki-requirements.txt
      - name: Test API documentation enforcement
        run: python -m unittest discover -s scripts/python -p 'test_api*.py' -v
      - name: Build the authored wiki
        run: python -m mkdocs build --strict
      - name: Reject new API gaps and baseline additions in pull requests and batches
        if: inputs.batch_base_sha != '' || github.event_name == 'pull_request'
        env:
          API_BASELINE_REF: ${{ inputs.batch_base_sha || github.event.pull_request.base.sha }}
        run: python scripts/build-api --bootstrap --baseline-ref "$API_BASELINE_REF"
      - name: Validate API documentation on main and manual runs
        if: inputs.batch_base_sha == '' && github.event_name != 'pull_request'
        run: python scripts/build-api --bootstrap

      - name: Validate canonical documentation without rebuilding the browser editor
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        run: |
          python scripts/check-docs
          python -m unittest discover -s scripts/python -p test_docs.py -v
          python -m unittest discover -s scripts/python -p test_wiki.py -v
          python scripts/check-wiki --documentation-only

  editor:
    if: github.event_name != 'pull_request' || github.base_ref != 'develop'
    name: Build or reuse browser editor
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      # Guides/API prose do not change this key. Validate every restored payload
      # before combining it with the newly built wiki; never deploy stale assets.
      - name: Restore matching editor payload
        id: payload
        uses: actions/cache@v4
        with:
          path: out/editor-pages
          key: editor-pages-v1-${{ runner.os }}-${{ hashFiles('apps/editor/**', 'apps/web_samples/**', 'scripts/script-provider', 'scripts/script-interaction', 'scripts/luau-probe', 'scripts/python/ludus_tools/behavior*.py', 'tools/reflection/**', 'examples/cornell-box/**', 'examples/live-edit-game/**', 'examples/scripted-game/**', 'examples/editor-sdk-project/**', 'modules/**', 'third_party/**', 'cmake/**', 'CMakeLists.txt', 'config/*.json', 'scripts/build-web-editor', 'scripts/python/editor_web.py', 'scripts/python/web_package.py', 'docs/wiki/editor/index.html', 'docs/wiki/assets/ludus-*.png') }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Test editor artifact admission
        run: python -m unittest discover -s scripts/python -p test_editor_web.py -v
      - name: Test browser download bridge
        run: node --test apps/editor/tests/browser_files_tests.cjs
      - name: Restore pinned Qt and browser tools
        if: steps.payload.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            out/editor-tools/qt-wasm-static
            out/editor-tools/src
            out/editor-tools/host
            out/host-tools/emsdk
            out/host-tools/venv
            out/luau-probe
            out/script-interaction
            out/shader-tools
          key: editor-tools-v1-${{ runner.os }}-${{ hashFiles('config/editor_web_toolchain.json', 'config/web_toolchain.json', 'config/tool_versions.json', 'scripts/python/editor_web.py') }}
      - name: Install native tools for precompiled web samples
        if: steps.payload.outputs.cache-hit != 'true'
        run: |
          llvm_major="$(python3 -c 'import json; print(int(json.load(open("config/tool_versions.json"))["minimum"]["clang"].split(".")[0]))')"
          if [[ -f scripts/python/llvm_apt_source.py ]]; then python3 scripts/python/llvm_apt_source.py; fi
          sudo apt-get update
          sudo apt-get install -y "clang-$llvm_major" "lld-$llvm_major"
      - name: Compile the Qt editor and playable samples for WebAssembly
        if: steps.payload.outputs.cache-hit != 'true'
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: python scripts/build-web-editor --bootstrap
      - name: Validate editor assets, memory and notices
        id: validate-editor
        run: python scripts/build-web-editor --check-package
      - uses: actions/upload-artifact@v4
        if: always() && steps.validate-editor.outcome == 'success'
        with:
          name: browser-editor
          path: out/editor-pages
          if-no-files-found: error
          retention-days: 7

  sample-playback:
    name: Playable web samples (software GPU)
    needs: editor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: browser-editor
          path: out/editor-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify playable samples in Chromium
        run: |
          npm ci --prefix tools/web-browser-tests
          cd tools/web-browser-tests
          npx playwright install --with-deps chromium
          node web_samples.mjs ../../out/editor-pages ../../out/web-sample-qa
      - name: Verify imported-scene WebGPU viewport in Chromium
        run: |
          cd tools/web-browser-tests
          node editor_viewport.mjs ../../out/editor-pages ../../out/editor-viewport-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-editor-viewport-screenshots
          path: out/editor-viewport-qa
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-sample-screenshots
          path: out/web-sample-qa
          if-no-files-found: ignore

  build:
    name: Build and check wiki
    needs: [editor, sample-playback]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/wiki-requirements.txt
      - name: Install pinned documentation tools
        run: python -m pip install -r docs/wiki-requirements.txt
      - name: Check canonical documentation index and portable links
        run: python scripts/check-docs
      - name: Build with strict Markdown and anchor checks
        run: python -m mkdocs build --strict
      - name: Build public SDK reference with pinned Doxygen and check coverage
        run: python scripts/build-api --bootstrap
      - name: Include the validated editor application
        uses: actions/download-artifact@v4
        with:
          name: browser-editor
          path: out/wiki/editor
      - name: Test public API inventory, presentation and documentation coverage
        run: python -m unittest discover -s scripts/python -p 'test_api*.py' -v
      - name: Test artifact validation failures
        run: python -m unittest discover -s scripts/python -p 'test_*docs*.py' -v
      - name: Test wiki artifact validation failures
        run: python -m unittest discover -s scripts/python -p test_wiki.py -v
      - name: Verify generated links, assets, source references and search index
        run: python scripts/check-wiki
      - name: Package the same sources and checked site for offline reading
        run: python scripts/package-docs
      - name: Upload offline documentation
        uses: actions/upload-artifact@v4
        with:
          name: ludus-docs-offline
          path: out/ludus-docs-offline.zip
          if-no-files-found: error
      - name: Upload the website artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out/wiki

  macos-documentation-tools:
    # Pull requests build the wiki on Linux; the macOS tool checks run in
    # batches and on main, keeping scarce macOS runners for combined work.
    if: github.event_name != 'pull_request'
    name: Documentation tools (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/wiki-requirements.txt
      - run: python -m unittest discover -s scripts/python -p 'test_api*.py' -v
      - run: python scripts/check-docs
      - run: python -m mkdocs build --strict
      - run: python scripts/build-api --bootstrap
      - name: Verify cached bootstrap without network
        run: |
          PYTHONPATH=scripts/python python - <<'PY'
          import json
          from pathlib import Path
          from unittest.mock import patch
          from api_reference import bootstrap
          with patch("api_reference.urllib.request.urlopen", side_effect=AssertionError("unexpected download")):
              bootstrap(Path.cwd(), json.loads(Path("config/doxygen_toolchain.json").read_text()))
          PY
      - run: python scripts/check-wiki --documentation-only
      - run: python scripts/package-docs

  deploy:
    name: Publish wiki to GitHub Pages
    if: inputs.batch_sha == '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
