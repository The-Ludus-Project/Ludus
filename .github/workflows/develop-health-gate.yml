name: Develop health gate

# While develop's latest validated batch is red, admit only fixes proven on the
# PR head (docs/development/continuous-integration.md#develop-health). It reads
# completed batch runs, so it needs no coordinator state on main.
#
# The gate reads the PR description's Batch-Fix declarations, so it is the only
# pull-request workflow that runs on description edits. An edit costs this one
# short job instead of re-running every compile workflow, and the run completes
# quickly enough for the re-evaluation workflow to re-run it after each batch
# (docs/development/continuous-integration.md#pull-request-runner-budget).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [develop]

permissions:
  contents: read

# Thanks to GitHub's "Concurrency" guidance: a newer evaluation supersedes an
# older one. Every run reads the live description and the same batch state.
# https://docs.github.com/en/actions/concepts/workflows-and-actions/concurrency
concurrency:
  group: develop-health-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  develop-health:
    name: Develop health
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit only proven fixes while the latest batch is red
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEVELOP_HEALTH_WAIVER: ${{ vars.DEVELOP_HEALTH_WAIVER }}
        run: python3 scripts/python/develop_health.py gate
