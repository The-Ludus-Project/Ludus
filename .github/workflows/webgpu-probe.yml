name: Browser backends and packages

on:
  pull_request:
    paths:
      - '.github/workflows/webgpu-probe.yml'
      - 'tools/webgpu-probe/**'
      - 'tools/luau-probe/**'
      - 'scripts/luau-probe'
      - 'config/luau_toolchain.json'
      - 'config/behavior_profiles.json'
      - 'cmake/LudusBehaviorProfile.cmake'
      - 'cmake/LuauProfile.cmake'
      - 'modules/runtime/scripting/**'
      - 'modules/runtime/behavior/**'
      - 'tools/script-provider/**'
      - 'scripts/script-provider'
      - 'scripts/python/ludus_tools/behavior_cook.py'
      - 'tools/script-session/**'
      - 'scripts/script-session'
      - 'tools/visual-sequence/**'
      - 'scripts/visual-sequence'
      - 'tools/script-interaction/**'
      - 'tools/script-cook/**'
      - 'scripts/script-interaction'
      - 'tools/shader-probe/**'
      - 'scripts/shader-probe'
      - 'config/shader_toolchain.json'
      - 'tests/sdk_consumer/**'
      - 'scripts/webgpu-probe'
      - 'scripts/bootstrap-spirv-cross'
      - 'config/spirv_cross_toolchain.json'
      - 'scripts/package-web'
      - 'scripts/python/web_package.py'
      - 'scripts/python/test_web_package.py'
      - 'tools/web-browser-tests/**'
      - 'scripts/python/formatting.py'
      - 'config/web_toolchain.json'
      - 'config/tool_versions.json'
      - 'cmake/EngineCompilerWarnings.cmake'
      - 'modules/graphics/rhi/**'
      - 'modules/graphics/renderer/**'
      - 'modules/graphics/text/**'
      - 'tools/web-rhi-probe/**'
      - 'tools/web-frame-probe/**'
      - 'apps/smoke/**'
      - 'apps/world_demo/**'
      - 'modules/gameplay/camera/**'
      - 'modules/platform/**'
      - 'tools/web-platform-probe/**'
      - 'modules/foundation/base/**'
      - 'modules/foundation/math/**'
      - 'modules/foundation/geometry/**'
      - 'modules/content/procedural/**'
      - 'tools/web-math-probe/**'
      - 'modules/localization/**'
      - 'tools/web-localization-probe/**'
      - 'scripts/localization'
      - 'scripts/python/localization.py'
      - 'scripts/python/test_localization.py'
      - 'scripts/icu-probe'
      - 'scripts/localization-corpus'
      - 'scripts/python/localization_corpus.py'
      - 'tools/icu-probe/**'
      - 'config/icu_toolchain.json'
      - 'modules/foundation/unicode/**'
      - 'scripts/python/localization_release.py'
      - 'modules/physics/fluid/**'
      - 'tools/web-fluid-probe/**'
      - 'modules/foundation/containers/**'
      - 'modules/foundation/time/**'
      - 'modules/foundation/filesystem/**'
      - 'modules/foundation/threading/**'
      - 'modules/foundation/parsing/**'
      - 'third_party/yyjson/**'
      - 'modules/foundation/logging/**'
      - 'modules/foundation/profiling/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'scripts/python/engine.py'
      - 'scripts/python/init_ui.py'
      - 'scripts/python/init_editor.py'
      - 'scripts/python/init_options.py'
      - 'cmake/EngineInitOptions.cmake'
      - 'scripts/python/web_build.py'
      - 'tools/web-foundation-probe/**'
      - 'tools/web-observability-probe/**'
      - 'tests/build_contract/**'
      - 'tools/check_foundational_includes.py'
      - '.clang-format'
      - '.clang-tidy'
  workflow_call:
    inputs:
      batch_sha:
        description: Frozen develop commit selected by the trusted batch coordinator.
        required: true
        type: string
      batch_base_sha:
        description: Stable main commit captured with this candidate.
        required: true
        type: string
  schedule:
    - cron: '47 9 * * *'
  workflow_dispatch:

concurrency:
  group: webgpu-probe-${{ inputs.batch_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  LUDUS_TIDY_JOBS: "4"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  compile-and-package:
    if: github.event_name != 'pull_request' || github.base_ref != 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - name: Cache pinned browser and shader tools
        uses: actions/cache@v4
        with:
          path: |
            out/host-tools/emsdk
            out/shader-tools/slang
            out/shader-tools/slang.tar.gz
            out/shader-tools/spirv-tools
            out/shader-tools/spirv-tools.deb
            out/shader-tools/spirv-cross
            out/shader-tools/spirv-cross-src/spirv-cross.tar.gz
          key: web-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/web_toolchain.json', 'config/shader_toolchain.json', 'config/spirv_cross_toolchain.json') }}
      - name: Prepare host tools and pinned SDK
        run: |
          llvm_major="$(python3 -c 'import json; print(int(json.load(open("config/tool_versions.json"))["minimum"]["clang"].split(".")[0]))')"
          if [[ -f scripts/python/llvm_apt_source.py ]]; then python3 scripts/python/llvm_apt_source.py; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq "clang-$llvm_major" "clang-format-$llvm_major" "clang-tidy-$llvm_major" python3-venv
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys
          import urllib.request

          sys.path.insert(0, str(Path('scripts/python').resolve()))
          from engine import configure_system_tool_shims

          versions = json.loads(Path('config/tool_versions.json').read_text())
          configure_system_tool_shims(Path.cwd(), versions)
          native = versions['managed']
          web = json.loads(Path('config/web_toolchain.json').read_text())
          venv = Path('out/host-tools/venv')
          subprocess.run(['python3', '-m', 'venv', str(venv)], check=True)
          subprocess.run([str(venv / 'bin/pip'), 'install',
                          f"cmake=={native['cmake']}", f"ninja=={native['ninja']}"], check=True)
          sdk = Path('out/host-tools/emsdk')
          if not (sdk / 'emsdk').is_file():
              archive = Path('out/host-tools/emsdk.tar.gz')
              urllib.request.urlretrieve(web['emsdk_archive'], archive)
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == web['emsdk_archive_sha256']
              sdk.mkdir(parents=True, exist_ok=True)
              subprocess.run(['tar', '-xzf', str(archive), '--strip-components=1', '-C', str(sdk)], check=True)
          subprocess.run([str(sdk / 'emsdk'), 'install', web['emscripten']], check=True)
          subprocess.run([str(sdk / 'emsdk'), 'activate', web['emscripten']], check=True)
          PY
          ./scripts/shader-probe bootstrap
          ./scripts/bootstrap-spirv-cross
      - name: Build and analyze both probe configurations
        run: |
          ./scripts/webgpu-probe build
          ./scripts/webgpu-probe check
          ./scripts/webgpu-probe build --configuration Release
          ./scripts/webgpu-probe check --configuration Release
          ./scripts/webgpu-probe package --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: webgpu-probe-release
          path: out/packages/webgpu-probe-release.zip
          if-no-files-found: error

      - name: Build and validate browser modules and smoke application
        run: |
          ./scripts/doctor web-emscripten-development
          ./scripts/test web-emscripten-development
          ./scripts/check web-emscripten-development --all
          ./scripts/test web-emscripten-release
          ./scripts/check web-emscripten-release --all
      - name: Build an installed portable raster browser SDK consumer
        run: |
          out/host-tools/venv/bin/cmake --install out/build/web-emscripten-development --prefix "$PWD/out/install/raster-web-sdk"
          . out/host-tools/emsdk/emsdk_env.sh
          out/host-tools/venv/bin/cmake -S tests/sdk_consumer/raster -B out/build/raster-web-sdk -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/out/host-tools/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DCMAKE_MAKE_PROGRAM="$PWD/out/host-tools/venv/bin/ninja" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="$PWD/out/install/raster-web-sdk" \
            -DLudus_DIR="$PWD/out/install/raster-web-sdk/lib/cmake/Ludus" \
            -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc" \
            -DLUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            -DLUDUS_SPIRV_CROSS="$PWD/out/shader-tools/spirv-cross/bin/spirv-cross"
          out/host-tools/venv/bin/cmake --build out/build/raster-web-sdk --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
      - name: Build installed L0/L1/L2/L3/L4 renderer and RG3 runtime browser SDK consumers
        run: |
          out/host-tools/venv/bin/cmake --install out/build/web-emscripten-development --prefix "$PWD/out/install/raster-web-sdk"
          . out/host-tools/emsdk/emsdk_env.sh
          out/host-tools/venv/bin/cmake -S tests/sdk_consumer/renderer -B out/build/renderer-web-sdk -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/out/host-tools/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DCMAKE_MAKE_PROGRAM="$PWD/out/host-tools/venv/bin/ninja" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="$PWD/out/install/raster-web-sdk" \
            -DLudus_DIR="$PWD/out/install/raster-web-sdk/lib/cmake/Ludus" \
            -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc" \
            -DLUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            -DLUDUS_SPIRV_CROSS="$PWD/out/shader-tools/spirv-cross/bin/spirv-cross"
          out/host-tools/venv/bin/cmake --build out/build/renderer-web-sdk --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-web-sdk-consumer
          path: |
            out/build/renderer-web-sdk/renderer.js
            out/build/renderer-web-sdk/renderer.wasm
            out/build/renderer-web-sdk/renderer.html
            out/build/renderer-web-sdk/renderer-views.js
            out/build/renderer-web-sdk/renderer-views.wasm
            out/build/renderer-web-sdk/renderer-views.html
            out/build/renderer-web-sdk/renderer-overlays.js
            out/build/renderer-web-sdk/renderer-materials.js
            out/build/renderer-web-sdk/renderer-overlays.wasm
            out/build/renderer-web-sdk/renderer-materials.wasm
            out/build/renderer-web-sdk/renderer-overlays.html
            out/build/renderer-web-sdk/renderer-materials.html
            out/build/renderer-web-sdk/renderer-lighting.js
            out/build/renderer-web-sdk/renderer-lighting.wasm
            out/build/renderer-web-sdk/renderer-lighting.html
            out/build/renderer-web-sdk/renderer-scaling.js
            out/build/renderer-web-sdk/renderer-scaling.wasm
            out/build/renderer-web-sdk/renderer-scaling.html
            out/build/renderer-web-sdk/render-graph-runtime.js
            out/build/renderer-web-sdk/render-graph-runtime.wasm
            out/build/renderer-web-sdk/render-graph-runtime.html
            out/build/renderer-web-sdk/render-graph-pooling.js
            out/build/renderer-web-sdk/render-graph-pooling.wasm
            out/build/renderer-web-sdk/render-graph-pooling.html
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: raster-web-sdk-consumer
          path: |
            out/build/raster-web-sdk/raster.js
            out/build/raster-web-sdk/raster.wasm
            out/build/raster-web-sdk/raster.html
            out/build/raster-web-sdk/r6.js
            out/build/raster-web-sdk/r6.wasm
            out/build/raster-web-sdk/r6.html
            out/build/raster-web-sdk/r8.js
            out/build/raster-web-sdk/r8.wasm
            out/build/raster-web-sdk/r8.html
            out/build/raster-web-sdk/r9.js
            out/build/raster-web-sdk/r9.wasm
            out/build/raster-web-sdk/r9.html
            out/build/raster-web-sdk/r10.js
            out/build/raster-web-sdk/r10.wasm
            out/build/raster-web-sdk/r10.html
            out/build/raster-web-sdk/r11.js
            out/build/raster-web-sdk/r11.wasm
            out/build/raster-web-sdk/r11.html
            out/build/raster-web-sdk/r18c.js
            out/build/raster-web-sdk/r18c.wasm
            out/build/raster-web-sdk/r18c.html
            out/build/raster-web-sdk/random_parity.js
            out/build/raster-web-sdk/random_parity.wasm
            out/build/raster-web-sdk/random_parity.html
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: web-foundation-probes
          path: |
            out/build/web-emscripten-development/tools/web-foundation-probe/index.*
            out/build/web-emscripten-release/tools/web-foundation-probe/index.*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: web-observability-probes
          path: |
            out/build/web-emscripten-development/tools/web-observability-probe/index.*
            out/build/web-emscripten-release/tools/web-observability-probe/index.*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: web-platform-probes
          path: |
            out/build/web-emscripten-development/tools/web-platform-probe/index.*
            out/build/web-emscripten-release/tools/web-platform-probe/index.*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: web-rhi-probes
          path: |
            out/build/web-emscripten-development/tools/web-rhi-probe/index.*
            out/build/web-emscripten-release/tools/web-rhi-probe/index.*
          if-no-files-found: error

      - name: Upload W5 frame probes
        uses: actions/upload-artifact@v4
        with:
          name: web-frame-probes
          path: |
            out/build/web-emscripten-development/tools/web-frame-probe/index.*
            out/build/web-emscripten-release/tools/web-frame-probe/index.*
          if-no-files-found: error

      - name: Build and analyze C0 camera renderer on both browser profiles
        run: |
          for preset in web-emscripten-development web-emscripten-release; do
            out/host-tools/venv/bin/cmake --preset "$preset" -DLUDUS_BUILD_WORLD_DEMO=ON
            out/host-tools/venv/bin/cmake --build --preset "$preset" --target ludus_world_demo --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
            ./scripts/check "$preset" --tidy
          done
      - name: Review complete browser analyzer baselines
        if: inputs.batch_sha == '' && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          failed=0
          for preset in web-emscripten-development web-emscripten-release; do
            ./scripts/check "$preset" --analyzer || failed=1
          done
          exit "$failed"
      - name: Preserve browser analysis inventories and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-browser
          path: out/quality/analysis/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: world-camera-web-release
          path: out/build/web-emscripten-release/apps/world_demo/index.*
          if-no-files-found: error

      - name: Upload integrated browser smoke apps
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-apps
          path: |
            out/build/web-emscripten-development/apps/smoke/index.*
            out/build/web-emscripten-release/apps/smoke/index.*
          if-no-files-found: error

      - name: Validate and package integrated Release app
        run: |
          python3 -m unittest discover -s scripts/python -p 'test_web_package.py' -v
          ./scripts/package-web
      - name: Validate private S0 Luau wasm interpreter profile
        run: |
          ./scripts/luau-probe bootstrap
          ./scripts/luau-probe cook
          ./scripts/luau-probe run --preset web-emscripten-development
          ./scripts/luau-probe run --preset web-emscripten-release
          ./scripts/luau-probe check --preset web-emscripten-development
          ./scripts/luau-probe check --preset web-emscripten-release
      - name: Validate S1 native/Luau interaction in wasm
        run: |
          ./scripts/script-interaction bootstrap
          ./scripts/script-interaction cook
          ./scripts/script-interaction run --preset web-emscripten-development
          ./scripts/script-interaction run --preset web-emscripten-release
          ./scripts/script-interaction check --preset web-emscripten-development
          ./scripts/script-interaction check --preset web-emscripten-release
      - name: Validate S2 source debugger and transactional replacement in wasm
        run: |
          ./scripts/script-session cook
          ./scripts/script-session run --preset web-emscripten-development
          ./scripts/script-session run --preset web-emscripten-release
          ./scripts/script-session check --preset web-emscripten-development
          ./scripts/script-session check --preset web-emscripten-release
      - name: Validate S4 public provider and shipping package in Wasm
        run: |
          ./scripts/script-provider run --preset web-emscripten-development
          ./scripts/script-provider run --preset web-emscripten-release
          ./scripts/script-provider check --preset web-emscripten-development
          ./scripts/script-provider check --preset web-emscripten-release
      - name: Validate S3 generated graph, text equivalence and node debugger in Wasm
        run: |
          ./scripts/visual-sequence run --preset web-emscripten-development
          ./scripts/visual-sequence run --preset web-emscripten-release
          ./scripts/visual-sequence check --preset web-emscripten-development
          ./scripts/visual-sequence check --preset web-emscripten-release
      - uses: actions/upload-artifact@v4
        with:
          name: behavior-s6-wasm
          path: |
            out/build/web-emscripten-release/tools/script-provider/ludus_behavior_safety.*
            out/build/web-emscripten-release/tools/script-provider/index.html
            out/build/web-emscripten-release/tools/script-provider/safety-evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: visual-s3-wasm-owner
          path: out/build/web-emscripten-release/tools/visual-sequence/ludus_visual_sequence.*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: luau-s2-web-session
          path: |
            out/build/web-emscripten-release/tools/script-session/ludus_script_session.*
            out/build/web-emscripten-release/tools/script-session/index.html
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: luau-s2-cook-evidence
          path: out/script-session/cooked/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: luau-s1-web-interaction
          path: |
            out/build/web-emscripten-release/tools/script-interaction/ludus_script_luau.*
            out/build/web-emscripten-release/tools/script-interaction/index.html
            out/build/web-emscripten-release/tools/script-interaction/*LICENSE.txt
            out/build/web-emscripten-release/tools/script-interaction/*evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: luau-s0-web-probes
          path: |
            out/build/web-emscripten-development/tools/luau-probe/index.*
            out/build/web-emscripten-release/tools/luau-probe/index.*
            out/build/web-emscripten-release/tools/luau-probe/*LICENSE.txt
            out/build/web-emscripten-development/tools/luau-probe/evidence.json
            out/build/web-emscripten-release/tools/luau-probe/evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ludus-web-smoke-release
          path: out/packages/ludus-web-smoke-release.zip
          if-no-files-found: error

  localization-icu-wasm:
    if: github.event_name != 'pull_request' || github.base_ref != 'develop'
    # Separate runner: the ICU host data build and two wasm ICU compiles would
    # push compile-and-package past its timeout.
    name: L0 ICU backend probe (wasm)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - name: Cache pinned browser and shader tools
        uses: actions/cache@v4
        with:
          path: |
            out/host-tools/emsdk
            out/shader-tools/slang
            out/shader-tools/slang.tar.gz
            out/shader-tools/spirv-tools
            out/shader-tools/spirv-tools.deb
            out/shader-tools/spirv-cross
            out/shader-tools/spirv-cross-src/spirv-cross.tar.gz
          key: web-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/web_toolchain.json', 'config/shader_toolchain.json', 'config/spirv_cross_toolchain.json') }}
      - name: Prepare host tools and pinned SDK
        run: |
          llvm_major="$(python3 -c 'import json; print(int(json.load(open("config/tool_versions.json"))["minimum"]["clang"].split(".")[0]))')"
          if [[ -f scripts/python/llvm_apt_source.py ]]; then python3 scripts/python/llvm_apt_source.py; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq "clang-$llvm_major" "clang-format-$llvm_major" "clang-tidy-$llvm_major" python3-venv
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys
          import urllib.request

          sys.path.insert(0, str(Path('scripts/python').resolve()))
          from engine import configure_system_tool_shims

          versions = json.loads(Path('config/tool_versions.json').read_text())
          configure_system_tool_shims(Path.cwd(), versions)
          native = versions['managed']
          web = json.loads(Path('config/web_toolchain.json').read_text())
          venv = Path('out/host-tools/venv')
          subprocess.run(['python3', '-m', 'venv', str(venv)], check=True)
          subprocess.run([str(venv / 'bin/pip'), 'install',
                          f"cmake=={native['cmake']}", f"ninja=={native['ninja']}"], check=True)
          sdk = Path('out/host-tools/emsdk')
          if not (sdk / 'emsdk').is_file():
              archive = Path('out/host-tools/emsdk.tar.gz')
              urllib.request.urlretrieve(web['emsdk_archive'], archive)
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == web['emsdk_archive_sha256']
              sdk.mkdir(parents=True, exist_ok=True)
              subprocess.run(['tar', '-xzf', str(archive), '--strip-components=1', '-C', str(sdk)], check=True)
          subprocess.run([str(sdk / 'emsdk'), 'install', web['emscripten']], check=True)
          subprocess.run([str(sdk / 'emsdk'), 'activate', web['emscripten']], check=True)
          PY
          ./scripts/shader-probe bootstrap
          ./scripts/bootstrap-spirv-cross
      - name: Cache pinned L0 ICU archives, host data tools and sliced data
        uses: actions/cache@v4
        with:
          path: |
            out/icu-probe/icu4c-sources.tgz
            out/icu-probe/icu4c-data.zip
            out/icu-probe/source
            out/icu-probe/host-build
            out/icu-probe/data
          key: icu-probe-v1-${{ runner.os }}-${{ hashFiles('config/icu_toolchain.json', 'tools/icu-probe/data-filter.json', 'scripts/icu-probe') }}
      - name: Validate L0 ICU backend, L2 formatting and allocation-failure sweeps in wasm
        run: |
          ./scripts/icu-probe bootstrap
          ./scripts/icu-probe cook
          ./scripts/icu-probe run --preset web-emscripten-development
          ./scripts/icu-probe run --preset web-emscripten-release
          ./scripts/icu-probe check --preset web-emscripten-release
      - uses: actions/upload-artifact@v4
        with:
          name: localization-l0-web-evidence
          path: |
            out/build/web-emscripten-development/tools/icu-probe/evidence.json
            out/build/web-emscripten-release/tools/icu-probe/evidence.json
            out/build/web-emscripten-release/tools/icu-probe/ICU-LICENSE.txt
            out/build/web-emscripten-development/modules/localization/format-evidence.json
            out/build/web-emscripten-release/modules/localization/format-evidence.json
          if-no-files-found: error

  browser-software-gpu:
    name: Packaged browser tests (software GPU)
    needs: compile-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ludus-web-smoke-release
          path: out/packages
      - uses: actions/download-artifact@v4
        with:
          name: luau-s0-web-probes
          path: out/luau-s0-wasm
      - uses: actions/download-artifact@v4
        with:
          name: luau-s2-web-session
          path: out/luau-s2-wasm
      - uses: actions/download-artifact@v4
        with:
          name: behavior-s6-wasm
          path: out/behavior-s6-wasm
      - uses: actions/download-artifact@v4
        with:
          name: luau-s1-web-interaction
          path: out/luau-s1-wasm
      - uses: actions/download-artifact@v4
        with:
          name: raster-web-sdk-consumer
          path: out/raster-web-sdk-consumer
      - uses: actions/download-artifact@v4
        with:
          name: world-camera-web-release
          path: out/world-camera-web-release
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: tools/web-browser-tests/package-lock.json
      - name: Install pinned test runner and Chromium
        working-directory: tools/web-browser-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test exact extracted Release ZIP
        run: |
          python3 -m zipfile -e out/packages/ludus-web-smoke-release.zip out/browser-qa/extracted
          cd tools/web-browser-tests
          xvfb-run -a npm test
      - name: Test installed portable raster pixels, API selection and failures
        run: node tests/sdk_consumer/raster-browser-test.mjs out/raster-web-sdk-consumer out/browser-qa/results/raster
      - name: Check addressed-random GPU parity on WebGPU against the Wasm CPU reference
        run: node tests/sdk_consumer/random-parity-browser-test.mjs out/raster-web-sdk-consumer out/browser-qa/results/random-parity
      - name: Check fixed and follow camera pixels on WebGPU and WebGL
        run: |
          node apps/world_demo/tests/browser-test.mjs out/world-camera-web-release out/browser-qa/results/world-camera-webgpu
          LUDUS_WORLD_WEBGL=1 node apps/world_demo/tests/browser-test.mjs out/world-camera-web-release out/browser-qa/results/world-camera-webgl
      - name: Test S0 wasm recovery and debugger in Chromium
        run: node tools/luau-probe/browser.mjs out/luau-s0-wasm/web-emscripten-release/tools/luau-probe
      - name: Test S2 debugger heartbeat and replacement in Chromium
        run: node tools/script-session/browser.mjs out/luau-s2-wasm
      - name: Qualify production Behavior safety and allocation recovery in Chromium
        run: node tools/script-provider/browser.mjs out/behavior-s6-wasm
      - name: Test S1 state and effect publication in Chromium
        run: node tools/script-interaction/browser.mjs out/luau-s1-wasm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-software-gpu-evidence
          path: out/browser-qa/results
          if-no-files-found: warn

  renderer-browser:
    name: Renderer browser tests (${{ matrix.suite }})
    needs: compile-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [baseline, scaling, pooling]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: renderer-web-sdk-consumer
          path: out/renderer-web-sdk-consumer
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: tools/web-browser-tests/package-lock.json
      - name: Install pinned test runner and Chromium
        working-directory: tools/web-browser-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test installed L0/L1/L2/L3/L4 renderer against direct and cross-backend image oracles
        if: matrix.suite == 'baseline'
        run: node tests/sdk_consumer/renderer-browser-test.mjs out/renderer-web-sdk-consumer out/browser-qa/results/renderer
      - name: Activate an installed RG3 runtime generation on WebGPU and compare its exported pixels
        if: matrix.suite == 'baseline'
        run: node tests/sdk_consumer/render-graph-runtime-browser-test.mjs out/renderer-web-sdk-consumer out/browser-qa/results/render-graph-runtime
      - name: Verify L5 renderer scaling browser pixels
        if: matrix.suite == 'scaling'
        run: node tests/sdk_consumer/renderer-scaling-browser-test.mjs out/renderer-web-sdk-consumer out/browser-qa/results/renderer-l5
      - name: Measure RG4 transient pooling against the serial control on WebGPU
        if: matrix.suite == 'pooling'
        run: node tests/sdk_consumer/render-graph-pooling-browser-test.mjs out/renderer-web-sdk-consumer out/browser-qa/results/render-graph-pooling
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-browser-${{ matrix.suite }}-evidence
          path: out/browser-qa/results
          if-no-files-found: warn
