name: Diagnose Vulkan enumeration under LeakSanitizer
on:
  push:
    branches: [codex/diagnose-ci-vulkan-leaks]

permissions:
  contents: read

jobs:
  enumerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GALLIVM_PERF: nopt
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the qualification toolchain and Vulkan driver
        run: |
          python3 scripts/python/llvm_apt_source.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-23 libclang-rt-23-dev llvm-23 libvulkan-dev libvulkan1 mesa-vulkan-drivers
          dpkg-query -W libc6 libvulkan1 mesa-vulkan-drivers
      - name: Compare Vulkan loader and Lavapipe LeakSanitizer results
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/enumerate.c" <<'C'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <vulkan/vulkan.h>

          enum { LoadFailure = 2, InstanceFailure = 3, EnumerateFailure = 4 };

          int main(int argumentCount, char **arguments)
          {
              void *driver = NULL;
              if (argumentCount == 2)
              {
                  driver = dlopen(arguments[1], RTLD_NOW | RTLD_LOCAL | RTLD_NODELETE);
                  if (driver == NULL)
                  {
                      return LoadFailure;
                  }
              }

              void *loader = dlopen("libvulkan.so.1", RTLD_NOW | RTLD_LOCAL);
              if (loader == NULL)
              {
                  return LoadFailure;
              }
              PFN_vkGetInstanceProcAddr getInstanceProcAddress =
                  (PFN_vkGetInstanceProcAddr)dlsym(loader, "vkGetInstanceProcAddr");
              if (getInstanceProcAddress == NULL)
              {
                  return LoadFailure;
              }
              PFN_vkCreateInstance createInstance =
                  (PFN_vkCreateInstance)getInstanceProcAddress(VK_NULL_HANDLE, "vkCreateInstance");
              if (createInstance == NULL)
              {
                  return LoadFailure;
              }

              const VkApplicationInfo application = {
                  .sType = VK_STRUCTURE_TYPE_APPLICATION_INFO,
                  .apiVersion = VK_API_VERSION_1_1,
              };
              const VkInstanceCreateInfo description = {
                  .sType = VK_STRUCTURE_TYPE_INSTANCE_CREATE_INFO,
                  .pApplicationInfo = &application,
              };
              VkInstance instance = VK_NULL_HANDLE;
              if (createInstance(&description, NULL, &instance) != VK_SUCCESS)
              {
                  return InstanceFailure;
              }
              PFN_vkEnumeratePhysicalDevices enumerateDevices =
                  (PFN_vkEnumeratePhysicalDevices)getInstanceProcAddress(instance, "vkEnumeratePhysicalDevices");
              PFN_vkDestroyInstance destroyInstance =
                  (PFN_vkDestroyInstance)getInstanceProcAddress(instance, "vkDestroyInstance");
              if (enumerateDevices == NULL || destroyInstance == NULL)
              {
                  return LoadFailure;
              }

              uint32_t deviceCount = 0;
              VkResult status = enumerateDevices(instance, &deviceCount, NULL);
              destroyInstance(instance, NULL);
              dlclose(loader);
              if (driver != NULL)
              {
                  dlclose(driver);
              }
              return status == VK_SUCCESS && deviceCount != 0 ? 0 : EnumerateFailure;
          }
          C
          clang-23 -std=c11 -Wall -Wextra -Werror -g -O1 -fno-omit-frame-pointer \
            -fsanitize=address,undefined "$RUNNER_TEMP/enumerate.c" -o "$RUNNER_TEMP/enumerate"
          manifest="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          driver="$(dpkg -L mesa-vulkan-drivers | awk '/\/libvulkan_lvp\.so$/ { print }')"
          test -f "$manifest"
          test -f "$driver"
          run_case() {
            local label="$1"
            shift
            local result=0
            "$@" || result=$?
            echo "$label exit status: $result"
            if [[ "$result" != 0 && "$result" != 1 ]]; then
              return "$result"
            fi
          }
          export ASAN_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer-23
          export VK_LOADER_DEBUG=driver
          run_case default "$RUNNER_TEMP/enumerate"
          run_case lavapipe-only env VK_DRIVER_FILES="$manifest" "$RUNNER_TEMP/enumerate"
          run_case lavapipe-kept-mapped env VK_DRIVER_FILES="$manifest" "$RUNNER_TEMP/enumerate" "$driver"
