          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/audio/tests/device_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/audio/tests/stream_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/audio/content/src/loader.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/audio/content/tests/content_tests.cpp
      - name: Validate installed Audio SDK and native workers
        run: |
          out/host-tools/venv/bin/cmake -S tests/sdk_consumer/audio -B out/sdk-audio-consumer -G Ninja \
            -DCMAKE_CXX_COMPILER="$PWD/out/host-tools/bin/clang++" \
            -DCMAKE_MAKE_PROGRAM="$PWD/out/host-tools/venv/bin/ninja" \
            -DCMAKE_OSX_SYSROOT="$PWD/out/host-tools/macos-sdk" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -nostdinc++ -isystem \"$PWD/out/host-tools/libcxx-include\"" \
            -DCMAKE_PREFIX_PATH="$PWD/out/install/macos-clang-development;$PWD/out/conan/macos-clang-development" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          out/host-tools/venv/bin/cmake --build out/sdk-audio-consumer
          out/sdk-audio-consumer/ludus_audio_consumer
          out/host-tools/bin/clang-tidy -p out/sdk-audio-consumer --warnings-as-errors='*' tests/sdk_consumer/audio.cpp
      - name: Validate installed persistence and watcher SDK
        run: |
          out/host-tools/venv/bin/cmake -S tests/sdk_consumer/persistence -B out/sdk-persistence-consumer -G Ninja \
            -DCMAKE_CXX_COMPILER="$PWD/out/host-tools/bin/clang++" \
            -DCMAKE_MAKE_PROGRAM="$PWD/out/host-tools/venv/bin/ninja" \
            -DCMAKE_OSX_SYSROOT="$PWD/out/host-tools/macos-sdk" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -nostdinc++ -isystem \"$PWD/out/host-tools/libcxx-include\"" \
            -DCMAKE_PREFIX_PATH="$PWD/out/install/macos-clang-development;$PWD/out/conan/macos-clang-development" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          out/host-tools/venv/bin/cmake --build out/sdk-persistence-consumer
          out/sdk-persistence-consumer/ludus_persistence_consumer
          out/host-tools/bin/clang-tidy -p out/sdk-persistence-consumer --warnings-as-errors='*' tests/sdk_consumer/persistence.cpp
      - name: Preserve native Behavior evidence
        uses: actions/upload-artifact@v4
        with:
          name: behavior-s6-macos-native-evidence
          path: out/build/macos-clang-development/tools/script-provider/safety-evidence.json
          if-no-files-found: error
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null 2>&1; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save locked macOS dependencies
        if: success() && steps.setup.outputs.dependency-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/conan/home
          key: ${{ steps.setup.outputs.dependency-cache-key }}
      - name: Save macOS compiler outputs
        if: success() && steps.setup.outputs.compiler-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/ccache
          key: ${{ steps.setup.outputs.compiler-cache-key }}

  macos-sanitizers:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration'
    name: macOS ASan and UBSan
    runs-on: macos-15
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/macos-setup
        id: setup
        with:
          preset: macos-clang-asan-ubsan
          cache-variant: sanitizers
      - name: Configure sanitized Behavior provider
        run: out/host-tools/venv/bin/cmake --preset macos-clang-asan-ubsan -DLUDUS_BUILD_BEHAVIOR=ON -DLUDUS_BUILD_BEHAVIOR_ACCEPTANCE=ON
      - name: Validate Cocoa, Metal, filesystem, threading, Content and Audio with ASan and UBSan
        env:
          LUDUS_TEST_COCOA: "1"
        run: |
          out/host-tools/venv/bin/cmake --preset macos-clang-asan-ubsan -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc" -DLUDUS_EDITOR_RENDER_PREVIEW=ON
          out/host-tools/venv/bin/cmake --build --preset macos-clang-asan-ubsan --target ludus_editor_tests ludus_game_host_app ludus_game_host_loader_tests ludus_game_host_session_tests ludus_game_host_reload_tests ludus_game_host_protocol_tests ludus_game_fixture_C ludus_game_fixture_D ludus_game_fixture_H ludus_audio_tests ludus_audio_content_tests ludus_rhi_lifecycle_tests ludus_rhi_metal_tests ludus_rhi_render_tests ludus_platform_cocoa_tests ludus_platform_cocoa_keymap_tests ludus_filesystem_tests ludus_filesystem_fault_tests ludus_filesystem_namespace_fault_tests ludus_filesystem_pack_fault_tests ludus_filesystem_async_fault_tests ludus_filesystem_persistence_fault_tests ludus_filesystem_watch_fault_tests ludus_foundation_threading_tests ludus_content_tests ludus_content_save_fault_tests

          out/host-tools/venv/bin/cmake --build --preset macos-clang-asan-ubsan --target ludus_asan_control_child ludus_ubsan_control_child
          out/host-tools/venv/bin/ctest --preset macos-clang-asan-ubsan --label-regex sanitizer-control --output-on-failure --no-tests=error
          out/host-tools/venv/bin/ctest --preset macos-clang-asan-ubsan --tests-regex '^ludus_((platform_cocoa(_keymap)?|filesystem(_fault|_namespace_fault|_pack_fault|_async_fault|_persistence_fault|_watch_fault)?|foundation_threading|content(_save_fault)?|audio(_device|_content)?|rhi_(metal|lifecycle))_tests|rhi_render_pixels)$' --no-tests=error
          out/host-tools/venv/bin/ctest --preset macos-clang-asan-ubsan --label-regex '^(editor|loader|session|reload|protocol)$' --no-tests=error
          QT_QPA_PLATFORM=cocoa out/build/macos-clang-asan-ubsan/apps/editor/ludus_editor_tests '[.render-native],[.level-native]'

      - name: Preserve macOS sanitizer control diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-sanitizer-controls
          path: out/build/macos-clang-asan-ubsan/tests/quality/*-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Qualify production Behavior provider with macOS sanitizers
        run: ./scripts/script-provider run --preset macos-clang-asan-ubsan
      - uses: actions/upload-artifact@v4
        with:
          name: behavior-s6-macos-sanitizer-evidence
          path: out/build/macos-clang-*/tools/script-provider/safety-evidence.json
          if-no-files-found: error

      - name: Validate diagnostic stream and explicit decisions with ASan and UBSan
        run: |
          ./init.sh --cli --preset macos-clang-debug --preset-only --locked --with-tests --no-system-install
          out/host-tools/venv/bin/cmake --preset macos-clang-debug -B out/build/macos-diagnostics-sanitized -DLUDUS_CI_BUILD=OFF -DLUDUS_ENABLE_ASAN=ON -DLUDUS_ENABLE_UBSAN=ON -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc"
          out/host-tools/venv/bin/cmake --build out/build/macos-diagnostics-sanitized --target ludus_diagnostic_startup_child ludus_assert_decision_child
          out/host-tools/venv/bin/ctest --test-dir out/build/macos-diagnostics-sanitized --label-regex diagnostic-startup --output-on-failure --no-tests=error

      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null 2>&1; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save locked macOS dependencies
        if: success() && steps.setup.outputs.dependency-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/conan/home
          key: ${{ steps.setup.outputs.dependency-cache-key }}
      - name: Save macOS compiler outputs
        if: success() && steps.setup.outputs.compiler-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/ccache
          key: ${{ steps.setup.outputs.compiler-cache-key }}

  macos-analysis:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier == 'nightly'
    name: macOS analyzer baseline
    runs-on: macos-15
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      LUDUS_TIDY_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
