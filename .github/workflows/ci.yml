name: ci
run-name: ${{ (inputs.sanitizer_experiment == 'rebuild' || inputs.sanitizer_experiment == 'shared') && format('Linux sanitizer experiment ({0})', inputs.sanitizer_experiment) || '' }}

on:
  # The batch coordinator owns periodic full validation. Promotion does not
  # trigger another full build; batch runs on main also warm its shared caches.
  schedule:
    - cron: '17 9 * * *'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      batch_sha:
        description: Frozen develop commit selected by the trusted batch coordinator.
        required: true
        type: string
      batch_base_sha:
        description: Stable main commit captured with this candidate.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      mcmc_vulkan_parity_only:
        description: Run only the CPU/Mesa Vulkan MH and Jump Restore parity and capture checks.
        type: boolean
        default: false
      sanitizer_experiment:
        description: Run only the four Linux ASan/UBSan shards with independent or shared builds.
        type: choice
        default: 'off'
        options:
          - 'off'
          - rebuild
          - shared
      validation_tier:
        description: Match promotion qualification or include advisory nightly analysis.
        type: choice
        default: nightly
        options:
          - full
          - nightly
      evidence_job:
        description: >-
          Run only this native job (and Classify changes) to prove a Batch-Fix; all runs
          every job. Develop health prints the value for each failed batch job.
        type: choice
        default: all
        options:
          - all
          - macos-compile
          - macos-reference
          - macos-sanitizers
          - macos-analysis
          - formatting
          - debug-runtime
          - development
          - sanitizers
          - filesystem-fuzz
          - threading-races
          - analysis
          - editor
          - assertion-policy
          - pch
          - build-budget
          - scripting-qualification

permissions:
  contents: read

# Thanks to GitHub's "Concurrency" guidance: superseded PR checks can cancel.
# https://docs.github.com/en/actions/concepts/workflows-and-actions/concurrency
# Only a new or reopened head runs this workflow, so each PR has one group and a
# push cancels the run for the previous commit. Description edits and marking a
# draft ready change no file; Develop health owns the description
# (docs/development/continuous-integration.md#pull-request-runner-budget).
concurrency:
  group: ci-${{ inputs.batch_sha || github.ref }}${{ (inputs.sanitizer_experiment == 'shared' || inputs.sanitizer_experiment == 'rebuild') && format('-sanitizers-{0}', inputs.sanitizer_experiment) || '' }}${{ inputs.evidence_job && inputs.evidence_job != 'all' && format('-evidence-{0}', inputs.evidence_job) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  LUDUS_DIAGNOSTIC_INTERACTIVE: "0"
  # Match hosted runner cores; the uncached budget retains two for comparability.
  # Thanks to GitHub, "GitHub-hosted runners", standard public runner capacities:
  # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  LUDUS_CI_BATCH_SHA: ${{ inputs.batch_sha }}
  LUDUS_CI_COMMIT_SHA: ${{ inputs.batch_sha || github.sha }}

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch' || (inputs.mcmc_vulkan_parity_only != true && inputs.sanitizer_experiment != 'rebuild' && inputs.sanitizer_experiment != 'shared')
    name: Classify changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      native_image: ${{ steps.image.outputs.image }}
      image_recipe_changed: ${{ steps.image.outputs.recipe_changed }}
      camera_pilot: ${{ steps.scope.outputs.camera_pilot }}
      native_required: ${{ steps.scope.outputs.native_required }}
      validation_tier: ${{ steps.scope.outputs.validation_tier }}
      objcxx_changed: ${{ steps.scope.outputs.objcxx_changed }}
      objcxx_editor: ${{ steps.scope.outputs.objcxx_editor }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/change-scope
        id: scope
      - name: Find the native PR image for this revision
        id: image
        if: steps.scope.outputs.validation_tier == 'integration' && steps.scope.outputs.native_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/actions/native-image/image.sh resolve

  mcmc-vulkan-parity:
    if: github.event_name == 'workflow_dispatch' && inputs.mcmc_vulkan_parity_only == true && inputs.sanitizer_experiment != 'rebuild' && inputs.sanitizer_experiment != 'shared'
    name: MH and Jump Restore Vulkan parity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
      - name: Prepare Vulkan and the pinned shader tools
        run: |
          bash .github/actions/apt-install/apt-install.sh libvulkan1 mesa-vulkan-drivers vulkan-tools vulkan-validationlayers
          ./scripts/shader-probe bootstrap
          ./scripts/bootstrap-spirv-cross
      - name: Build CPU oracle, GPU parity and both template configurations
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development \
            -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc" \
            -DLUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            -DLUDUS_SPIRV_CROSS="$PWD/out/shader-tools/spirv-cross/bin/spirv-cross"
          out/host-tools/venv/bin/cmake --build out/build/linux-clang-development \
            --target ludus_metropolis_tests ludus_renderer_render_tests ludus_metropolis_graph_tests \
            --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          mkdir -p out/mcmc-vulkan
          shader_directory=out/build/linux-clang-development/modules/graphics/renderer/ludus-shaders/ludus_renderer_render_tests/metropolis_parity
          cp "$shader_directory/metropolis_parity.compute.spv" "$shader_directory/manifest.json" out/mcmc-vulkan/
      - name: Run with Mesa Vulkan and validation layers; reject skipped tests
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          set -euo pipefail
          has_failed=0
          mkdir -p out/mcmc-vulkan
          git rev-parse HEAD | tee out/mcmc-vulkan/commit.txt
          vulkaninfo --summary 2>&1 | tee out/mcmc-vulkan/adapter.log
          out/build/linux-clang-development/modules/graphics/renderer/ludus_metropolis_tests 2>&1 | tee out/mcmc-vulkan/cpu.log || has_failed=1
          out/build/linux-clang-development/modules/graphics/renderer/ludus_renderer_render_tests '[metropolis]' 2>&1 | tee out/mcmc-vulkan/parity.log || has_failed=1
          out/build/linux-clang-development/modules/graphics/renderer/ludus_metropolis_graph_tests 2>&1 | tee out/mcmc-vulkan/captures.log || has_failed=1
          python3 - <<'PY'
          from pathlib import Path
          for name in ('cpu', 'parity', 'captures'):
              text = Path(f'out/mcmc-vulkan/{name}.log').read_text()
              assert 'All tests passed' in text, text
              assert 'skipped' not in text.lower(), text
              assert 'validation error' not in text.lower() and 'VUID-' not in text, text
          PY
          exit "$has_failed"
      - name: Preserve Vulkan parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcmc-vulkan-parity
          path: out/mcmc-vulkan/
          if-no-files-found: warn

  # Thanks to GitHub Actions runner-images, macOS 14 deprecation announcement #13518:
  # https://github.com/actions/runner-images/issues/13518
  # Keep arm64 native coverage on macOS 15; SDKs still declare a 14.0 deployment floor.
  # Native/SDK acceptance, the longest and most often failing ARM job, runs beside
  # the sanitizers so its failures report without waiting for them. Hosted ARM
  # capacity can still expire a queued job; batch-runner-retry.yml re-runs such a
  # job after the batch completes, when it asks for one runner alone. The nightly
  # analyzer waits for the shorter sanitizer lane, so this workflow holds at most
  # two ARM runners. A preceding failure must not suppress the analyzer's evidence.
  # Thanks to GitHub, "Evaluate expressions in workflows and actions", status checks:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions
  macos-compile:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration' && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'macos-compile')
    name: macOS native backends and diagnostics
    runs-on: macos-15
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      LUDUS_TIDY_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/macos-setup
        id: setup
        with:
          preset: macos-clang-development
          cache-variant: native
          build-editor: 'false'
      # Every command of this job lives in scripts/ci/macos_native.py, which the candidate owns: a
      # batch runs main's workflow definitions, so commands here would change only after promotion.
      # The runner continues past a failed check, skips only checks that need it, and reports all.
      - name: Run macOS native checks
        id: checks
        run: out/host-tools/venv/bin/python scripts/python/ci_checks.py scripts/ci/macos_native.py
      - name: Preserve per-test macOS timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-tests
          path: ${{ runner.temp }}/macos-native-tests.xml
          if-no-files-found: warn
      - name: Upload cooked patch seam captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-seam-metal
          path: out/renderer-sdk/patch-seam/raster/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload RG4 pooling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rg4-pooling-metal
          path: out/rg4-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve mesh-light shadow measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-shadow-metal
          path: |
            out/shadow-worlds/
            out/build/macos-clang-development/modules/graphics/renderer/ludus-graphs/ludus_renderer_render_tests/rg2_clustered_Default/rg2_clustered_Default.lurgrt
          if-no-files-found: warn
      - name: Preserve native Behavior evidence
        if: ${{ !cancelled() && steps.checks.outputs.behavior-provider == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: behavior-s6-macos-native-evidence
          path: out/build/macos-clang-development/tools/script-provider/safety-evidence.json
          if-no-files-found: error
      # A native crash with no stderr, such as a system-library trap (SIGTRAP), leaves only a
      # macOS crash report. Keep the reports of a failed job's test processes.
      - name: Preserve macOS crash reports
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/crash-reports"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \( -name '*.ips' -o -name '*.crash' \) \
            -exec cp {} "$RUNNER_TEMP/crash-reports/" \; 2>/dev/null || true
          ls "$RUNNER_TEMP/crash-reports"
      - name: Upload macOS crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-crash-reports
          path: ${{ runner.temp }}/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null 2>&1; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save locked macOS dependencies
        if: success() && steps.setup.outputs.dependency-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/conan/home
          key: ${{ steps.setup.outputs.dependency-cache-key }}
      - name: Save macOS compiler outputs
        if: ${{ !cancelled() && steps.checks.outputs.build == 'success' && steps.setup.outputs.compiler-cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: out/ccache
          key: ${{ steps.setup.outputs.compiler-cache-key }}

  # The CPU/GPU reference oracle cases, 30 minutes of the native job, run here beside it.
  # Together with the native job and the sanitizers this holds three ARM runners; the
  # batch's short macOS chain adds at most one (batch-ci.yml).
  macos-reference:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration' && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'macos-reference')
    name: macOS GPU reference oracle
    runs-on: macos-15
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/macos-setup
        id: setup
        with:
          preset: macos-clang-development
          cache-variant: native
          build-editor: 'false'
      # Commands live in scripts/ci/macos_reference.py (see the macos-compile job). This job
      # restores the native job's compiler cache and never saves it.
      - name: Run macOS GPU reference checks
        id: checks
        run: out/host-tools/venv/bin/python scripts/python/ci_checks.py scripts/ci/macos_reference.py
      - name: Preserve per-test reference timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-reference-tests
          path: ${{ runner.temp }}/macos-reference-tests.xml
          if-no-files-found: warn
      - name: Preserve macOS crash reports
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/crash-reports"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \( -name '*.ips' -o -name '*.crash' \) \
            -exec cp {} "$RUNNER_TEMP/crash-reports/" \; 2>/dev/null || true
          ls "$RUNNER_TEMP/crash-reports"
      - name: Upload macOS crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-reference-crash-reports
          path: ${{ runner.temp }}/crash-reports/
          if-no-files-found: ignore
          retention-days: 14

  macos-sanitizers:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration' && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'macos-sanitizers')
    name: macOS ASan and UBSan
    runs-on: macos-15
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/macos-setup
        id: setup
        with:
          preset: macos-clang-asan-ubsan
          cache-variant: sanitizers
          build-editor: 'false'
      - name: Build the macOS sanitizer qualification targets
        id: build
        env:
          CONAN_HOME: ${{ github.workspace }}/out/conan/home
          CONAN_NON_INTERACTIVE: "1"
        run: |
          export PATH="$PWD/out/host-tools/bin:$PWD/out/host-tools/venv/bin:$PATH"
          out/host-tools/venv/bin/cmake -S . -B out/build/macos-clang-asan-ubsan \
            -DLUDUS_BUILD_BEHAVIOR=ON -DLUDUS_BUILD_BEHAVIOR_ACCEPTANCE=ON -DLUDUS_WARNINGS_AS_ERRORS=ON
          out/host-tools/venv/bin/cmake --build --preset macos-clang-asan-ubsan --target \
            ludus_editor ludus_editor_tests ludus_game_host_app \
            ludus_game_host_loader_tests ludus_game_host_session_tests ludus_game_host_reload_tests \
            ludus_game_host_protocol_tests ludus_game_fixture_C ludus_game_fixture_D \
            ludus_game_fixture_H ludus_audio_tests ludus_audio_content_tests \
            ludus_rhi_lifecycle_tests ludus_rhi_metal_tests ludus_rhi_render_tests \
            ludus_platform_cocoa_tests ludus_platform_cocoa_keymap_tests ludus_filesystem_tests \
            ludus_filesystem_fault_tests ludus_filesystem_namespace_fault_tests ludus_filesystem_pack_fault_tests \
            ludus_filesystem_async_fault_tests ludus_filesystem_persistence_fault_tests ludus_filesystem_watch_fault_tests \
            ludus_foundation_threading_tests ludus_content_tests ludus_content_save_fault_tests \
            ludus_asan_control_child ludus_ubsan_control_child ludus_behavior_acceptance \
            ludus_behavior_safety ludus_behavior_allocator_contract ludus_behavior_tests
      - name: Validate Cocoa, Metal, filesystem, threading, Content and Audio with ASan and UBSan
        env:
          LUDUS_TEST_COCOA: "1"
        run: |
          out/host-tools/venv/bin/ctest --preset macos-clang-asan-ubsan --label-regex sanitizer-control --output-on-failure --no-tests=error --output-junit "$RUNNER_TEMP/macos-sanitizer-controls.xml"
          out/host-tools/venv/bin/ctest --preset macos-clang-asan-ubsan --tests-regex '^ludus_((platform_cocoa(_keymap)?|filesystem(_fault|_namespace_fault|_pack_fault|_async_fault|_persistence_fault|_watch_fault)?|foundation_threading|content(_save_fault)?|audio(_device|_content)?|rhi_(metal|lifecycle))_tests|rhi_render_pixels)$' --no-tests=error --output-junit "$RUNNER_TEMP/macos-sanitizer-native.xml"
          out/host-tools/venv/bin/ctest --preset macos-clang-asan-ubsan --label-regex '^(editor|loader|session|reload|protocol)$' --no-tests=error --output-junit "$RUNNER_TEMP/macos-sanitizer-editor.xml"
          QT_QPA_PLATFORM=cocoa out/build/macos-clang-asan-ubsan/apps/editor/ludus_editor_tests '[.render-native],[.level-native]'

      - name: Preserve macOS sanitizer control diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-sanitizer-controls
          path: out/build/macos-clang-asan-ubsan/tests/quality/*-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Qualify production Behavior provider with macOS sanitizers
        run: out/host-tools/venv/bin/ctest --preset macos-clang-asan-ubsan --tests-regex '^ludus_behavior_' --output-on-failure --no-tests=error --output-junit "$RUNNER_TEMP/macos-sanitizer-behavior.xml"
      - name: Report CTest timeout headroom
        if: always()
        run: >-
          python3 scripts/python/ctest_headroom.py out/build/macos-clang-asan-ubsan --ctest out/host-tools/venv/bin/ctest
          --junit "$RUNNER_TEMP/macos-sanitizer-controls.xml" --junit "$RUNNER_TEMP/macos-sanitizer-native.xml" --junit "$RUNNER_TEMP/macos-sanitizer-editor.xml" --junit "$RUNNER_TEMP/macos-sanitizer-behavior.xml"
          --title "macOS ASan and UBSan: CTest timeout headroom"
      - uses: actions/upload-artifact@v4
        with:
          name: behavior-s6-macos-sanitizer-evidence
          path: out/build/macos-clang-*/tools/script-provider/safety-evidence.json
          if-no-files-found: error

      - name: Validate diagnostic stream and explicit decisions with ASan and UBSan
        run: |
          ./init.sh --cli --preset macos-clang-debug --preset-only --locked --with-tests --no-system-install
          out/host-tools/venv/bin/cmake --preset macos-clang-debug -B out/build/macos-diagnostics-sanitized -DLUDUS_CI_BUILD=OFF -DLUDUS_ENABLE_ASAN=ON -DLUDUS_ENABLE_UBSAN=ON -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc"
          out/host-tools/venv/bin/cmake --build out/build/macos-diagnostics-sanitized --target ludus_diagnostic_startup_child ludus_assert_decision_child
          out/host-tools/venv/bin/ctest --test-dir out/build/macos-diagnostics-sanitized --label-regex diagnostic-startup --output-on-failure --no-tests=error

      # A native crash with no stderr, such as a system-library trap (SIGTRAP), leaves only a
      # macOS crash report. Keep the reports of a failed job's test processes.
      - name: Preserve macOS crash reports
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/crash-reports"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \( -name '*.ips' -o -name '*.crash' \) \
            -exec cp {} "$RUNNER_TEMP/crash-reports/" \; 2>/dev/null || true
          ls "$RUNNER_TEMP/crash-reports"
      - name: Upload macOS crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-sanitizer-crash-reports
          path: ${{ runner.temp }}/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null 2>&1; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save locked macOS dependencies
        if: success() && steps.setup.outputs.dependency-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/conan/home
          key: ${{ steps.setup.outputs.dependency-cache-key }}
      - name: Save macOS compiler outputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.setup.outputs.compiler-cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: out/ccache
          key: ${{ steps.setup.outputs.compiler-cache-key }}

  # The analysis job reads the Linux compile database, which has no Cocoa or Metal
  # sources. An integration PR that changes a .mm source analyzes it here with the
  # batch's full clang-tidy policy; every other PR skips this job without a runner
  # (docs/development/continuous-integration.md#platform-only-sources).
  macos-objcxx-analysis:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier == 'integration' && needs.changes.outputs.objcxx_changed == 'true'
    name: macOS Objective-C++ analysis
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      LUDUS_TIDY_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Restores the batch's dependency and compiler caches; this job saves neither.
      - uses: ./.github/actions/macos-setup
        with:
          preset: macos-clang-development
          cache-variant: native
          editor: ${{ needs.changes.outputs.objcxx_editor }}
          build-editor: 'false'
      - name: Analyze changed Objective-C++ with the macOS compile database
        env:
          CHANGED_SOURCES_BASE: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/check macos-clang-development --tidy-changed-objcxx --base "$CHANGED_SOURCES_BASE"

  macos-analysis:
    needs: [changes, macos-sanitizers]
    if: ${{ !cancelled() && needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier == 'nightly' && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'macos-analysis') }}
    name: macOS analyzer baseline
    runs-on: macos-15
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      LUDUS_TIDY_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/macos-setup
        id: setup
        with:
          preset: macos-clang-development
          cache-variant: native
          build-editor: 'false'
      - name: Build complete macOS analysis inputs
        env:
          CONAN_HOME: ${{ github.workspace }}/out/conan/home
          CONAN_NON_INTERACTIVE: "1"
        run: |
          export PATH="$PWD/out/host-tools/bin:$PWD/out/host-tools/venv/bin:$PATH"
          out/host-tools/venv/bin/cmake -S . -B out/build/macos-clang-development \
            -DLUDUS_BUILD_BEHAVIOR=ON -DLUDUS_BUILD_BEHAVIOR_ACCEPTANCE=ON -DLUDUS_WARNINGS_AS_ERRORS=ON \
            -DLUDUS_BUILD_WORLD_DEMO=ON
          out/host-tools/venv/bin/cmake --build --preset macos-clang-development
      - name: Qualify production Behavior provider for macOS analysis
        run: out/host-tools/venv/bin/ctest --preset macos-clang-development --tests-regex '^ludus_behavior_' --output-on-failure --no-tests=error
      - name: Review complete macOS analyzer baseline
        continue-on-error: true
        run: ./scripts/check macos-clang-development --analyzer
      - name: Preserve macOS analyzer baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-macos
          path: out/quality/analysis/
          if-no-files-found: error
          retention-days: 14

  formatting:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'formatting')
    name: Source formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned formatter and GUI test dependencies
        run: |
          # Reusable definitions stay on main; the captured candidate owns its tool pin.
          llvm_major="$(python3 -c 'import json; print(int(json.load(open("config/tool_versions.json"))["minimum"]["clang"].split(".")[0]))')"
          if [[ -f scripts/python/llvm_apt_source.py ]]; then python3 scripts/python/llvm_apt_source.py; fi
          bash .github/actions/apt-install/apt-install.sh "clang-format-$llvm_major" "clang-tidy-$llvm_major" python3-venv python3-tk xvfb xauth liblz4-1
          echo "LUDUS_CI_LLVM_MAJOR=$llvm_major" >> "$GITHUB_ENV"
      - name: Install pinned CMake and Ninja for live project setup tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts/python")
          import engine
          root = Path.cwd()
          engine.create_or_update_venv(root)
          engine.install_managed_tools(root, engine.load_tool_versions(root))
          PY
          echo "$PWD/out/host-tools/venv/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned tooling quality checks
        run: ./scripts/setup-quality-tools
      - name: Test tooling checks and editor preset boundaries
        run: PYTHONPATH=scripts/python python3 -m unittest test_quality_tools test_editor_setup test_mobile_probe -v
      - name: Test render-graph build, staging and template tooling
        # Every suite, so new ones join; compiler cases skip here and run in the macOS batch job.
        run: PYTHONPATH=scripts/python python3 -m unittest discover -s scripts/python -p 'test_render_graph*.py' -v
      - name: Test the standalone LUSL shader lowering helper
        run: python3 -m unittest discover -s scripts/python -p 'test_lower_lusl.py' -v
      - name: Test the SDK LUSL declaration generator
        run: python3 -m unittest discover -s scripts/python -p 'test_generate_luslh.py' -v
      - name: Validate workflow syntax before admitting a candidate
        run: out/host-tools/bin/actionlint -shellcheck= -pyflakes=
      - name: Review Python and workflow correctness baseline
        continue-on-error: true
        run: ./scripts/check --tooling
      - name: Preserve tooling quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tooling-quality
          path: out/quality/tooling/
          if-no-files-found: error
          retention-days: 14
      - name: Test design tokens and their consumers
        run: PYTHONPATH=scripts/python python3 -m unittest test_design_tokens -v
      - name: Test formatting and staged-file preservation
        run: python3 -m unittest discover -s scripts/python -p 'test_formatting.py' -v
      - name: Test reproducible packs with the independent LZ4 decoder
        run: python3 -m unittest discover -s scripts/python -p test_pack_builder.py -v
      - name: Test Metal shader reflection contracts
        run: PYTHONPATH=scripts/python python3 -m unittest test_rhi_measurements test_metal_shaders test_raster_shaders test_texture_cooker -v
      - name: Test pinned shader tool download fallbacks
        run: python3 -m unittest discover -s scripts/python -p test_shader_probe_fetch.py -v
      - name: Test optional RAD tooling contracts
        run: python3 -m unittest discover -s scripts/python -p 'test_rad_debugger.py' -v
      - name: Test graphical and CLI initialization routing
        # A window test that stops responding must fail the job, not hold the runner.
        timeout-minutes: 10
        run: xvfb-run -a env LUDUS_TEST_GUI=1 python3 -m unittest discover -s scripts/python -p 'test_init*.py' -v
      - name: Test CI initialization and analysis contracts
        run: python3 scripts/python/ci_tooling_suite.py
      - name: Live reload tooling tests
        run: |
          python3 -m unittest discover -s scripts/python -p 'test_play*.py' -v
          python3 -m unittest discover -s scripts/python -p 'test_process_ownership.py' -v
      - name: Reject standard formatting and heavy public headers
        run: |
          python3 tools/check_build_time_includes.py
          python3 tests/build_time/policy_tests.py
          python3 tools/check_container_policy.py
          python3 -m unittest discover -s scripts/python -p test_check_container_policy.py -v
          python3 tools/check_target_macros.py
          python3 -m unittest discover -s scripts/python -p test_check_target_macros.py -v
          python3 -m unittest discover -s scripts/python -p test_check_build_graph.py -v
      - name: Verify source formatting
        run: ./scripts/check --format
      - name: Enforce review-derived source rules
        env:
          SOURCE_POLICY_BASE: ${{ inputs.batch_base_sha || github.event.pull_request.base.sha || 'origin/main' }}
          SOURCE_POLICY_HEAD: ${{ inputs.batch_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/python/source_policy.py --base "$SOURCE_POLICY_BASE" --head "$SOURCE_POLICY_HEAD" --clang-format "clang-format-$LUDUS_CI_LLVM_MAJOR"
          PYTHONPATH=scripts/python python3 -m unittest test_source_policy test_check_naming test_changed_tidy test_renderer_shader_recipes -v
      - name: Test S0 Luau source and bytecode integrity contracts
        run: python3 -m unittest discover -s tools/luau-probe -p 'test_*.py' -v
      - name: Test L0 localization document, receipt and manifest contracts
        run: |
          python3 -m unittest discover -s scripts/python -p 'test_localization_corpus.py' -v
          python3 -m unittest discover -s tools/icu-probe -p 'test_*.py' -v
          ./scripts/localization-corpus validate --manifest modules/localization/corpus/release.json
      - name: Test S1 manifest and cook admission contracts
        run: python3 -m unittest discover -s tools/script-cook -p 'test_*.py' -v

      - name: Build the changed native image recipe
        if: needs.changes.outputs.image_recipe_changed == 'true'
        run: bash .github/actions/native-image/image.sh verify

  debug-runtime:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration' && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'debug-runtime')
    name: Debug runtime and source debugger
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-debug
      - name: Build Debug with native gameplay fixtures
        run: ./scripts/build linux-clang-debug
      - name: Test Debug including mandatory GDB and persistent supervisor journeys
        run: out/host-tools/venv/bin/ctest --preset linux-clang-debug --no-tests=error --output-junit "$RUNNER_TEMP/debug-tests.xml"
      - name: Report CTest timeout headroom
        if: always()
        run: >-
          python3 scripts/python/ctest_headroom.py out/build/linux-clang-debug --ctest out/host-tools/venv/bin/ctest
          --junit "$RUNNER_TEMP/debug-tests.xml"
          --title "Debug runtime: CTest timeout headroom"
      - name: Preserve native debugger and supervisor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reload-debug-diagnostics
          path: out/build/linux-clang-debug/Testing/Temporary/
          if-no-files-found: error
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi

  development:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration' && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'development')
    name: Development and SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
      - name: Build Development without PCH
        run: ./scripts/build linux-clang-development
      - name: Validate private S0 Luau interpreter and debugger profile
        run: |
          ./scripts/luau-probe bootstrap
          ./scripts/luau-probe cook
          ./scripts/luau-probe run --preset linux-clang-development
          ./scripts/luau-probe check --preset linux-clang-development
      - name: Validate S1 generated contract and native/Luau interaction
        run: |
          ./scripts/script-interaction bootstrap
          ./scripts/script-interaction cook
          ./scripts/script-interaction run --preset linux-clang-development
          ./scripts/script-interaction check --preset linux-clang-development
      - name: Validate S2 debug, dependency cook and native VM replacement
        run: |
          ./scripts/script-session cook
          ./scripts/script-session run --preset linux-clang-development
          ./scripts/script-session check --preset linux-clang-development
      - name: Validate S4 installed provider and project cooker
        run: |
          ./scripts/script-provider run --preset linux-clang-development
          ./scripts/script-provider check --preset linux-clang-development
      - name: Validate S3 visual sequence and authoring ownership
        run: |
          ./scripts/visual-sequence cook
          ./scripts/visual-sequence run --preset linux-clang-development
          ./scripts/visual-sequence check --preset linux-clang-development
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install pinned S3 authoring test browser
        working-directory: tools/web-browser-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise S3 designer author, review, debug and replacement journey
        run: node tools/visual-sequence/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-s3-authoring-evidence
          path: out/browser-qa/results/visual-s3*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: behavior-s6-linux-evidence
          path: out/build/linux-clang-development/tools/script-provider/safety-evidence.json
          if-no-files-found: error
      - name: Test Development
        run: out/host-tools/venv/bin/ctest --preset linux-clang-development --no-tests=error --output-junit "$RUNNER_TEMP/development-tests.xml"
      - name: Report CTest timeout headroom
        if: always()
        run: >-
          python3 scripts/python/ctest_headroom.py out/build/linux-clang-development --ctest out/host-tools/venv/bin/ctest
          --junit "$RUNNER_TEMP/development-tests.xml"
          --title "Development: CTest timeout headroom"
      - name: Measure bounded filesystem reads and native syscall overhead
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development -DLUDUS_BUILD_FILESYSTEM_BENCHMARK=ON
          out/host-tools/venv/bin/cmake --build --preset linux-clang-development --target ludus_filesystem_benchmark --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          python3 tests/filesystem/generate_benchmark.py out/filesystem-benchmark
          {
            uname -a
            lscpu
            for layout in loose raw.pack lz4.pack; do
              corpus=out/filesystem-benchmark
              if [ "$layout" = loose ]; then corpus="$corpus/loose"; fi
              for workers in 0 1 4; do
                sync
                sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches'
                echo "cache_reset=drop_caches layout=$layout workers=$workers"
                out/build/linux-clang-development/modules/foundation/filesystem/ludus_filesystem_benchmark "$corpus" "$layout" "$workers"
              done
            done
          } | tee out/filesystem-benchmark/measurements.txt
          bash .github/actions/apt-install/apt-install.sh strace
          for layout in loose raw.pack lz4.pack; do
            corpus=out/filesystem-benchmark
            if [ "$layout" = loose ]; then corpus="$corpus/loose"; fi
            strace -f -c -e trace=pread64,fstat,newfstatat,openat,close \
              -o "out/filesystem-benchmark/syscalls-$layout.txt" \
              out/build/linux-clang-development/modules/foundation/filesystem/ludus_filesystem_benchmark "$corpus" "$layout" 4
          done
      - name: Measure representative streaming traces with periodic collection
        run: |
          python3 tests/filesystem/streaming.py generate out/filesystem-streaming --count 128
          python3 tests/filesystem/streaming.py measure out/filesystem-streaming \
            --benchmark out/build/linux-clang-development/modules/foundation/filesystem/ludus_filesystem_benchmark \
            --output out/filesystem-streaming/results --repetitions 3 --contention 0 \
            --open-modes shared --tracing 0 --cache warm \
            --compiler-description "CI $(out/host-tools/bin/clang++ --version | head -n 1) Development O2" \
            --storage-description 'disposable Ubuntu runner, see environment.json mount/df'
          out/host-tools/venv/bin/ctest --preset linux-clang-development -R 'filesystem_streaming_' --no-tests=error
      - name: Preserve filesystem measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filesystem-benchmark
          path: |
            out/filesystem-benchmark/measurements.txt
            out/filesystem-benchmark/syscalls-*.txt
            out/filesystem-streaming/manifest.json
            out/filesystem-streaming/*.trace
            out/filesystem-streaming/results/
      - name: Validate installed SDK and consumer
        run: ./scripts/install-sdk linux-clang-development
      - name: Cook and execute an independent project with the relocated Behavior SDK
        run: |
          python3 tools/script-provider/verify_consumer.py out/install/linux-clang-development
          python3 tools/script-provider/verify_optional.py linux-clang-development
      - name: Relocate the SDK and link a consumer without producer dependencies
        run: |
          set -euo pipefail
          reloc="$RUNNER_TEMP/relocated-sdk"
          cp -a out/install/linux-clang-development "$reloc"
          consumer="$RUNNER_TEMP/relocated-consumer"
          tools="$PWD/out/host-tools/venv/bin"
          llvm_major="$(python3 -c 'import json; print(int(json.load(open("config/tool_versions.json"))["minimum"]["clang"].split(".")[0]))')"
          env -i PATH="$tools:/usr/bin:/bin" "$tools/cmake" \
            -S tests/sdk_consumer -B "$consumer" -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$tools/ninja" \
            -DCMAKE_CXX_COMPILER="/usr/bin/clang++-$llvm_major" \
            -DCMAKE_PREFIX_PATH="$reloc" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          env -i PATH="$tools:/usr/bin:/bin" "$tools/cmake" --build "$consumer" --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          "$consumer/ludus_sdk_consumer"
          if grep -q '/modules/' "$consumer/compile_commands.json"; then
            echo 'Relocated consumer compiled engine sources'; exit 1
          fi
      - name: Verify installed shader toolchain and generated backend contracts
        run: |
          bash .github/actions/apt-install/apt-install.sh libvulkan1 mesa-vulkan-drivers vulkan-validationlayers weston
          ./scripts/shader-probe bootstrap
          ./scripts/bootstrap-spirv-cross
          python3 tests/sdk_consumer/verify_shader_build.py \
            --sdk "$PWD/out/install/linux-clang-development" \
            --cmake "$PWD/out/host-tools/venv/bin/cmake" \
            --ninja "$PWD/out/host-tools/venv/bin/ninja" \
            --cxx "$PWD/out/host-tools/bin/clang++" \
            --slang "$PWD/out/shader-tools/slang/bin/slangc" \
            --validator "$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            --spirv-cross "$PWD/out/shader-tools/spirv-cross/bin/spirv-cross" \
            --conan "$PWD/out/conan/linux-clang-development"
      - name: Validate Vulkan Wayland surface loss under Weston
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d "$RUNNER_TEMP/ludus-wayland.XXXXXX")"
          export WAYLAND_DISPLAY=ludus-wayland
          weston --backend=headless --renderer=pixman --no-config --idle-time=0 \
            --width=1920 --height=1080 --socket="$WAYLAND_DISPLAY" > out/rhi-wayland-weston.log 2>&1 &
          compositor=$!
          trap 'kill "$compositor" 2>/dev/null || true; wait "$compositor" || true; cat out/rhi-wayland-weston.log' EXIT
          for ((attempt=0; attempt<100; ++attempt)); do
            if [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
              break
            fi
            kill -0 "$compositor"
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          export VK_DRIVER_FILES="$(dpkg-query -L mesa-vulkan-drivers | awk '/\/lvp_icd(\.[[:alnum:]_]+)?\.json$/ { print }')"
          test -r "$VK_DRIVER_FILES"
          LUDUS_TEST_WAYLAND=1 VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation timeout 60s \
            out/build/linux-clang-development/modules/graphics/rhi/ludus_graphics_rhi_tests '[wayland][surface]' \
            2>&1 | tee out/rhi-wayland-validation.log
          grep -Fq 'All tests passed' out/rhi-wayland-validation.log
          if grep -E 'Validation Error|VUID-' out/rhi-wayland-validation.log; then
            echo '::error::Vulkan validation reported an error during Wayland surface retirement.'
            exit 1
          fi
      - name: Qualify installed RG1 SPIR-V, WGSL and GLSL packages
        run: |
          out/host-tools/venv/bin/python -m venv out/rg1-cli
          out/rg1-cli/bin/python -m pip install --no-deps ./scripts/python
          out/host-tools/venv/bin/python tests/sdk_consumer/verify_render_graph_build.py \
            --cli "$PWD/out/rg1-cli/bin/ludus" --sdk "$PWD/out/install/linux-clang-development" \
            --slang "$PWD/out/shader-tools/slang/bin/slangc" --cxx "$PWD/out/host-tools/bin/clang++" \
            --validator "$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            --spirv-cross "$PWD/out/shader-tools/spirv-cross/bin/spirv-cross" \
            --profiles spirv wgsl glsl --sanitize --output out/rg1-linux
          out/host-tools/venv/bin/python tests/sdk_consumer/verify_render_graph_execution.py \
            --cli "$PWD/out/rg1-cli/bin/ludus" --sdk "$PWD/out/install/linux-clang-development" \
            --slang "$PWD/out/shader-tools/slang/bin/slangc" --cxx "$PWD/out/host-tools/bin/clang++" \
            --cmake "$PWD/out/host-tools/venv/bin/cmake" \
            --validator "$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            --spirv-cross "$PWD/out/shader-tools/spirv-cross/bin/spirv-cross" \
            --profiles spirv wgsl glsl --output out/rg2-linux
      - name: Validate RG1 emitted browser shaders
        run: |
          cd tools/web-browser-tests
          npm ci
          npx playwright install --with-deps chromium
          cd ../..
          node tests/sdk_consumer/render-graph-browser-test.mjs out/rg1-linux
      - name: Validate portable Vulkan raster pixels with validation layers
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development \
            -DLUDUS_BUILD_SHADER_WORKER=ON \
            -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc" \
            -DLUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            -DLUDUS_SPIRV_CROSS="$PWD/out/shader-tools/spirv-cross/bin/spirv-cross"
          out/host-tools/venv/bin/cmake --build out/build/linux-clang-development --target ludus_rhi_render_tests ludus_renderer_render_tests ludus_light_transformer_render_tests ludus_point_neighbors_render_tests ludus_render_graph_ray_tests ludus_rhi_ray_tests ludus_rhi_native_interop_consumer ludus_rhi_r11_consumer ludus_rhi_r9_consumer ludus_rhi_r18c_consumer ludus-shader-worker ludus_shader_compiler_tests --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/host-tools/venv/bin/ctest --test-dir out/build/linux-clang-development --tests-regex '^ludus_shader_(compiler_tests|worker_protocol|reload_gpu)$' --output-on-failure --no-tests=error
          set -o pipefail
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/rhi/ludus_rhi_render_tests 2>&1 | tee out/raster-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/raster-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text, text'
          # R13a: whole-buffer control and buffer-range trial under synchronization validation.
          # The layer reads validate_sync from the settings file or, on newer layers, the variable.
          printf 'khronos_validation.validate_sync = true\n' > out/r13a-vk_layer_settings.txt
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation VK_LAYER_SETTINGS_PATH="$PWD/out/r13a-vk_layer_settings.txt" VK_KHRONOS_VALIDATION_VALIDATE_SYNC=true out/build/linux-clang-development/modules/graphics/rhi/ludus_rhi_render_tests '[synchronization-trial]' 2>&1 | tee out/r13a-vulkan-sync-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/r13a-vulkan-sync-validation.log").read_text(); assert "All tests passed" in text and "skipped" not in text and "R13A control" in text and "R13A trial" in text and "Validation Error" not in text and "VUID-" not in text and "SYNC-HAZARD" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/rhi/ludus_rhi_native_interop_consumer 2>&1 | tee out/native-interop-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/native-interop-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/rhi/ludus_rhi_r11_consumer 2>&1 | tee out/r11-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/r11-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/rhi/ludus_rhi_r18c_consumer 2>&1 | tee out/r18c-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/r18c-vulkan-validation.log").read_text(); assert "R18c passed true" in text and "GPU result 20" in text and "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/rhi/ludus_rhi_r9_consumer 2>&1 | tee out/r18-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/r18-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text and "R18 BC5 enabled true; sampled width 8240" in text and "R18 BC5 unaligned edges enabled true" in text, text'
          out/host-tools/venv/bin/cmake -S tests/sdk_consumer/raster -B out/r11-raster-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER="$PWD/out/host-tools/bin/clang++" -DCMAKE_MAKE_PROGRAM="$PWD/out/host-tools/venv/bin/ninja" \
            -DCMAKE_PREFIX_PATH="$PWD/out/install/linux-clang-development;$PWD/out/conan/linux-clang-development" \
            -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc" \
            -DLUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            -DLUDUS_SPIRV_CROSS="$PWD/out/shader-tools/spirv-cross/bin/spirv-cross"
          out/host-tools/venv/bin/cmake --build out/r11-raster-sdk --target ludus_sdk_r11_consumer ludus_sdk_r9_consumer ludus_sdk_r18c_consumer --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/r11-raster-sdk/ludus_sdk_r11_consumer 2>&1 | tee out/r11-sdk-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/r11-sdk-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/r11-raster-sdk/ludus_sdk_r18c_consumer 2>&1 | tee out/r18c-sdk-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/r18c-sdk-vulkan-validation.log").read_text(); assert "R18c passed true" in text and "GPU result 20" in text and "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/r11-raster-sdk/ludus_sdk_r9_consumer 2>&1 | tee out/r18-sdk-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/r18-sdk-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text and "R18 BC5 enabled true; sampled width 8240" in text and "R18 BC5 unaligned edges enabled true" in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/rhi/ludus_rhi_ray_tests 2>&1 | tee out/ray-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/ray-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/renderer/ludus_renderer_render_tests 2>&1 | tee out/renderer-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/renderer-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/renderer/ludus_light_transformer_render_tests 2>&1 | tee out/light-transformer-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/light-transformer-vulkan-validation.log").read_text(); assert "All tests passed" in text and "skipped" not in text and "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/renderer/ludus_point_neighbors_render_tests 2>&1 | tee out/point-neighbors-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/point-neighbors-vulkan-validation.log").read_text(); assert "All tests passed" in text and "skipped" not in text and "Validation Error" not in text and "VUID-" not in text, text'
          # RG2/RG3 evidence: SPIR-V runtime generations decode and activate on Vulkan; a skipped GPU case fails here.
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/renderer/ludus_renderer_render_tests '[render-graph]' 2>&1 | tee out/render-graph-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/render-graph-vulkan-validation.log").read_text(); assert "All tests passed" in text and "skipped" not in text and "Validation Error" not in text and "VUID-" not in text, text'
          # Compute ray-tracing C2 evidence: Mesa llvmpipe is a CPU device, which the Vulkan ray profile rejects,
          # so scene compute packages must select raster here, both with and without the ray preference.
          # The hardware ray cases skip on this runner and need a Vulkan GPU; they are not run here.
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/renderer/ludus_render_graph_ray_tests '[compute-ray-tracing][selection]' --success 2>&1 | tee out/compute-ray-fallback-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/compute-ray-fallback-vulkan-validation.log").read_text(); assert "All tests passed" in text and "skipped" not in text and "Validation Error" not in text and "VUID-" not in text, text; assert "hasNativeRays := false" in text and "hasNativeRays := true" not in text and "shouldRequestRay := true" in text, text'
          out/host-tools/venv/bin/cmake -S tests/sdk_consumer/renderer -B out/renderer-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER="$PWD/out/host-tools/bin/clang++" -DCMAKE_MAKE_PROGRAM="$PWD/out/host-tools/venv/bin/ninja" \
            -DCMAKE_PREFIX_PATH="$PWD/out/install/linux-clang-development;$PWD/out/conan/linux-clang-development" \
            -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc" \
            -DLUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            -DLUDUS_SPIRV_CROSS="$PWD/out/shader-tools/spirv-cross/bin/spirv-cross"
          out/host-tools/venv/bin/cmake --build out/renderer-sdk --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          out/renderer-sdk/ludus_sdk_renderer_consumer
          out/host-tools/venv/bin/ctest --test-dir out/renderer-sdk -R "^installed_encoder$" --no-tests=error --output-on-failure
          out/renderer-sdk/ludus_sdk_renderer_views_consumer
          out/renderer-sdk/ludus_sdk_renderer_overlays_consumer
          out/renderer-sdk/ludus_sdk_ui_render_consumer
          out/renderer-sdk/ludus_sdk_ui_text_consumer
          out/renderer-sdk/ludus_sdk_renderer_materials_consumer
          out/renderer-sdk/ludus_sdk_renderer_lighting_consumer
          out/renderer-sdk/ludus_sdk_renderer_scaling_consumer
          out/host-tools/venv/bin/ctest --test-dir out/renderer-sdk/environment --output-on-failure --no-tests=error -R '^ludus_sdk_environment$'
          out/host-tools/venv/bin/ctest --test-dir out/renderer-sdk --output-on-failure --no-tests=error -R "^ludus_sdk_hybrid_indirect_diffuse_consumer$"
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/host-tools/venv/bin/ctest --test-dir out/renderer-sdk -V --no-tests=error -R "^ludus_sdk_ray_storage_"
          out/host-tools/venv/bin/ctest --test-dir out/renderer-sdk --output-on-failure --no-tests=error -R "^ludus_sdk_patch_seam_(geometry|raster)$"
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/renderer-sdk/ludus_sdk_render_graph_runtime_consumer 2>&1 | tee out/rg3-sdk-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/rg3-sdk-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/renderer-sdk/ludus_sdk_render_graph_bilinear_consumer 2>&1 | tee out/bilinear-sdk-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/bilinear-sdk-vulkan-validation.log").read_text(); assert "bilinear passed" in text and "Validation Error" not in text and "VUID-" not in text, text'
          # RG4 evidence: pooled and serial-control exports, allocation counts, bytes and CPU p50/p95.
          mkdir -p out/rg4-evidence
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/renderer-sdk/ludus_sdk_render_graph_pooling_consumer 2>&1 | tee out/rg4-evidence/vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/rg4-evidence/vulkan-validation.log").read_text(); assert "pooling passed" in text and "Validation Error" not in text and "VUID-" not in text, text'
          out/renderer-sdk/ludus_sdk_reference_capture out/reference.luhdr
          python3 scripts/reference-hdr out/reference.luhdr --pfm out/reference.pfm --manifest out/reference.json
          out/host-tools/venv/bin/ctest --test-dir out/renderer-sdk/reference-scene --output-on-failure
          out/host-tools/bin/clang-tidy -p out/renderer-sdk --warnings-as-errors='*' examples/reference-scene/src/main.cpp
          out/host-tools/venv/bin/python - <<'PYFORMAT'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/python')
          from formatting import format_source
          path = Path('examples/reference-scene/src/main.cpp')
          assert format_source(path.read_text(), path, 'out/host-tools/bin/clang-format') == path.read_text()
          PYFORMAT
      - name: Upload cooked patch seam captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-seam-vulkan
          path: out/renderer-sdk/patch-seam/raster/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload RG4 pooling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rg4-pooling-vulkan
          path: out/rg4-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Check the reference scene consumer with ASan and UBSan
        env:
          # Thanks to Khronos, "Vulkan Loader Interface Architecture", loader
          # environment variables: retain driver modules for LeakSanitizer's
          # process-exit reachability scan and symbolized allocation stacks.
          # https://github.com/KhronosGroup/Vulkan-Loader/blob/main/docs/LoaderInterfaceArchitecture.md#table-of-debug-environment-variables
          VK_LOADER_DISABLE_DYNAMIC_LIBRARY_UNLOADING: '1'
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          out/host-tools/venv/bin/cmake -S examples/reference-scene -B out/reference-scene-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLUDUS_SCENE_SANITIZERS=ON \
            -DCMAKE_CXX_COMPILER="$PWD/out/host-tools/bin/clang++" -DCMAKE_MAKE_PROGRAM="$PWD/out/host-tools/venv/bin/ninja" \
            -DCMAKE_PREFIX_PATH="$PWD/out/install/linux-clang-development;$PWD/out/conan/linux-clang-development" \
            -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc" \
            -DLUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            -DLUDUS_SPIRV_CROSS="$PWD/out/shader-tools/spirv-cross/bin/spirv-cross"
          out/host-tools/venv/bin/cmake --build out/reference-scene-sanitized --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          out/host-tools/venv/bin/ctest --test-dir out/reference-scene-sanitized --output-on-failure
      - name: Build and test the independent Cornell box tutorial (Vulkan)
        run: |
          bash .github/actions/apt-install/apt-install.sh libvulkan1 mesa-vulkan-drivers
          export PATH="$PWD/out/host-tools/bin:$PWD/out/host-tools/venv/bin:$PATH"
          export LUDUS_SDK_PREFIX="$PWD/out/install/linux-clang-development"
          export LUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc"
          export LUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val"
          cd examples/cornell-box
          cmake --list-presets=configure
          cmake --list-presets=build
          cmake --list-presets=test
          cmake --preset linux-clang-development
          cmake --build --preset linux-clang-development
          ctest --preset linux-clang-development
          for source in src/main.cpp src/camera.cpp tests/camera_tests.cpp; do
            clang-tidy -p out/build/linux-clang-development --warnings-as-errors='*' "$source"
          done
          PYTHONPATH=../../scripts/python python3 - <<'PYFORMAT'
          from pathlib import Path
          from formatting import format_source
          from engine import find_system_tool, load_tool_versions, repo_root
          clang_format = find_system_tool(repo_root(), 'clang-format', load_tool_versions(repo_root()))
          sources = [*Path('src').glob('*.cpp'), *Path('src').glob('*.hpp'), *Path('tests').glob('*.cpp')]
          for source in sources:
              source = source.resolve()
              assert source.read_text() == format_source(source.read_text(), source, clang_format), f'Format {source}'
          PYFORMAT
          # Exercise the same setup backend as Project > Repair Project Setup.
          # Start without local presets, then prove repeated repair stays usable.
          rm -rf out/build/linux-clang-development
          PYTHONPATH=../../scripts/python python -m ludus_tools project repair . --tools ../.. --sdk "$LUDUS_SDK_PREFIX" --no-web
          PYTHONPATH=../../scripts/python python -m ludus_tools project check . --tools ../..
          PYTHONPATH=../../scripts/python python -m ludus_tools project repair . --tools ../.. --sdk "$LUDUS_SDK_PREFIX" --no-web
          git diff --exit-code -- .gitignore ludus.project.json CMakePresets.json
          cmake --preset linux-clang-development -B out/sanitized -DCORNELL_ENABLE_SANITIZERS=ON
          cmake --build out/sanitized
          ctest --test-dir out/sanitized --output-on-failure --no-tests=error
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi

  sanitizer-build:
    if: github.event_name == 'workflow_dispatch' && inputs.sanitizer_experiment == 'shared'
    name: Build the shared Linux sanitizer preset
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-asan-ubsan
          editor: 'true'
      - name: Build with sanitizers
        run: ./scripts/build linux-clang-asan-ubsan
      - name: Archive the sanitizer build and its test inputs
        id: bundle
        shell: bash
        # CTest, CMake, Ninja and the host venv contain absolute paths. The
        # restore verifies the workspace and preserves source mtimes so that
        # shard 1's targeted SDK and probe builds can reuse the compiled tree.
        # Thanks to GitHub Actions upload-artifact's permission guidance:
        # package in a tar before upload to preserve permissions and symlinks.
        # https://github.com/actions/upload-artifact#permission-loss
        run: |
          test "$(git rev-parse HEAD)" = "$LUDUS_CI_COMMIT_SHA"
          git diff --exit-code
          printf '%s\n%s\n' "$LUDUS_CI_COMMIT_SHA" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/sanitizer-build-origin"
          {
            git ls-files -z
            printf '%s\0' out
            if [[ -f CMakeUserPresets.json ]]; then printf '%s\0' CMakeUserPresets.json; fi
          } | tar --format=posix --null --files-from=- -cf - \
            | zstd -T0 -o "$RUNNER_TEMP/sanitizer-build.tar.zst"
          du -h "$RUNNER_TEMP/sanitizer-build.tar.zst"
          echo "artifact=sanitizer-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload the shared sanitizer build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: |
            ${{ runner.temp }}/sanitizer-build.tar.zst
            ${{ runner.temp }}/sanitizer-build-origin
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi

  sanitizers:
    needs: [changes, sanitizer-build]
    if: ${{ !cancelled() && ((inputs.sanitizer_experiment == 'shared' && needs.sanitizer-build.result == 'success') || inputs.sanitizer_experiment == 'rebuild' || (needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration')) && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'sanitizers') }}
    # One serial suite took 95-100 min of a 2 h job, 83% of it in render-graph,
    # renderer and wave-graph cases on lavapipe. Split it round-robin across
    # runners instead of running cases concurrently on one: each case keeps a
    # whole runner, so the cold software-shader deadlines see the same CPU as
    # a serial run. Shard 1 also owns the scripting/localization sweeps and the
    # reload latency evidence. Every shard is required by the Ubuntu Clang gate.
    # The shards split one listing taken before shard 1's sweeps reconfigure
    # its tree; see "Select this shard's tests".
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: ASan and UBSan (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    env:
      SANITIZER_SHARD: ${{ matrix.shard }}
      SANITIZER_SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        if: inputs.sanitizer_experiment != 'shared'
        with:
          preset: linux-clang-asan-ubsan
          editor: 'true'
          # Shards build identical trees; one writer per preset and variant.
          conan-cache-writer: ${{ matrix.shard == 1 && 'true' || 'false' }}
          compiler-cache-writer: ${{ matrix.shard == 1 && 'true' || 'false' }}
      - name: Build with sanitizers
        if: inputs.sanitizer_experiment != 'shared'
        run: ./scripts/build linux-clang-asan-ubsan
      - uses: ./.github/actions/native-setup
        if: inputs.sanitizer_experiment == 'shared'
        with:
          preset: linux-clang-asan-ubsan
          editor: 'true'
          prerequisites-only: 'true'
      - name: Download the shared sanitizer build
        if: inputs.sanitizer_experiment == 'shared'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.sanitizer-build.outputs.artifact }}
          path: ${{ runner.temp }}
      - name: Restore the sanitizer build and verify its identity
        if: inputs.sanitizer_experiment == 'shared'
        run: |
          archive="$RUNNER_TEMP/sanitizer-build.tar.zst"
          expected="$(printf '%s\n%s' "$LUDUS_CI_COMMIT_SHA" "$GITHUB_WORKSPACE")"
          if [[ "$(cat "$RUNNER_TEMP/sanitizer-build-origin")" != "$expected" ]]; then
            echo "::error::The sanitizer build was produced for another commit or workspace."
            exit 1
          fi
          tar --zstd -xf "$archive"
          rm "$archive"
          git diff --exit-code
      # Shard 1's probe steps reconfigure the tree and register more tests, so
      # every shard picks its tests here, while the four trees are identical.
      # Steps before this one must not depend on the shard (test_ci_scope.py checks).
      - name: Select this shard's tests
        run: >-
          python3 scripts/python/ctest_shard.py out/build/linux-clang-asan-ubsan --ctest out/host-tools/venv/bin/ctest
          --shard "$SANITIZER_SHARD" --shards "$SANITIZER_SHARDS"
          --exclude-regex '^ludus_game_host_reload_tests$'
          --output "$RUNNER_TEMP/sanitizer-shard-tests.txt"
      - name: Prove ASan detection and fatal UBSan before acceptance
        run: out/host-tools/venv/bin/ctest --preset linux-clang-asan-ubsan --label-regex sanitizer-control --output-on-failure --no-tests=error
      - name: Preserve sanitizer control diagnostics
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-controls
          path: out/build/linux-clang-asan-ubsan/tests/quality/*-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Validate S0 Luau allocation failure and lifetime profile with sanitizers
        if: matrix.shard == 1
        run: |
          ./scripts/luau-probe bootstrap
          ./scripts/luau-probe cook
          ./scripts/luau-probe run --preset linux-clang-asan-ubsan
      - name: Validate S1 unpublished effects under allocation failure
        if: matrix.shard == 1
        run: |
          ./scripts/script-interaction bootstrap
          ./scripts/script-interaction cook
          ./scripts/script-interaction run --preset linux-clang-asan-ubsan
      - name: Validate S2 staging, paused invocation and module retirement with sanitizers
        if: matrix.shard == 1
        run: |
          ./scripts/script-session cook
          ./scripts/script-session run --preset linux-clang-asan-ubsan
      - name: Validate S3 graph debugger, candidate failure and owner retirement with sanitizers
        if: matrix.shard == 1
        run: ./scripts/visual-sequence run --preset linux-clang-asan-ubsan
      - name: Validate S4 provider transactions and state under sanitizers
        if: matrix.shard == 1
        run: ./scripts/script-provider run --preset linux-clang-asan-ubsan
      - name: Cache pinned L0 ICU archives, host data tools and sliced data
        if: matrix.shard == 1
        uses: actions/cache@v4
        with:
          path: |
            out/icu-probe/icu4c-sources.tgz
            out/icu-probe/icu4c-data.zip
            out/icu-probe/source
            out/icu-probe/host-build
            out/icu-probe/data
          key: icu-probe-v1-${{ runner.os }}-${{ hashFiles('config/icu_toolchain.json', 'tools/icu-probe/data-filter.json', 'scripts/icu-probe') }}
      - name: Validate L0 ICU backend, L2 formatting and isolated allocation-failure sweeps with sanitizers
        if: matrix.shard == 1
        run: |
          ./scripts/icu-probe bootstrap
          ./scripts/icu-probe cook
          ./scripts/icu-probe run --preset linux-clang-asan-ubsan
          ./scripts/icu-probe check --preset linux-clang-asan-ubsan
      - uses: actions/upload-artifact@v4
        if: matrix.shard == 1
        with:
          name: localization-l0-linux-sanitized-evidence
          path: |
            out/build/linux-clang-asan-ubsan/tools/icu-probe/evidence.json
            out/build/linux-clang-asan-ubsan/modules/localization/format-evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.shard == 1
        with:
          name: behavior-s6-linux-sanitized-evidence
          path: out/build/linux-clang-asan-ubsan/tools/script-provider/safety-evidence.json
          if-no-files-found: error
      - name: Validate S7 installed-SDK reference semantics with sanitizers
        if: matrix.shard == 1
        run: |
          out/host-tools/venv/bin/cmake --install out/build/linux-clang-asan-ubsan
          out/host-tools/venv/bin/python scripts/python/engine.py bundle-sdk-dependencies \
            linux-clang-asan-ubsan --prefix out/install/linux-clang-asan-ubsan
          ./scripts/script-qualification --sdk out/install/linux-clang-asan-ubsan \
            --output out/behavior-s7-sanitized --verify-only
      - uses: actions/upload-artifact@v4
        if: matrix.shard == 1
        with:
          name: behavior-s7-linux-sanitized-reference
          path: |
            out/behavior-s7-sanitized/current.json
            out/behavior-s7-sanitized/run-*/evidence.json
          if-no-files-found: error
      # Reload latency evidence is required, so a fixed shard records it rather
      # than whichever shard the round-robin happens to assign it to.
      - name: Record reload latency with sanitizers
        if: matrix.shard == 1
        env:
          LUDUS_RELOAD_METRICS: ${{ runner.temp }}/live-reload-asan-ubsan.jsonl
        run: out/host-tools/venv/bin/ctest --preset linux-clang-asan-ubsan --tests-regex '^ludus_game_host_reload_tests$' --no-tests=error --output-junit "$RUNNER_TEMP/sanitizer-reload-tests.xml"
      # Thanks to Kitware, "ctest(1)", --tests-from-file (CMake 3.29): runs the
      # exact names the selection step listed, ignoring tests registered since.
      # https://cmake.org/cmake/help/latest/manual/ctest.1.html#cmdoption-ctest-tests-from-file
      - name: Test with sanitizers
        run: >-
          out/host-tools/venv/bin/ctest --preset linux-clang-asan-ubsan --no-tests=error
          --tests-from-file "$RUNNER_TEMP/sanitizer-shard-tests.txt"
          --output-junit "$RUNNER_TEMP/sanitizer-tests.xml"
      - name: Report CTest timeout headroom
        if: always()
        run: >-
          python3 scripts/python/ctest_headroom.py out/build/linux-clang-asan-ubsan --ctest out/host-tools/venv/bin/ctest
          --junit "$RUNNER_TEMP/sanitizer-reload-tests.xml" --junit "$RUNNER_TEMP/sanitizer-tests.xml"
          --title "ASan and UBSan ($SANITIZER_SHARD/$SANITIZER_SHARDS): CTest timeout headroom"
      - name: Upload sanitizer reload measurements
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: live-reload-asan-ubsan
          path: ${{ runner.temp }}/live-reload-asan-ubsan.jsonl
          if-no-files-found: error
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi

  scripting-qualification:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration' && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'scripting-qualification')
    name: S7 reference performance and release acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-release
          cache-variant: scripting-qualification
          conan-cache-writer: 'false'
      - name: Build the headless Release Behavior SDK
        run: |
          ./scripts/script-provider bootstrap
          out/host-tools/venv/bin/cmake --preset linux-clang-release \
            -DLUDUS_USE_INIT_OPTIONS=OFF -DLUDUS_BUILD_BEHAVIOR=ON \
            -DLUDUS_BUILD_BEHAVIOR_ACCEPTANCE=OFF -DLUDUS_BUILD_TESTS=OFF \
            -DLUDUS_BUILD_EDITOR=OFF -DLUDUS_PLATFORM_ENABLE_WAYLAND=OFF \
            -DLUDUS_WARNINGS_AS_ERRORS=ON
          out/host-tools/venv/bin/cmake --build --preset linux-clang-release --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          ./scripts/install-sdk linux-clang-release
      - name: Validate qualification evidence and run the reference workload
        run: |
          out/host-tools/venv/bin/python -m unittest discover -s tools/behavior-qualification -p 'test_*.py'
          ./scripts/script-qualification --sdk out/install/linux-clang-release \
            --output out/behavior-s7-release --check
      - name: Publish reference evidence and extracted-player archive
        uses: actions/upload-artifact@v4
        with:
          name: behavior-s7-linux-release-reference
          path: |
            out/behavior-s7-release/current.json
            out/behavior-s7-release/run-*/evidence.json
            out/behavior-s7-release/run-*/*.log
            out/behavior-s7-release/run-*/scripted-game-release.zip
          if-no-files-found: error

  filesystem-fuzz:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration' && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'filesystem-fuzz')
    name: Filesystem pack fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          conan-cache-writer: 'false'
          compiler-cache-writer: 'false'
      - name: Build fully instrumented reader and decoder
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development -B out/build/filesystem-fuzz -DLUDUS_BUILD_FILESYSTEM_FUZZERS=ON
          out/host-tools/venv/bin/cmake --build out/build/filesystem-fuzz --target ludus_filesystem_pack_fuzzer --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          out/host-tools/bin/clang-tidy -p out/build/filesystem-fuzz --warnings-as-errors='*' modules/foundation/filesystem/tests/pack_fuzzer.cpp
      - name: Fuzz seeded indexes and independent decode under ASan and UBSan
        run: |
          python3 tests/filesystem/generate_pack_fixtures.py out/fuzz/fixture.hpp --corpus out/fuzz/corpus
          out/build/filesystem-fuzz/modules/foundation/filesystem/ludus_filesystem_pack_fuzzer out/fuzz/corpus -max_total_time=60 -max_len=65536 -timeout=2 -rss_limit_mb=512 -artifact_prefix=out/fuzz/
      - name: Preserve reproducible corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filesystem-pack-fuzz
          path: out/fuzz/
          if-no-files-found: warn

  threading-races:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration' && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'threading-races')
    name: Threading race detection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          cache-variant: threading-tsan
          conan-cache-writer: 'false'
      - name: Configure and build the threading kernel with TSan
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development -B out/build/threading-tsan \
            -DLUDUS_ENABLE_TSAN=ON -DLUDUS_WARNINGS_AS_ERRORS=ON
          out/host-tools/venv/bin/cmake --build out/build/threading-tsan --parallel "$CMAKE_BUILD_PARALLEL_LEVEL" \
            --target ludus_tsan_control_child ludus_foundation_threading_tests ludus_threading_startup_tests ludus_filesystem_tests ludus_filesystem_async_fault_tests ludus_audio_content_tests ludus_audio_content_worker_tests ludus_resources_tests ludus_resources_audio_tests
      - name: Prove TSan detection before race acceptance
        run: out/host-tools/venv/bin/ctest --test-dir out/build/threading-tsan --label-regex sanitizer-control --output-on-failure --no-tests=error --repeat until-fail:16
      - name: Test dependencies, publication, cancellation and startup with TSan
        run: out/host-tools/venv/bin/ctest --test-dir out/build/threading-tsan --tests-regex "ludus_(foundation_threading|threading_startup|filesystem|filesystem_async_fault|audio_content|audio_content_worker|resources|resources_audio)_tests" --output-on-failure --no-tests=error
      - name: Preserve race-detection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threading-tsan
          path: |
            out/build/threading-tsan/Testing/Temporary/
            out/build/threading-tsan/tests/quality/*-evidence/
          if-no-files-found: error
          retention-days: 14

  analysis:
    needs: changes
    # Runs on integration pull requests too: an analysis failure found only by the
    # batch blocks promotion of every change merged with it.
    if: needs.changes.outputs.native_required == 'true' && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'analysis')
    name: Clang static analysis (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    # Thanks to GitHub, "Running jobs in a container", for the job image and Bash default.
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/run-jobs-in-a-container
    container:
      image: ${{ needs.changes.outputs.native_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    env:
      LUDUS_TIDY_JOBS: "4"
      LUDUS_TIDY_SHARD_COUNT: "2"
      LUDUS_TIDY_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          conan-cache-writer: 'false'
          compiler-cache-writer: 'false'
      # Generated headers/sources must exist before analyzing the compile database.
      - name: Build analysis inputs
        run: ./scripts/build linux-clang-development
      - name: Analyze every project translation unit
        run: ./scripts/check linux-clang-development --tidy
      # Naming, magic-number and implicit-bool rules apply to changed lines only
      # (AGENTS.md "Naming enforcement"); one shard analyzes the whole change.
      - name: Analyze changed lines with naming and magic-number rules
        if: matrix.shard == 0
        env:
          LUDUS_TIDY_SHARD_COUNT: "1"
          LUDUS_TIDY_SHARD_INDEX: "0"
          CHANGED_LINES_BASE: ${{ inputs.batch_base_sha || github.event.pull_request.base.sha || 'origin/main' }}
        run: ./scripts/check linux-clang-development --tidy-changed --base "$CHANGED_LINES_BASE"
      - name: Review complete stable analyzer baseline
        if: needs.changes.outputs.validation_tier == 'nightly'
        continue-on-error: true
        run: ./scripts/check linux-clang-development --analyzer
      - name: Preserve source inventory and bounded analysis diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ matrix.shard }}
          path: out/quality/analysis/
          if-no-files-found: error
          retention-days: 14
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi

  editor:
    needs: changes
    # Integration pull requests compile here (build graph, every default target
    # with warnings as errors, Editor analysis) and run only the generated-source
    # checks and the quick unit/Editor list, restoring but never saving the batch's
    # caches. Batches also run the remaining tests and journeys.
    if: needs.changes.outputs.native_required == 'true' && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'editor')
    name: Editor, shader worker and unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.changes.outputs.native_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      LUDUS_TIDY_JOBS: "4"
      # Compile the editor without its precompiled headers from the first
      # configure (./init.sh in native-setup) onwards; see the configure step.
      LUDUS_EDITOR_PRECOMPILED_HEADERS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          editor: 'true'
          configure-editor-only: 'true'
          cache-variant: editor
          conan-cache-writer: 'false'
          # Pull-request caches would evict the batch's main-scope baseline.
          compiler-cache-writer: ${{ needs.changes.outputs.validation_tier == 'integration' && 'false' || 'true' }}
      - name: Configure the shader worker with verified authoring tools
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development -DLUDUS_EDITOR_RENDER_PREVIEW=ON -DLUDUS_BUILD_SHADER_WORKER=ON -DLUDUS_EDITOR_PRECOMPILED_HEADERS=OFF -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc" -DLUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val"
      # Compile authoring and live reload once per combined batch, including all
      # default targets previously built separately on every integration PR.
      # The editor's precompiled headers stay off here, so an editor source that
      # relies on a Qt or standard header it does not include fails this build.
      # The macOS jobs and Linux sanitizer build keep the default (on).
      # The configured editor and test graph must compile each source in one target.
      - name: Check that each source compiles once
        run: out/host-tools/venv/bin/python tools/check_build_graph.py out/build/linux-clang-development --summary "$GITHUB_STEP_SUMMARY" --report out/build-graph/linux-clang-development.json
      - name: Build every default target with the Editor and shader worker
        run: out/host-tools/venv/bin/cmake --build --preset linux-clang-development
      - name: Compare saved World raster captures on Linux Vulkan
        if: needs.changes.outputs.validation_tier != 'integration'
        uses: ./.github/actions/raster-baseline
        with:
          editor: out/build/linux-clang-development/apps/editor/ludus_editor_tests
      # Checked-in generated sources (such as the SDK .luslh headers) need tools only this
      # build produces, so integration pull requests check them here rather than in a batch.
      - name: Check checked-in generated sources
        run: out/host-tools/venv/bin/ctest --preset linux-clang-development --label-regex '^generated-source$' --output-on-failure --no-tests=error
      # The build above already produced every unit and Editor test. Sub-second ones run on
      # every pull request, so a change and the test it breaks meet before the batch; the
      # batch's full run below excludes them (docs/development/continuous-integration.md#quick-pull-request-tests).
      - name: Run quick unit and Editor tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          out/host-tools/venv/bin/python scripts/python/pull_request_tests.py out/build/linux-clang-development --ctest out/host-tools/venv/bin/ctest
          out/host-tools/venv/bin/ctest --preset linux-clang-development --tests-from-file "$PWD/config/pull_request_tests.txt" --timeout 120 --output-on-failure --no-tests=error
      - name: Run advisory RenderGraph camera pilot
        if: needs.changes.outputs.validation_tier == 'integration' && needs.changes.outputs.camera_pilot == 'true'
        continue-on-error: true
        run: python3 scripts/python/camera_pilot.py
      - name: Verify unit and Editor tests and worker-on target detection
        if: needs.changes.outputs.validation_tier != 'integration'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          out/host-tools/venv/bin/ctest --preset linux-clang-development --label-regex '^(unit|editor)$' --label-exclude '^generated-source$' --exclude-from-file "$PWD/config/pull_request_tests.txt" --no-tests=error --output-junit "$RUNNER_TEMP/editor-tests.xml"
          out/host-tools/venv/bin/ctest --preset linux-clang-development --tests-regex '^ludus_target_detection$' --output-on-failure --no-tests=error
      - name: Report CTest timeout headroom
        if: always() && needs.changes.outputs.validation_tier != 'integration'
        run: >-
          python3 scripts/python/ctest_headroom.py out/build/linux-clang-development --ctest out/host-tools/venv/bin/ctest
          --junit "$RUNNER_TEMP/editor-tests.xml"
          --title "Unit and Editor tests: CTest timeout headroom"
      # Play in the viewport on Linux: Qt's own Vulkan device on an Xvfb display,
      # with Mesa's lavapipe for both the editor and the game, imports the game's
      # exported memory. The journey plays the World-demo game in the World viewport.
      - name: Verify Play in the World viewport on Vulkan
        if: needs.changes.outputs.validation_tier != 'integration'
        run: |
          bash .github/actions/apt-install/apt-install.sh xvfb xauth
          out/host-tools/venv/bin/cmake --preset linux-clang-development -DLUDUS_BUILD_WORLD_DEMO=ON
          out/host-tools/venv/bin/cmake --build --preset linux-clang-development \
            --target ludus_editor_tests ludus_world_demo ludus_rhi_hosted_producer
          xvfb-run -a -s '-screen 0 1600x1000x24' env QT_QPA_PLATFORM=xcb \
            out/build/linux-clang-development/apps/editor/ludus_editor_tests '[play][gpu],[.play-native]'
      - name: Measure the content browser projection
        if: needs.changes.outputs.validation_tier != 'integration'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          out/build/linux-clang-development/apps/editor/ludus_editor_tests '[content][scale]' --success > out/editor-content-scale.txt
          tee -a "$GITHUB_STEP_SUMMARY" < out/editor-content-scale.txt
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.validation_tier != 'integration'
        with:
          name: editor-content-scale
          path: out/editor-content-scale.txt
      - name: Analyze document interactions and regressions
        run: |
          ./scripts/check linux-clang-development --tidy-sources \
            apps/editor/src/controller.cpp apps/editor/src/main_window.cpp \
            apps/editor/src/main_window_layout.cpp apps/editor/src/document_commands.cpp \
            apps/editor/src/configuration_workspace.cpp apps/editor/src/audio_workspace.cpp \
            apps/editor/src/audio_preview.cpp \
            apps/editor/tests/document_history_tests.cpp apps/editor/tests/document_interaction_tests.cpp \
            apps/editor/src/content_catalog_model.cpp apps/editor/src/content_import.cpp \
            apps/editor/src/content_jobs.cpp apps/editor/src/content_workspace.cpp \
            apps/editor/tests/content_browser_tests.cpp apps/editor/tests/content_import_gate_tests.cpp \
            apps/editor/src/controller_play.cpp apps/editor/src/script_workspace.cpp \
            apps/editor/tests/script_workspace_tests.cpp \
            apps/editor/src/world_demo_adapter.cpp \
            apps/editor/src/world_document.cpp apps/editor/src/world_workspace.cpp \
            apps/editor/src/render_scene.cpp apps/editor/src/render_preview.cpp \
            apps/editor/src/editor_camera_controller.cpp apps/editor/src/viewport_navigation.cpp \
            apps/editor/tests/viewport_navigation_tests.cpp \
            apps/editor/src/preview_viewport.cpp apps/editor/src/qt_viewport_device_vulkan.cpp \
            apps/editor/src/level_workspace.cpp apps/editor/tests/level_workspace_tests.cpp \
            apps/editor/src/render_load_job.cpp apps/editor/src/render_panel.cpp \
            apps/editor/tests/render_authoring_tests.cpp \
            apps/editor/tests/world_workspace_tests.cpp \
            apps/editor/tests/world_demo_workspace_tests.cpp
      - name: Verify S5 Editor, installed Behavior SDK and GameHost journey
        if: needs.changes.outputs.validation_tier != 'integration'
        run: |
          ./scripts/script-provider bootstrap
          out/host-tools/venv/bin/cmake --preset linux-clang-development \
            -DLUDUS_BUILD_SCRIPT_INTERACTION=OFF -DLUDUS_BUILD_SCRIPT_SESSION=OFF \
            -DLUDUS_BUILD_VISUAL_SEQUENCE=OFF
          ./scripts/script-provider run --preset linux-clang-development
          out/host-tools/venv/bin/cmake --build --preset linux-clang-development
          out/host-tools/venv/bin/cmake --install out/build/linux-clang-development
          QT_QPA_PLATFORM=offscreen LUDUS_SDK_PREFIX="$PWD/out/install/linux-clang-development" \
            out/build/linux-clang-development/apps/editor/ludus_editor_tests '[.script-journey]'
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi

  # Debug runtime already runs the complete Debug assertion/build contracts.
  assertion-policy:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration' && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'assertion-policy')
    name: Assertion policy (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-clang-profile, linux-clang-release]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: ${{ matrix.preset }}
      - name: Build and test all assertion policies including Release
        run: |
          out/host-tools/venv/bin/cmake --preset ${{ matrix.preset }} -B out/build/assertion-policy -DLUDUS_BUILD_TESTS=ON -DLUDUS_WARNINGS_AS_ERRORS=ON
          out/host-tools/venv/bin/cmake --build out/build/assertion-policy --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          out/host-tools/venv/bin/ctest --test-dir out/build/assertion-policy --output-on-failure
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi

  pch:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration' && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'pch')
    name: PCH build (LUDUS_ENABLE_PCH=ON)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          cache-variant: pch
          conan-cache-writer: 'false'
      - name: Configure, build, and test with the foundational PCH enabled
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development -B out/build/pch \
            -DLUDUS_BUILD_TESTS=ON -DLUDUS_WARNINGS_AS_ERRORS=ON -DLUDUS_ENABLE_PCH=ON
          out/host-tools/venv/bin/cmake --build out/build/pch --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          # Compile-policy/header contracts run in the non-PCH jobs; their
          # standalone reparsing does not support injected PCH flags.
          out/host-tools/venv/bin/ctest --test-dir out/build/pch --output-on-failure --label-exclude build-contract
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi

  build-budget:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration' && ((inputs.evidence_job || 'all') == 'all' || inputs.evidence_job == 'build-budget')
    name: Build-time budget
    runs-on: ubuntu-24.04
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          compiler-cache: 'false'
          conan-cache-writer: 'false'
      # Setup only: --ci would repeat all native validation before profiling.
      # Keep the clean profile uncached and concurrency stable for timing budgets.
      - name: Enforce build-time budget
        run: ./scripts/check-build-budget --profile
      - name: Check that each source compiles once
        if: always()
        run: out/host-tools/venv/bin/python tools/check_build_graph.py out/build/linux-clang-development --summary "$GITHUB_STEP_SUMMARY" --report out/profile/build-graph.json
      - name: Publish build-time profile summary
        if: always()
        run: |
          echo "### Build-time budget" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Time summary/,/Expensive headers/p' out/profile/*-analysis.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Save detailed build profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-profile
          path: out/profile/
          if-no-files-found: warn

  linux:
    # Thanks to GitHub, "Using conditions to control job execution": keep the
    # required check present, and allow skipped native jobs only for docs-only
    # changes whose classification and routing regressions succeeded.
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-jobs-with-conditions
    # A cancelled pull-request run passes only when a newer, uncancelled run of
    # this workflow covers the same head commit; that run's gate owns the result.
    name: ${{ (inputs.sanitizer_experiment == 'rebuild' || inputs.sanitizer_experiment == 'shared') && 'Sanitizer experiment dispatch' || github.event_name == 'workflow_dispatch' && inputs.mcmc_vulkan_parity_only == true && 'Focused Vulkan dispatch (not integration)' || inputs.evidence_job && inputs.evidence_job != 'all' && format('Evidence gate ({0})', inputs.evidence_job) || 'Ubuntu Clang' }}
    needs: [changes, macos-compile, macos-reference, macos-sanitizers, macos-analysis, macos-objcxx-analysis, formatting, debug-runtime, development, sanitizers, filesystem-fuzz, threading-races, analysis, editor, assertion-policy, pch, build-budget, scripting-qualification]
    if: always() && (github.event_name != 'workflow_dispatch' || (inputs.mcmc_vulkan_parity_only != true && inputs.sanitizer_experiment != 'rebuild' && inputs.sanitizer_experiment != 'shared'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - name: Enforce validation for the classified change scope
        env:
          EVIDENCE_JOB: ${{ inputs.evidence_job }}
          RESULTS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/python/ci_scope.py gate
