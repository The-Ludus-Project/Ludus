          retention-days: 14

  formatting:
    needs: changes
    if: needs.changes.outputs.native_required == 'true'
    name: Source formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned formatter and GUI test dependencies
        run: |
          # Reusable definitions stay on main; the captured candidate owns its tool pin.
          llvm_major="$(python3 -c 'import json; print(int(json.load(open("config/tool_versions.json"))["minimum"]["clang"].split(".")[0]))')"
          if [[ -f scripts/python/llvm_apt_source.py ]]; then python3 scripts/python/llvm_apt_source.py; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq "clang-format-$llvm_major" "clang-tidy-$llvm_major" python3-venv python3-tk xvfb xauth liblz4-1
          echo "LUDUS_CI_LLVM_MAJOR=$llvm_major" >> "$GITHUB_ENV"
      - name: Install pinned CMake and Ninja for live project setup tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts/python")
          import engine
          root = Path.cwd()
          engine.create_or_update_venv(root)
          engine.install_managed_tools(root, engine.load_tool_versions(root))
          PY
          echo "$PWD/out/host-tools/venv/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned tooling quality checks
        run: ./scripts/setup-quality-tools
      - name: Test tooling checks and editor preset boundaries
        run: PYTHONPATH=scripts/python python3 -m unittest test_quality_tools test_editor_setup -v
      - name: Validate workflow syntax before admitting a candidate
        run: out/host-tools/bin/actionlint -shellcheck= -pyflakes=
      - name: Review Python and workflow correctness baseline
        continue-on-error: true
        run: ./scripts/check --tooling
      - name: Preserve tooling quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tooling-quality
          path: out/quality/tooling/
          if-no-files-found: error
          retention-days: 14
      - name: Test formatting and staged-file preservation
        run: python3 -m unittest discover -s scripts/python -p 'test_formatting.py' -v
      - name: Test reproducible packs with the independent LZ4 decoder
        run: python3 -m unittest discover -s scripts/python -p test_pack_builder.py -v
      - name: Test Metal shader reflection contracts
        run: PYTHONPATH=scripts/python python3 -m unittest test_rhi_measurements test_metal_shaders test_raster_shaders test_texture_cooker -v
      - name: Test optional RAD tooling contracts
        run: python3 -m unittest discover -s scripts/python -p 'test_rad_debugger.py' -v
      - name: Test graphical and CLI initialization routing
        # A window test that stops responding must fail the job, not hold the runner.
        timeout-minutes: 10
        run: xvfb-run -a env LUDUS_TEST_GUI=1 python3 -m unittest discover -s scripts/python -p 'test_init*.py' -v
      - name: Test CI initialization and analysis contracts
        run: PYTHONPATH=scripts/python python3 -m unittest test_ci test_batch_ci test_quality test_ray_reference test_runtime_profile -v
      - name: Live reload tooling tests
        run: |
          python3 -m unittest discover -s scripts/python -p 'test_play*.py' -v
          python3 -m unittest discover -s scripts/python -p 'test_process_ownership.py' -v
      - name: Reject standard formatting and heavy public headers
        run: |
          python3 tools/check_build_time_includes.py
          python3 tests/build_time/policy_tests.py
          python3 tools/check_container_policy.py
          python3 -m unittest discover -s scripts/python -p test_check_container_policy.py -v
          python3 tools/check_target_macros.py
          python3 -m unittest discover -s scripts/python -p test_check_target_macros.py -v
      - name: Verify source formatting
        run: ./scripts/check --format
      - name: Enforce review-derived source rules
        env:
          SOURCE_POLICY_BASE: ${{ inputs.batch_base_sha || github.event.pull_request.base.sha || 'origin/main' }}
          SOURCE_POLICY_HEAD: ${{ inputs.batch_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/python/source_policy.py --base "$SOURCE_POLICY_BASE" --head "$SOURCE_POLICY_HEAD" --clang-format "clang-format-$LUDUS_CI_LLVM_MAJOR"
          PYTHONPATH=scripts/python python3 -m unittest test_source_policy test_check_naming test_changed_tidy test_renderer_shader_recipes -v
      - name: Test S0 Luau source and bytecode integrity contracts
        run: python3 -m unittest discover -s tools/luau-probe -p 'test_*.py' -v
      - name: Test L0 localization document, receipt and manifest contracts
        run: |
          python3 -m unittest discover -s scripts/python -p 'test_localization_corpus.py' -v
          python3 -m unittest discover -s tools/icu-probe -p 'test_*.py' -v
          ./scripts/localization-corpus validate --manifest modules/localization/corpus/release.json
      - name: Test S1 manifest and cook admission contracts
        run: python3 -m unittest discover -s tools/script-cook -p 'test_*.py' -v

  debug-runtime:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration'
    name: Debug runtime and source debugger
    runs-on: ubuntu-24.04
