        run: ./scripts/build linux-clang-debug
      - name: Test Debug including mandatory GDB and persistent supervisor journeys
        run: out/host-tools/venv/bin/ctest --preset linux-clang-debug --no-tests=error
      - name: Preserve native debugger and supervisor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reload-debug-diagnostics
          path: out/build/linux-clang-debug/Testing/Temporary/
          if-no-files-found: error
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi

  development:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration'
    name: Development and SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
      - name: Build Development without PCH
        run: ./scripts/build linux-clang-development
      - name: Validate private S0 Luau interpreter and debugger profile
        run: |
          ./scripts/luau-probe bootstrap
          ./scripts/luau-probe cook
          ./scripts/luau-probe run --preset linux-clang-development
          ./scripts/luau-probe check --preset linux-clang-development
      - name: Validate S1 generated contract and native/Luau interaction
        run: |
          ./scripts/script-interaction bootstrap
          ./scripts/script-interaction cook
          ./scripts/script-interaction run --preset linux-clang-development
          ./scripts/script-interaction check --preset linux-clang-development
      - name: Validate S2 debug, dependency cook and native VM replacement
        run: |
          ./scripts/script-session cook
          ./scripts/script-session run --preset linux-clang-development
          ./scripts/script-session check --preset linux-clang-development
      - name: Validate S4 installed provider and project cooker
        run: |
          ./scripts/script-provider run --preset linux-clang-development
          ./scripts/script-provider check --preset linux-clang-development
      - name: Validate S3 visual sequence and authoring ownership
        run: |
          ./scripts/visual-sequence cook
          ./scripts/visual-sequence run --preset linux-clang-development
          ./scripts/visual-sequence check --preset linux-clang-development
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install pinned S3 authoring test browser
        working-directory: tools/web-browser-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise S3 designer author, review, debug and replacement journey
        run: node tools/visual-sequence/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-s3-authoring-evidence
          path: out/browser-qa/results/visual-s3*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: behavior-s6-linux-evidence
          path: out/build/linux-clang-development/tools/script-provider/safety-evidence.json
          if-no-files-found: error
      - name: Test Development
        run: out/host-tools/venv/bin/ctest --preset linux-clang-development --no-tests=error
      - name: Measure bounded filesystem reads and native syscall overhead
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development -DLUDUS_BUILD_FILESYSTEM_BENCHMARK=ON
          out/host-tools/venv/bin/cmake --build --preset linux-clang-development --target ludus_filesystem_benchmark --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          python3 tests/filesystem/generate_benchmark.py out/filesystem-benchmark
          {
            uname -a
            lscpu
            for layout in loose raw.pack lz4.pack; do
              corpus=out/filesystem-benchmark
              if [ "$layout" = loose ]; then corpus="$corpus/loose"; fi
              for workers in 0 1 4; do
                sync
                sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches'
                echo "cache_reset=drop_caches layout=$layout workers=$workers"
                out/build/linux-clang-development/modules/foundation/filesystem/ludus_filesystem_benchmark "$corpus" "$layout" "$workers"
              done
            done
          } | tee out/filesystem-benchmark/measurements.txt
          sudo apt-get update -qq
          sudo apt-get install -y strace
          for layout in loose raw.pack lz4.pack; do
            corpus=out/filesystem-benchmark
            if [ "$layout" = loose ]; then corpus="$corpus/loose"; fi
            strace -f -c -e trace=pread64,fstat,newfstatat,openat,close \
              -o "out/filesystem-benchmark/syscalls-$layout.txt" \
              out/build/linux-clang-development/modules/foundation/filesystem/ludus_filesystem_benchmark "$corpus" "$layout" 4
          done
      - name: Measure representative streaming traces with periodic collection
        run: |
          python3 tests/filesystem/streaming.py generate out/filesystem-streaming --count 128
          python3 tests/filesystem/streaming.py measure out/filesystem-streaming \
            --benchmark out/build/linux-clang-development/modules/foundation/filesystem/ludus_filesystem_benchmark \
            --output out/filesystem-streaming/results --repetitions 3 --contention 0 \
            --open-modes shared --tracing 0 --cache warm \
            --compiler-description "CI $(out/host-tools/bin/clang++ --version | head -n 1) Development O2" \
            --storage-description 'disposable Ubuntu runner, see environment.json mount/df'
          out/host-tools/venv/bin/ctest --preset linux-clang-development -R 'filesystem_streaming_' --no-tests=error
      - name: Preserve filesystem measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filesystem-benchmark
          path: |
            out/filesystem-benchmark/measurements.txt
            out/filesystem-benchmark/syscalls-*.txt
            out/filesystem-streaming/manifest.json
            out/filesystem-streaming/*.trace
            out/filesystem-streaming/results/
      - name: Validate installed SDK and consumer
        run: ./scripts/install-sdk linux-clang-development
      - name: Cook and execute an independent project with the relocated Behavior SDK
        run: |
          python3 tools/script-provider/verify_consumer.py out/install/linux-clang-development
          python3 tools/script-provider/verify_optional.py linux-clang-development
      - name: Relocate the SDK and link a consumer without producer dependencies
        run: |
          set -euo pipefail
          reloc="$RUNNER_TEMP/relocated-sdk"
          cp -a out/install/linux-clang-development "$reloc"
          consumer="$RUNNER_TEMP/relocated-consumer"
          tools="$PWD/out/host-tools/venv/bin"
          llvm_major="$(python3 -c 'import json; print(int(json.load(open("config/tool_versions.json"))["minimum"]["clang"].split(".")[0]))')"
          env -i PATH="$tools:/usr/bin:/bin" "$tools/cmake" \
            -S tests/sdk_consumer -B "$consumer" -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$tools/ninja" \
            -DCMAKE_CXX_COMPILER="/usr/bin/clang++-$llvm_major" \
            -DCMAKE_PREFIX_PATH="$reloc" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          env -i PATH="$tools:/usr/bin:/bin" "$tools/cmake" --build "$consumer" --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          "$consumer/ludus_sdk_consumer"
          if grep -q '/modules/' "$consumer/compile_commands.json"; then
            echo 'Relocated consumer compiled engine sources'; exit 1
          fi
      - name: Verify installed shader toolchain and generated backend contracts
        run: |
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
          ./scripts/shader-probe bootstrap
          ./scripts/bootstrap-spirv-cross
          python3 tests/sdk_consumer/verify_shader_build.py \
            --sdk "$PWD/out/install/linux-clang-development" \
            --cmake "$PWD/out/host-tools/venv/bin/cmake" \
            --ninja "$PWD/out/host-tools/venv/bin/ninja" \
            --cxx "$PWD/out/host-tools/bin/clang++" \
            --slang "$PWD/out/shader-tools/slang/bin/slangc" \
            --validator "$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            --spirv-cross "$PWD/out/shader-tools/spirv-cross/bin/spirv-cross" \
            --conan "$PWD/out/conan/linux-clang-development"
      - name: Qualify installed RG1 SPIR-V, WGSL and GLSL packages
        run: |
          out/host-tools/venv/bin/python -m venv out/rg1-cli
          out/rg1-cli/bin/python -m pip install --no-deps ./scripts/python
          out/host-tools/venv/bin/python tests/sdk_consumer/verify_render_graph_build.py \
            --cli "$PWD/out/rg1-cli/bin/ludus" --sdk "$PWD/out/install/linux-clang-development" \
            --slang "$PWD/out/shader-tools/slang/bin/slangc" --cxx "$PWD/out/host-tools/bin/clang++" \
            --validator "$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            --spirv-cross "$PWD/out/shader-tools/spirv-cross/bin/spirv-cross" \
            --profiles spirv wgsl glsl --sanitize --output out/rg1-linux
          out/host-tools/venv/bin/python tests/sdk_consumer/verify_render_graph_execution.py \
            --cli "$PWD/out/rg1-cli/bin/ludus" --sdk "$PWD/out/install/linux-clang-development" \
            --slang "$PWD/out/shader-tools/slang/bin/slangc" --cxx "$PWD/out/host-tools/bin/clang++" \
            --cmake "$PWD/out/host-tools/venv/bin/cmake" \
            --validator "$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            --spirv-cross "$PWD/out/shader-tools/spirv-cross/bin/spirv-cross" \
            --profiles spirv wgsl glsl --output out/rg2-linux
      - name: Validate RG1 emitted browser shaders
        run: |
          cd tools/web-browser-tests
          npm ci
          npx playwright install --with-deps chromium
          cd ../..
          node tests/sdk_consumer/render-graph-browser-test.mjs out/rg1-linux
      - name: Validate portable Vulkan raster pixels with validation layers
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development \
            -DLUDUS_BUILD_SHADER_WORKER=ON \
            -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc" \
            -DLUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            -DLUDUS_SPIRV_CROSS="$PWD/out/shader-tools/spirv-cross/bin/spirv-cross"
          out/host-tools/venv/bin/cmake --build out/build/linux-clang-development --target ludus_rhi_render_tests ludus_renderer_render_tests ludus_render_graph_ray_tests ludus_rhi_ray_tests ludus_rhi_native_interop_consumer ludus_rhi_r11_consumer ludus_rhi_r9_consumer ludus_rhi_r18c_consumer ludus-shader-worker ludus_shader_compiler_tests --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/host-tools/venv/bin/ctest --test-dir out/build/linux-clang-development --tests-regex '^ludus_shader_(compiler_tests|worker_protocol|reload_gpu)$' --output-on-failure --no-tests=error
          set -o pipefail
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/rhi/ludus_rhi_render_tests 2>&1 | tee out/raster-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/raster-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/rhi/ludus_rhi_native_interop_consumer 2>&1 | tee out/native-interop-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/native-interop-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/rhi/ludus_rhi_r11_consumer 2>&1 | tee out/r11-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/r11-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/rhi/ludus_rhi_r18c_consumer 2>&1 | tee out/r18c-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/r18c-vulkan-validation.log").read_text(); assert "R18c passed true" in text and "GPU result 20" in text and "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/rhi/ludus_rhi_r9_consumer 2>&1 | tee out/r18-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/r18-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text and "R18 BC5 enabled true; sampled width 8240" in text and "R18 BC5 unaligned edges enabled true" in text, text'
          out/host-tools/venv/bin/cmake -S tests/sdk_consumer/raster -B out/r11-raster-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER="$PWD/out/host-tools/bin/clang++" -DCMAKE_MAKE_PROGRAM="$PWD/out/host-tools/venv/bin/ninja" \
            -DCMAKE_PREFIX_PATH="$PWD/out/install/linux-clang-development;$PWD/out/conan/linux-clang-development" \
            -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc" \
            -DLUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            -DLUDUS_SPIRV_CROSS="$PWD/out/shader-tools/spirv-cross/bin/spirv-cross"
          out/host-tools/venv/bin/cmake --build out/r11-raster-sdk --target ludus_sdk_r11_consumer ludus_sdk_r9_consumer ludus_sdk_r18c_consumer --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/r11-raster-sdk/ludus_sdk_r11_consumer 2>&1 | tee out/r11-sdk-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/r11-sdk-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/r11-raster-sdk/ludus_sdk_r18c_consumer 2>&1 | tee out/r18c-sdk-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/r18c-sdk-vulkan-validation.log").read_text(); assert "R18c passed true" in text and "GPU result 20" in text and "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/r11-raster-sdk/ludus_sdk_r9_consumer 2>&1 | tee out/r18-sdk-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/r18-sdk-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text and "R18 BC5 enabled true; sampled width 8240" in text and "R18 BC5 unaligned edges enabled true" in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/rhi/ludus_rhi_ray_tests 2>&1 | tee out/ray-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/ray-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text, text'
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/renderer/ludus_renderer_render_tests 2>&1 | tee out/renderer-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/renderer-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text, text'
          # RG2/RG3 evidence: SPIR-V runtime generations decode and activate on Vulkan; a skipped GPU case fails here.
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/renderer/ludus_renderer_render_tests '[render-graph]' 2>&1 | tee out/render-graph-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/render-graph-vulkan-validation.log").read_text(); assert "All tests passed" in text and "skipped" not in text and "Validation Error" not in text and "VUID-" not in text, text'
          # Compute ray-tracing C2 evidence: Mesa llvmpipe is a CPU device, which the Vulkan ray profile rejects,
          # so scene compute packages must select raster here, both with and without the ray preference.
          # The hardware ray cases skip on this runner and need a Vulkan GPU; they are not run here.
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/build/linux-clang-development/modules/graphics/renderer/ludus_render_graph_ray_tests '[compute-ray-tracing][selection]' --success 2>&1 | tee out/compute-ray-fallback-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/compute-ray-fallback-vulkan-validation.log").read_text(); assert "All tests passed" in text and "skipped" not in text and "Validation Error" not in text and "VUID-" not in text, text; assert "hasNativeRays := false" in text and "hasNativeRays := true" not in text and "shouldRequestRay := true" in text, text'
          out/host-tools/venv/bin/cmake -S tests/sdk_consumer/renderer -B out/renderer-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER="$PWD/out/host-tools/bin/clang++" -DCMAKE_MAKE_PROGRAM="$PWD/out/host-tools/venv/bin/ninja" \
            -DCMAKE_PREFIX_PATH="$PWD/out/install/linux-clang-development;$PWD/out/conan/linux-clang-development" \
            -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc" \
            -DLUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            -DLUDUS_SPIRV_CROSS="$PWD/out/shader-tools/spirv-cross/bin/spirv-cross"
          out/host-tools/venv/bin/cmake --build out/renderer-sdk --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          out/renderer-sdk/ludus_sdk_renderer_consumer
          out/renderer-sdk/ludus_sdk_renderer_views_consumer
          out/renderer-sdk/ludus_sdk_renderer_overlays_consumer
          out/renderer-sdk/ludus_sdk_renderer_materials_consumer
          out/renderer-sdk/ludus_sdk_renderer_lighting_consumer
          out/renderer-sdk/ludus_sdk_renderer_scaling_consumer
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/renderer-sdk/ludus_sdk_render_graph_runtime_consumer 2>&1 | tee out/rg3-sdk-vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/rg3-sdk-vulkan-validation.log").read_text(); assert "Validation Error" not in text and "VUID-" not in text, text'
          # RG4 evidence: pooled and serial-control exports, allocation counts, bytes and CPU p50/p95.
          mkdir -p out/rg4-evidence
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation out/renderer-sdk/ludus_sdk_render_graph_pooling_consumer 2>&1 | tee out/rg4-evidence/vulkan-validation.log
          python3 -c 'from pathlib import Path; text=Path("out/rg4-evidence/vulkan-validation.log").read_text(); assert "pooling passed" in text and "Validation Error" not in text and "VUID-" not in text, text'
          out/renderer-sdk/ludus_sdk_reference_capture out/reference.luhdr
          python3 scripts/reference-hdr out/reference.luhdr --pfm out/reference.pfm --manifest out/reference.json
          out/host-tools/venv/bin/ctest --test-dir out/renderer-sdk/reference-scene --output-on-failure
          out/host-tools/bin/clang-tidy -p out/renderer-sdk --warnings-as-errors='*' examples/reference-scene/src/main.cpp
          out/host-tools/venv/bin/python - <<'PYFORMAT'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/python')
          from formatting import format_source
          path = Path('examples/reference-scene/src/main.cpp')
          assert format_source(path.read_text(), path, 'out/host-tools/bin/clang-format') == path.read_text()
          PYFORMAT
      - name: Upload RG4 pooling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rg4-pooling-vulkan
          path: out/rg4-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Check the reference scene consumer with ASan and UBSan
        env:
          # Thanks to Khronos, "Vulkan Loader Interface Architecture", loader
          # environment variables: retain driver modules for LeakSanitizer's
          # process-exit reachability scan and symbolized allocation stacks.
          # https://github.com/KhronosGroup/Vulkan-Loader/blob/main/docs/LoaderInterfaceArchitecture.md#table-of-debug-environment-variables
          VK_LOADER_DISABLE_DYNAMIC_LIBRARY_UNLOADING: '1'
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          out/host-tools/venv/bin/cmake -S examples/reference-scene -B out/reference-scene-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLUDUS_SCENE_SANITIZERS=ON \
            -DCMAKE_CXX_COMPILER="$PWD/out/host-tools/bin/clang++" -DCMAKE_MAKE_PROGRAM="$PWD/out/host-tools/venv/bin/ninja" \
            -DCMAKE_PREFIX_PATH="$PWD/out/install/linux-clang-development;$PWD/out/conan/linux-clang-development" \
            -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc" \
            -DLUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            -DLUDUS_SPIRV_CROSS="$PWD/out/shader-tools/spirv-cross/bin/spirv-cross"
          out/host-tools/venv/bin/cmake --build out/reference-scene-sanitized --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          out/host-tools/venv/bin/ctest --test-dir out/reference-scene-sanitized --output-on-failure
      - name: Build and test the independent Cornell box tutorial (Vulkan)
        run: |
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers
          export PATH="$PWD/out/host-tools/bin:$PWD/out/host-tools/venv/bin:$PATH"
          export LUDUS_SDK_PREFIX="$PWD/out/install/linux-clang-development"
          export LUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc"
          export LUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val"
          cd examples/cornell-box
          cmake --list-presets=configure
          cmake --list-presets=build
          cmake --list-presets=test
          cmake --preset linux-clang-development
          cmake --build --preset linux-clang-development
          ctest --preset linux-clang-development
          for source in src/main.cpp src/camera.cpp tests/camera_tests.cpp; do
            clang-tidy -p out/build/linux-clang-development --warnings-as-errors='*' "$source"
          done
          PYTHONPATH=../../scripts/python python3 - <<'PYFORMAT'
          from pathlib import Path
          from formatting import format_source
          from engine import find_system_tool, load_tool_versions, repo_root
          clang_format = find_system_tool(repo_root(), 'clang-format', load_tool_versions(repo_root()))
          sources = [*Path('src').glob('*.cpp'), *Path('src').glob('*.hpp'), *Path('tests').glob('*.cpp')]
          for source in sources:
              source = source.resolve()
              assert source.read_text() == format_source(source.read_text(), source, clang_format), f'Format {source}'
          PYFORMAT
          # Exercise the same setup backend as Project > Repair Project Setup.
          # Start without local presets, then prove repeated repair stays usable.
          rm -rf out/build/linux-clang-development
          PYTHONPATH=../../scripts/python python -m ludus_tools project repair . --tools ../.. --sdk "$LUDUS_SDK_PREFIX" --no-web
          PYTHONPATH=../../scripts/python python -m ludus_tools project check . --tools ../..
          PYTHONPATH=../../scripts/python python -m ludus_tools project repair . --tools ../.. --sdk "$LUDUS_SDK_PREFIX" --no-web
          git diff --exit-code -- .gitignore ludus.project.json CMakePresets.json
          cmake --preset linux-clang-development -B out/sanitized -DCORNELL_ENABLE_SANITIZERS=ON
          cmake --build out/sanitized
          ctest --test-dir out/sanitized --output-on-failure --no-tests=error
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi

  sanitizers:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration'
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-asan-ubsan
          editor: 'true'
      - name: Build with sanitizers
        run: ./scripts/build linux-clang-asan-ubsan
      - name: Prove ASan detection and fatal UBSan before acceptance
        run: out/host-tools/venv/bin/ctest --preset linux-clang-asan-ubsan --label-regex sanitizer-control --output-on-failure --no-tests=error
      - name: Preserve sanitizer control diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-controls
          path: out/build/linux-clang-asan-ubsan/tests/quality/*-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Validate S0 Luau allocation failure and lifetime profile with sanitizers
        run: |
          ./scripts/luau-probe bootstrap
          ./scripts/luau-probe cook
          ./scripts/luau-probe run --preset linux-clang-asan-ubsan
      - name: Validate S1 unpublished effects under allocation failure
        run: |
          ./scripts/script-interaction bootstrap
          ./scripts/script-interaction cook
          ./scripts/script-interaction run --preset linux-clang-asan-ubsan
      - name: Validate S2 staging, paused invocation and module retirement with sanitizers
        run: |
          ./scripts/script-session cook
          ./scripts/script-session run --preset linux-clang-asan-ubsan
      - name: Validate S3 graph debugger, candidate failure and owner retirement with sanitizers
        run: ./scripts/visual-sequence run --preset linux-clang-asan-ubsan
      - name: Validate S4 provider transactions and state under sanitizers
        run: ./scripts/script-provider run --preset linux-clang-asan-ubsan
      - name: Cache pinned L0 ICU archives, host data tools and sliced data
        uses: actions/cache@v4
        with:
          path: |
            out/icu-probe/icu4c-sources.tgz
            out/icu-probe/icu4c-data.zip
            out/icu-probe/source
            out/icu-probe/host-build
            out/icu-probe/data
          key: icu-probe-v1-${{ runner.os }}-${{ hashFiles('config/icu_toolchain.json', 'tools/icu-probe/data-filter.json', 'scripts/icu-probe') }}
      - name: Validate L0 ICU backend, L2 formatting and isolated allocation-failure sweeps with sanitizers
        run: |
          ./scripts/icu-probe bootstrap
          ./scripts/icu-probe cook
          ./scripts/icu-probe run --preset linux-clang-asan-ubsan
          ./scripts/icu-probe check --preset linux-clang-asan-ubsan
      - uses: actions/upload-artifact@v4
        with:
          name: localization-l0-linux-sanitized-evidence
          path: |
            out/build/linux-clang-asan-ubsan/tools/icu-probe/evidence.json
            out/build/linux-clang-asan-ubsan/modules/localization/format-evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: behavior-s6-linux-sanitized-evidence
          path: out/build/linux-clang-asan-ubsan/tools/script-provider/safety-evidence.json
          if-no-files-found: error
      - name: Validate S7 installed-SDK reference semantics with sanitizers
        run: |
          out/host-tools/venv/bin/cmake --install out/build/linux-clang-asan-ubsan
          out/host-tools/venv/bin/python scripts/python/engine.py bundle-sdk-dependencies \
            linux-clang-asan-ubsan --prefix out/install/linux-clang-asan-ubsan
          ./scripts/script-qualification --sdk out/install/linux-clang-asan-ubsan \
            --output out/behavior-s7-sanitized --verify-only
      - uses: actions/upload-artifact@v4
        with:
          name: behavior-s7-linux-sanitized-reference
          path: |
            out/behavior-s7-sanitized/current.json
            out/behavior-s7-sanitized/run-*/evidence.json
          if-no-files-found: error
      - name: Test with sanitizers
        env:
          LUDUS_RELOAD_METRICS: ${{ runner.temp }}/live-reload-asan-ubsan.jsonl
        run: out/host-tools/venv/bin/ctest --preset linux-clang-asan-ubsan --no-tests=error
      - name: Upload sanitizer reload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reload-asan-ubsan
          path: ${{ runner.temp }}/live-reload-asan-ubsan.jsonl
          if-no-files-found: error
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi

  scripting-qualification:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration'
    name: S7 reference performance and release acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-release
          cache-variant: scripting-qualification
          conan-cache-writer: 'false'
      - name: Build the headless Release Behavior SDK
        run: |
          ./scripts/script-provider bootstrap
          out/host-tools/venv/bin/cmake --preset linux-clang-release \
            -DLUDUS_USE_INIT_OPTIONS=OFF -DLUDUS_BUILD_BEHAVIOR=ON \
            -DLUDUS_BUILD_BEHAVIOR_ACCEPTANCE=OFF -DLUDUS_BUILD_TESTS=OFF \
            -DLUDUS_BUILD_EDITOR=OFF -DLUDUS_PLATFORM_ENABLE_WAYLAND=OFF \
            -DLUDUS_WARNINGS_AS_ERRORS=ON
          out/host-tools/venv/bin/cmake --build --preset linux-clang-release --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          ./scripts/install-sdk linux-clang-release
      - name: Validate qualification evidence and run the reference workload
        run: |
          out/host-tools/venv/bin/python -m unittest discover -s tools/behavior-qualification -p 'test_*.py'
          ./scripts/script-qualification --sdk out/install/linux-clang-release \
            --output out/behavior-s7-release --check
      - name: Publish reference evidence and extracted-player archive
        uses: actions/upload-artifact@v4
        with:
          name: behavior-s7-linux-release-reference
          path: |
            out/behavior-s7-release/current.json
            out/behavior-s7-release/run-*/evidence.json
            out/behavior-s7-release/run-*/*.log
            out/behavior-s7-release/run-*/scripted-game-release.zip
          if-no-files-found: error

  filesystem-fuzz:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration'
    name: Filesystem pack fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          conan-cache-writer: 'false'
          compiler-cache-writer: 'false'
      - name: Build fully instrumented reader and decoder
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development -B out/build/filesystem-fuzz -DLUDUS_BUILD_FILESYSTEM_FUZZERS=ON
          out/host-tools/venv/bin/cmake --build out/build/filesystem-fuzz --target ludus_filesystem_pack_fuzzer --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          out/host-tools/bin/clang-tidy -p out/build/filesystem-fuzz --warnings-as-errors='*' modules/foundation/filesystem/tests/pack_fuzzer.cpp
      - name: Fuzz seeded indexes and independent decode under ASan and UBSan
        run: |
          python3 tests/filesystem/generate_pack_fixtures.py out/fuzz/fixture.hpp --corpus out/fuzz/corpus
          out/build/filesystem-fuzz/modules/foundation/filesystem/ludus_filesystem_pack_fuzzer out/fuzz/corpus -max_total_time=60 -max_len=65536 -timeout=2 -rss_limit_mb=512 -artifact_prefix=out/fuzz/
      - name: Preserve reproducible corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filesystem-pack-fuzz
          path: out/fuzz/
          if-no-files-found: warn

  threading-races:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration'
    name: Threading race detection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          cache-variant: threading-tsan
          conan-cache-writer: 'false'
      - name: Configure and build the threading kernel with TSan
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development -B out/build/threading-tsan \
            -DLUDUS_ENABLE_TSAN=ON -DLUDUS_WARNINGS_AS_ERRORS=ON
          out/host-tools/venv/bin/cmake --build out/build/threading-tsan --parallel "$CMAKE_BUILD_PARALLEL_LEVEL" \
            --target ludus_tsan_control_child ludus_foundation_threading_tests ludus_threading_startup_tests ludus_filesystem_tests ludus_filesystem_async_fault_tests ludus_audio_content_tests ludus_audio_content_worker_tests ludus_resources_tests ludus_resources_audio_tests
      - name: Prove TSan detection before race acceptance
        run: out/host-tools/venv/bin/ctest --test-dir out/build/threading-tsan --label-regex sanitizer-control --output-on-failure --no-tests=error --repeat until-fail:16
      - name: Test dependencies, publication, cancellation and startup with TSan
        run: out/host-tools/venv/bin/ctest --test-dir out/build/threading-tsan --tests-regex "ludus_(foundation_threading|threading_startup|filesystem|filesystem_async_fault|audio_content|audio_content_worker|resources|resources_audio)_tests" --output-on-failure --no-tests=error
      - name: Preserve race-detection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threading-tsan
          path: |
            out/build/threading-tsan/Testing/Temporary/
            out/build/threading-tsan/tests/quality/*-evidence/
          if-no-files-found: error
          retention-days: 14

  analysis:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration'
    name: Clang static analysis (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LUDUS_TIDY_JOBS: "4"
      LUDUS_TIDY_SHARD_COUNT: "2"
      LUDUS_TIDY_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          conan-cache-writer: 'false'
          compiler-cache-writer: 'false'
      # Generated headers/sources must exist before analyzing the compile database.
      - name: Build analysis inputs
        run: ./scripts/build linux-clang-development
      - name: Analyze every project translation unit
        run: ./scripts/check linux-clang-development --tidy
      # Naming, magic-number and implicit-bool rules apply to changed lines only
      # (AGENTS.md "Naming enforcement"); one shard analyzes the whole change.
      - name: Analyze changed lines with naming and magic-number rules
        if: matrix.shard == 0
        env:
          LUDUS_TIDY_SHARD_COUNT: "1"
          LUDUS_TIDY_SHARD_INDEX: "0"
          CHANGED_LINES_BASE: ${{ inputs.batch_base_sha || github.event.pull_request.base.sha || 'origin/main' }}
        run: ./scripts/check linux-clang-development --tidy-changed --base "$CHANGED_LINES_BASE"
      - name: Review complete stable analyzer baseline
        if: needs.changes.outputs.validation_tier == 'nightly'
        continue-on-error: true
        run: ./scripts/check linux-clang-development --analyzer
      - name: Preserve source inventory and bounded analysis diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ matrix.shard }}
          path: out/quality/analysis/
          if-no-files-found: error
          retention-days: 14
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi

  editor:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration'
    name: Editor, shader worker and unit tests
    runs-on: ubuntu-24.04
    env:
      LUDUS_TIDY_JOBS: "4"
      # Compile the editor without its precompiled headers from the first
      # configure (./init.sh in native-setup) onwards; see the configure step.
      LUDUS_EDITOR_PRECOMPILED_HEADERS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          editor: 'true'
          cache-variant: editor
          conan-cache-writer: 'false'
      - name: Prepare and configure trusted authoring shaders
        run: |
          ./scripts/shader-probe bootstrap
          out/host-tools/venv/bin/cmake --preset linux-clang-development -DLUDUS_EDITOR_RENDER_PREVIEW=ON -DLUDUS_BUILD_SHADER_WORKER=ON -DLUDUS_EDITOR_PRECOMPILED_HEADERS=OFF -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc" -DLUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val"
      # Compile authoring and live reload once per combined batch, including all
      # default targets previously built separately on every integration PR.
      # The editor's precompiled headers stay off here, so an editor source that
      # relies on a Qt or standard header it does not include fails this build.
      # The macOS jobs and Linux sanitizer build keep the default (on).
      - name: Build every default target with the Editor and shader worker
        run: out/host-tools/venv/bin/cmake --build --preset linux-clang-development
      - name: Verify unit and Editor tests and worker-on target detection
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          out/host-tools/venv/bin/ctest --preset linux-clang-development --label-regex '^(unit|editor)$' --no-tests=error
          out/host-tools/venv/bin/ctest --preset linux-clang-development --tests-regex '^ludus_target_detection$' --output-on-failure --no-tests=error
      # Play in the viewport on Linux: Qt's own Vulkan device on an Xvfb display,
      # with Mesa's lavapipe for both the editor and the game, imports the game's
      # exported memory. The journey plays the World-demo game in the World viewport.
      - name: Verify Play in the World viewport on Vulkan
        run: |
          apt_options=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3)
          timeout --signal=TERM --kill-after=30s 10m sudo apt-get "${apt_options[@]}" install -y -qq xvfb xauth
          out/host-tools/venv/bin/cmake --preset linux-clang-development -DLUDUS_BUILD_WORLD_DEMO=ON
          out/host-tools/venv/bin/cmake --build --preset linux-clang-development \
            --target ludus_editor_tests ludus_world_demo ludus_rhi_hosted_producer
          xvfb-run -a -s '-screen 0 1600x1000x24' env QT_QPA_PLATFORM=xcb \
            out/build/linux-clang-development/apps/editor/ludus_editor_tests '[play][gpu],[.play-native]'
      - name: Measure the content browser projection
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          out/build/linux-clang-development/apps/editor/ludus_editor_tests '[content][scale]' --success > out/editor-content-scale.txt
          tee -a "$GITHUB_STEP_SUMMARY" < out/editor-content-scale.txt
      - uses: actions/upload-artifact@v4
        with:
          name: editor-content-scale
          path: out/editor-content-scale.txt
      - name: Analyze document interactions and regressions
        run: |
          ./scripts/check linux-clang-development --tidy-sources \
            apps/editor/src/controller.cpp apps/editor/src/main_window.cpp \
            apps/editor/src/main_window_layout.cpp apps/editor/src/document_commands.cpp \
            apps/editor/src/configuration_workspace.cpp apps/editor/src/audio_workspace.cpp \
            apps/editor/src/audio_preview.cpp \
            apps/editor/tests/document_history_tests.cpp apps/editor/tests/document_interaction_tests.cpp \
            apps/editor/src/content_catalog_model.cpp apps/editor/src/content_import.cpp \
            apps/editor/src/content_jobs.cpp apps/editor/src/content_workspace.cpp \
            apps/editor/tests/content_browser_tests.cpp apps/editor/tests/content_import_gate_tests.cpp \
            apps/editor/src/controller_play.cpp apps/editor/src/script_workspace.cpp \
            apps/editor/tests/script_workspace_tests.cpp \
            apps/editor/src/world_demo_adapter.cpp \
            apps/editor/src/world_document.cpp apps/editor/src/world_workspace.cpp \
            apps/editor/src/render_scene.cpp apps/editor/src/render_preview.cpp \
            apps/editor/src/editor_camera_controller.cpp apps/editor/src/viewport_navigation.cpp \
            apps/editor/tests/viewport_navigation_tests.cpp \
            apps/editor/src/preview_viewport.cpp apps/editor/src/qt_viewport_device_vulkan.cpp \
            apps/editor/src/level_workspace.cpp apps/editor/tests/level_workspace_tests.cpp \
            apps/editor/src/render_load_job.cpp apps/editor/src/render_panel.cpp \
            apps/editor/tests/render_authoring_tests.cpp \
            apps/editor/tests/world_workspace_tests.cpp \
            apps/editor/tests/world_demo_workspace_tests.cpp
      - name: Verify S5 Editor, installed Behavior SDK and GameHost journey
        run: |
          ./scripts/script-provider bootstrap
          out/host-tools/venv/bin/cmake --preset linux-clang-development \
            -DLUDUS_BUILD_SCRIPT_INTERACTION=OFF -DLUDUS_BUILD_SCRIPT_SESSION=OFF \
            -DLUDUS_BUILD_VISUAL_SEQUENCE=OFF
          ./scripts/script-provider run --preset linux-clang-development
          out/host-tools/venv/bin/cmake --build --preset linux-clang-development
          out/host-tools/venv/bin/cmake --install out/build/linux-clang-development
          QT_QPA_PLATFORM=offscreen LUDUS_SDK_PREFIX="$PWD/out/install/linux-clang-development" \
            out/build/linux-clang-development/apps/editor/ludus_editor_tests '[.script-journey]'
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi

  # Debug runtime already runs the complete Debug assertion/build contracts.
  assertion-policy:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration'
    name: Assertion policy (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-clang-profile, linux-clang-release]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: ${{ matrix.preset }}
      - name: Build and test all assertion policies including Release
        run: |
          out/host-tools/venv/bin/cmake --preset ${{ matrix.preset }} -B out/build/assertion-policy -DLUDUS_BUILD_TESTS=ON -DLUDUS_WARNINGS_AS_ERRORS=ON
          out/host-tools/venv/bin/cmake --build out/build/assertion-policy --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          out/host-tools/venv/bin/ctest --test-dir out/build/assertion-policy --output-on-failure
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi

  pch:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration'
    name: PCH build (LUDUS_ENABLE_PCH=ON)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          cache-variant: pch
          conan-cache-writer: 'false'
      - name: Configure, build, and test with the foundational PCH enabled
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development -B out/build/pch \
            -DLUDUS_BUILD_TESTS=ON -DLUDUS_WARNINGS_AS_ERRORS=ON -DLUDUS_ENABLE_PCH=ON
          out/host-tools/venv/bin/cmake --build out/build/pch --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          # Compile-policy/header contracts run in the non-PCH jobs; their
          # standalone reparsing does not support injected PCH flags.
          out/host-tools/venv/bin/ctest --test-dir out/build/pch --output-on-failure --label-exclude build-contract
      - name: Report compiler cache
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats >> "$GITHUB_STEP_SUMMARY"; fi

  build-budget:
    needs: changes
    if: needs.changes.outputs.native_required == 'true' && needs.changes.outputs.validation_tier != 'integration'
    name: Build-time budget
    runs-on: ubuntu-24.04
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          compiler-cache: 'false'
          conan-cache-writer: 'false'
      # Setup only: --ci would repeat all native validation before profiling.
      # Keep the clean profile uncached and concurrency stable for timing budgets.
      - name: Enforce build-time budget
        run: ./scripts/check-build-budget --profile
      - name: Publish build-time profile summary
        if: always()
        run: |
          echo "### Build-time budget" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Time summary/,/Expensive headers/p' out/profile/*-analysis.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Save detailed build profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-profile
          path: out/profile/
          if-no-files-found: warn

  linux:
    # Thanks to GitHub, "Using conditions to control job execution": keep the
    # required check present, and allow skipped native jobs only for docs-only
    # changes whose classification and routing regressions succeeded.
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-jobs-with-conditions
    # A cancelled pull-request run passes only when a newer, uncancelled run of
    # this workflow covers the same head commit; that run's gate owns the result.
    name: Ubuntu Clang
    needs: [changes, macos-compile, macos-sanitizers, macos-analysis, formatting, debug-runtime, development, sanitizers, filesystem-fuzz, threading-races, analysis, editor, assertion-policy, pch, build-budget, scripting-qualification]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - name: Enforce validation for the classified change scope
        env:
          RESULTS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/python/ci_scope.py gate
