name: Windows Direct3D 12
# Win32 and Direct3D 12 conformance on WARP with Clang and MSVC.
# Both compiler lanes build DXIL with the pinned Slang and DXC.
on:
  workflow_call:
    inputs:
      batch_sha:
        description: Frozen develop commit selected by the trusted batch coordinator.
        required: true
        type: string
      batch_base_sha:
        description: Stable main commit captured with this candidate.
        required: true
        type: string
  workflow_dispatch:
  # Targeted lane for changes to the code it alone executes; every batch also
  # runs it. Other integration PRs keep the inexpensive checks only.
  pull_request:
    paths:
      - '.github/workflows/windows-direct3d12.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'config/cmake/windows-msvc*'
      - 'cmake/EngineBuildFlavor.cmake'
      - 'cmake/EngineCompilerWarnings.cmake'
      - 'cmake/EngineOptions.cmake'
      - 'cmake/EngineWindowsMsvc.cmake'
      - 'cmake/EngineWindowsSdk.cmake'
      - 'cmake/LudusWindowsSdk.cmake.in'
      - 'cmake/LudusConfig.cmake.in'
      - 'cmake/LudusSdkManifest.json.in'
      - 'cmake/CheckSdkVariant.cmake.in'
      - 'tests/sdk_consumer/windows/**'
      - 'cmake/LudusShaders.cmake'
      - 'cmake/shaders/compile_shader.py'
      - 'config/conan/profiles/windows-clang-x86_64'
      - 'config/conan/profiles/windows-msvc-probe-x86_64'
      - 'config/tool_versions.json'
      - 'config/shader_toolchain.json'
      - 'modules/graphics/rhi/shaders/raster_bindings.slang'
      - 'modules/foundation/base/include/ludus/foundation/base/checked_integer.hpp'
      - 'modules/foundation/base/include/ludus/foundation/base/byte_order.hpp'
      - 'modules/foundation/base/include/ludus/foundation/base/compiler.h'
      - 'modules/foundation/base/include/ludus/foundation/base/config.h'
      - 'modules/foundation/base/include/ludus/foundation/base/types.h'
      - 'modules/foundation/base/src/types.cpp'
      - 'modules/foundation/base/tests/checked_integer_tests.cpp'
      - 'modules/foundation/base/tests/byte_order_tests.cpp'
      - 'tests/build_contract/primitive_portability/**'
      - 'tests/build_contract/windows_file_api.py'
      - 'scripts/python/cmake_targets.py'
      - 'modules/graphics/rhi/src/dxil_container.cpp'
      - 'modules/graphics/rhi/src/internal/dxil_container.h'
      - 'modules/graphics/rhi/src/*d3d12*'
      - 'modules/graphics/rhi/src/internal/d3d12_device.h'
      - 'modules/graphics/rhi/src/internal/d3d12_diagnostics.h'
      - 'modules/graphics/rhi/src/internal/d3d12_raster.h'
      - 'modules/graphics/rhi/src/internal/d3d12_transfer.h'
      - 'modules/graphics/rhi/tests/portable_transfer_conformance_tests.cpp'
      - 'modules/graphics/rhi/tests/portable_raster_conformance_tests.cpp'
      - 'modules/graphics/rhi/tests/shaders/ordered_compute.slang'
      - 'tests/sdk_consumer/shaders/r10.slang'
      - 'modules/graphics/rhi/CMakeLists.txt'
      - 'cmake/shaders/compile_raster.py'
      - 'modules/graphics/rhi/tests/d3d12*'
      - 'tests/sdk_consumer/shaders/raster.slang'
      - 'modules/foundation/base/tests/windows_diagnostic_probe.cpp'
      - 'tests/assertions/windows_diagnostics.py'
      - 'modules/foundation/filesystem/**'
      - 'modules/foundation/logging/src/sinks/file_sink.cpp'
      - 'tests/filesystem/windows_recovery.py'
      - 'modules/platform/src/entropy.cpp'
      - 'modules/platform/src/internal/win32_keymap.hpp'
      - 'modules/platform/src/window_win32.cpp'
      - 'modules/platform/src/internal/window_win32.hpp'
      - 'modules/platform/tests/win32_tests.cpp'
      - 'scripts/shader-probe'
      - 'tests/sdk_consumer/shaders/diagnostic.slang'
permissions:
  contents: read
concurrency:
  group: windows-direct3d12-${{ inputs.batch_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: "true"
  LUDUS_DIAGNOSTIC_INTERACTIVE: "0"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  LUDUS_TEST_REQUIRE_WARP: "1"
  LUDUS_CI_COMMIT_SHA: ${{ inputs.batch_sha || github.sha }}
jobs:
  msvc:
    name: MSVC host and D3D12 / ${{ matrix.generator }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        generator: [Ninja, MSBuild]
    defaults:
      run:
        shell: pwsh
    env:
      CONAN_HOME: ${{ github.workspace }}/out/windows-msvc-probe/conan-home
      CONAN_NON_INTERACTIVE: "1"
      LUDUS_WINDOWS_GENERATOR: ${{ matrix.generator }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - name: Select the x64 MSVC candidate and Windows SDK
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Install Visual Studio 2022 C++ Build Tools for the D0 probe' }
          $command = "`"$installation\Common7\Tools\VsDevCmd.bat`" -no_logo -arch=x64 -host_arch=x64 -vcvars_ver=14.44 -winsdk=10.0.26100.0 >nul && set"
          $environment = & $env:ComSpec /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'The MSVC 14.44 / Windows SDK 10.0.26100.0 candidate is unavailable' }
          foreach ($line in $environment) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsVersion|VCToolsInstallDir|VSINSTALLDIR|VCINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Install pinned host tools and compiler-native Catch2
        run: |
          python -m venv out/host-tools/venv
          $python = "$PWD/out/host-tools/venv/Scripts/python.exe"
          $pins = Get-Content config/tool_versions.json | ConvertFrom-Json
          $versions = $pins.managed
          & $python -m pip install --disable-pip-version-check --quiet "cmake==$($pins.windows_msvc_probe.cmake)" "ninja==$($versions.ninja)" "conan==$($versions.conan)"
          if ($LASTEXITCODE -ne 0) { throw 'Host tool installation failed' }
          $env:PATH = "$PWD/out/host-tools/venv/Scripts;$env:PATH"
          conan export third_party/catch2
          if ($LASTEXITCODE -ne 0) { throw 'Catch2 recipe export failed' }
          $dependencyConfigurations = @('Debug', 'RelWithDebInfo', 'Release')
          foreach ($configuration in $dependencyConfigurations) {
            conan install --requires=catch2/3.4.0 --lockfile conan.lock --lockfile-partial --profile:host config/conan/profiles/windows-msvc-probe-x86_64 --profile:build config/conan/profiles/windows-msvc-probe-x86_64 --settings:host "build_type=$configuration" --settings:build build_type=Release --build=missing -g CMakeDeps --output-folder out/windows-msvc-probe/dependencies
            if ($LASTEXITCODE -ne 0) { throw "Catch2 $configuration setup failed" }
          }
      - name: Bootstrap pinned shader tools
        run: python scripts/shader-probe bootstrap
      - name: Build and test primitives, Foundation host services and the Win32/D3D12 closure
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/python
        run: |
          $env:PATH = "$PWD/out/host-tools/venv/Scripts;$env:PATH"
          $dependencies = "$PWD/out/windows-msvc-probe/dependencies"
          $visualStudio = $env:LUDUS_WINDOWS_GENERATOR -eq 'MSBuild'
          $buildOptions = @()
          if ($visualStudio) {
            $generator = @('-G', 'Visual Studio 17 2022', '-A', 'x64', '-T', "v143,version=$($env:VCToolsVersion.TrimEnd('\')),host=x64", '-DCMAKE_SYSTEM_VERSION=10.0.26100.0')
          } else {
            $generator = @('-G', 'Ninja', '-DCMAKE_CXX_COMPILER=cl')
            $buildOptions = @('--', '-k', '0')
          }
          $primitive = 'out/windows-msvc-probe/primitives'
          cmake -S tests/build_contract/primitive_portability -B $primitive @generator "-DCMAKE_PREFIX_PATH=$dependencies" '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
          if ($LASTEXITCODE -ne 0) { throw 'Primitive probe configure failed' }
          cmake --build $primitive --config RelWithDebInfo
          if ($LASTEXITCODE -ne 0) { throw 'Primitive probe build failed' }
          ctest --test-dir $primitive -C RelWithDebInfo --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'Primitive probe tests failed' }
          if ($visualStudio) {
            cmake --build $primitive --config Debug
            if ($LASTEXITCODE -ne 0) { throw 'Primitive probe Debug build failed' }
            ctest --test-dir $primitive -C Debug --output-on-failure --no-tests=error
            if ($LASTEXITCODE -ne 0) { throw 'Primitive probe Debug tests failed' }
          } else {
            $debugPrimitive = 'out/windows-msvc-probe/primitives-debug'
            cmake -S tests/build_contract/primitive_portability -B $debugPrimitive @generator "-DCMAKE_PREFIX_PATH=$dependencies" '-DCMAKE_BUILD_TYPE=Debug'
            if ($LASTEXITCODE -ne 0) { throw 'Primitive probe Debug configure failed' }
            cmake --build $debugPrimitive --config Debug
            if ($LASTEXITCODE -ne 0) { throw 'Primitive probe Debug build failed' }
            ctest --test-dir $debugPrimitive -C Debug --output-on-failure --no-tests=error
            if ($LASTEXITCODE -ne 0) { throw 'Primitive probe Debug tests failed' }
          }

          # CMakeDeps supplies the Catch2 targets for all solution configurations.
          $env:LUDUS_WINDOWS_DEPENDENCIES = $dependencies
          $builds = [ordered]@{}
          if ($visualStudio) {
            python tests/build_contract/windows_file_api.py query out/build/windows-msvc-visual-studio
            if ($LASTEXITCODE -ne 0) { throw 'Engine File API query failed' }
            cmake --preset windows-msvc-visual-studio
            if ($LASTEXITCODE -ne 0) { throw 'Engine solution configure failed' }
            foreach ($configuration in @('Debug', 'Development', 'Profile', 'Release')) {
              $builds[$configuration] = 'windows-msvc-visual-studio'
            }
          } else {
            foreach ($flavor in @('Debug', 'Development', 'Profile', 'Release')) {
              $preset = "windows-msvc-$($flavor.ToLowerInvariant())"
              python tests/build_contract/windows_file_api.py query "out/build/$preset"
              if ($LASTEXITCODE -ne 0) { throw "Engine $flavor File API query failed" }
              cmake --preset $preset
              if ($LASTEXITCODE -ne 0) { throw "Engine $flavor configure failed" }
              $builds[$flavor] = $preset
            }
          }
          $testTargets = @(
            'ludus_foundation_base_tests', 'ludus_foundation_memory_tests',
            'ludus_foundation_containers_tests', 'ludus_containers_alloc_tests',
            'ludus_foundation_time_tests', 'ludus_foundation_threading_tests',
            'ludus_threading_startup_tests', 'ludus_threading_alloc_tests', 'ludus_threading_profiling_tests',
            'ludus_foundation_logging_tests', 'ludus_logging_allocation_failure_tests',
            'ludus_foundation_profiling_tests', 'ludus_foundation_identity_tests',
            'ludus_filesystem_tests', 'ludus_filesystem_namespace_fault_tests',
            'ludus_filesystem_pack_fault_tests', 'ludus_filesystem_async_fault_tests',
            'ludus_platform_entropy_tests', 'ludus_platform_win32_tests', 'ludus_input_tests',
            'ludus_rhi_d3d12_tests', 'ludus_rhi_lifecycle_tests'
          )
          $targets = $testTargets + @('ludus_filesystem_windows_recovery_probe', 'ludus_windows_diagnostic_probe')
          if ($visualStudio) { $targets += 'ludus_windows_sdk' }
          foreach ($configuration in $builds.Keys) {
            $preset = $builds[$configuration]
            if ($visualStudio) { $preset += "-$($configuration.ToLowerInvariant())" }
            cmake --build --preset $preset --target @targets @buildOptions
            if ($LASTEXITCODE -ne 0) { throw "Engine $configuration build failed" }
          }

          # Run the tests after building all configurations, so an output
          # collision cannot silently substitute the most recently built binary.
          $testNames = $testTargets + @('ludus_filesystem_windows_recovery', 'ludus_windows_diagnostic_death')
          $suite = '^(' + ($testNames -join '|') + ')$'
          $failedConfigurations = @()
          foreach ($configuration in $builds.Keys) {
            $preset = $builds[$configuration]
            $build = "out/build/$preset"
            if ($visualStudio) { $preset += "-$($configuration.ToLowerInvariant())" }
            ctest --preset $preset --tests-regex $suite
            $testStatus = $LASTEXITCODE
            $lastTest = "$build/Testing/Temporary/LastTest.log"
            if (Test-Path $lastTest) {
              Copy-Item $lastTest "$build/Testing/Temporary/$configuration.log"
            }
            if ($testStatus -ne 0) { $failedConfigurations += $configuration }
            $tests = ctest --preset $preset --show-only=json-v1 --tests-regex $suite | ConvertFrom-Json
            foreach ($name in $testNames) {
              if ($name -notin $tests.tests.name) { throw "Missing required $configuration test $name" }
            }
            $d3d12 = ($tests.tests | Where-Object name -eq ludus_rhi_d3d12_tests).command[0]
            $cases = & $d3d12 --list-tests '[ordered-compute]'
            if ($LASTEXITCODE -ne 0 -or @($cases -match 'Portable ordered compute dispatches feed indirect raster').Count -ne 1) {
              throw "The DXIL ordered compute conformance case is missing from $d3d12"
            }
            $diagnostics = & $d3d12 --list-tests '[d5b]'
            if ($LASTEXITCODE -ne 0 -or @($diagnostics -match 'Direct3D 12 (frame and pass timestamps|device removal)').Count -ne 2) {
              throw "The D5b timing and device removal cases are missing from $d3d12"
            }
            if ($visualStudio -and (Split-Path -Leaf (Split-Path -Parent $d3d12)) -ne $configuration) {
              throw "CTest selected the wrong D3D12 executable for $configuration ($d3d12)"
            }
            $fileApiConfiguration = $configuration
            if (-not $visualStudio -and $configuration -in @('Development', 'Profile')) {
              $fileApiConfiguration = 'RelWithDebInfo'
            }
            python tests/build_contract/windows_file_api.py launch $build $fileApiConfiguration $d3d12
            if ($LASTEXITCODE -ne 0) { throw "Engine $configuration File API launch failed" }
          }
          if ($failedConfigurations.Count -gt 0) {
            throw "Engine tests failed in $($failedConfigurations -join ', ')"
          }
      - name: Install and relocate all four SDKs
        if: matrix.generator == 'MSBuild'
        run: |
          $env:PATH = "$PWD/out/host-tools/venv/Scripts;$env:PATH"
          $solution = "$PWD/out/build/windows-msvc-visual-studio"
          $workspace = "$PWD/out/windows-msvc-probe"
          $relocated = "$workspace/relocated SDKs"
          New-Item -ItemType Directory -Force $relocated | Out-Null
          foreach ($configuration in @('Debug', 'Development', 'Profile', 'Release')) {
            $prefix = "$workspace/install/$configuration"
            cmake --install $solution --config $configuration --prefix $prefix
            if ($LASTEXITCODE -ne 0) { throw "Install failed for $configuration" }
            Move-Item $prefix "$relocated/$configuration"
          }

          $collision = cmake --install $solution --config Release --prefix "$relocated/Debug" 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $collision -notmatch 'Incompatible Ludus SDK') {
            throw "The install did not reject a mixed SDK prefix: $collision"
          }
          exit 0
      - name: Verify incremental C++ and DXIL builds and run WARP
        if: matrix.generator == 'MSBuild'
        run: |
          $env:PATH = "$PWD/out/host-tools/venv/Scripts;$env:PATH"
          & out/host-tools/venv/Scripts/python.exe tests/sdk_consumer/windows/verify_incremental.py "$PWD/out/windows-msvc-probe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows SDK incremental verification failed' }
      - name: Create, repair and launch SDK projects with Ninja and MSBuild
        if: matrix.generator == 'MSBuild'
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/python
          PYTHONUTF8: "1"
        run: |
          & out/host-tools/venv/Scripts/python.exe tests/sdk_consumer/windows/verify_project_setup.py "$PWD/out/windows-msvc-probe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows MSVC project setup verification failed' }
      - name: Preserve candidate identities and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-${{ matrix.generator }}
          path: |
            out/build/windows-msvc-*/CMakeCache.txt
            out/build/windows-msvc-*/Testing/Temporary/
            out/windows-msvc-probe/**/compiler-identity.txt
            out/windows-msvc-probe/**/CMakeCache.txt
            out/windows-msvc-probe/incremental/**/*.d
            out/windows-msvc-probe/incremental/**/manifest.json
            out/windows-msvc-probe/**/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14
  windows:
    name: Windows Direct3D 12 bring-up
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CONAN_HOME: ${{ github.workspace }}/out/windows/conan-home
      CONAN_NON_INTERACTIVE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      # Chocolatey does not package LLVM 23 yet; install the upstream release
      # installer, pinned by the SHA-256 digest GitHub publishes for the asset.
      - name: Install pinned LLVM
        shell: pwsh
        env:
          LLVM_WINDOWS_VERSION: 23.1.3
          LLVM_WINDOWS_SHA256: 5153f848ac87553118340f16f8d3cd4351d729bcba6e4785c6a4a9af29676de9
        run: |
          $msi = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_WINDOWS_VERSION-win64.msi"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_WINDOWS_VERSION/LLVM-$env:LLVM_WINDOWS_VERSION-win64.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi
          $actual = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant()
          if ($actual -ne $env:LLVM_WINDOWS_SHA256) { throw "LLVM installer digest $actual does not match the pin" }
          # The runner image preinstalls another LLVM into the same directory.
          choco uninstall llvm --yes --no-progress
          $process = Start-Process -FilePath msiexec.exe -Wait -PassThru -ArgumentList "/i", "`"$msi`"", "/qn", "/norestart"
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) { throw "msiexec exited $($process.ExitCode)" }
          exit 0
      - name: Verify pinned LLVM and install host tools
        run: |
          llvm="$(python -c "import json; print(json.load(open('config/tool_versions.json'))['minimum']['clang'].split('.')[0])")"
          mkdir -p out
          "/c/Program Files/LLVM/bin/clang++.exe" --version | tee out/clang-version.txt
          grep -q "clang version ${llvm}\." out/clang-version.txt
          python -m venv out/host-tools/venv
          versions="$(python -c "import json; m=json.load(open('config/tool_versions.json'))['managed']; print(' '.join(f'{k}=={v}' for k, v in m.items()))")"
          # shellcheck disable=SC2086
          out/host-tools/venv/Scripts/python -m pip install --disable-pip-version-check --quiet $versions
      - name: Build locked Catch2 with the Windows Clang profile
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PWD/out/host-tools/venv/Scripts:$PATH"
          conan export third_party/catch2
          conan install --requires=catch2/3.4.0 --lockfile conan.lock --lockfile-partial \
            --profile:host config/conan/profiles/windows-clang-x86_64 \
            --profile:build config/conan/profiles/windows-clang-x86_64 \
            --settings:host build_type=RelWithDebInfo --settings:build build_type=Release \
            --build=missing -g CMakeDeps -g CMakeToolchain --output-folder out/windows/conan
      # Slang and the DXC libraries that compile and sign DXIL, verified against
      # config/shader_toolchain.json; DXIL is compiled only on Windows hosts.
      - name: Bootstrap pinned shader tools
        run: python scripts/shader-probe bootstrap
      - name: Configure and build the Direct3D 12 closure
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PWD/out/host-tools/venv/Scripts:$PATH"
          tools="$(cygpath -m "$PWD/out/shader-tools")"
          cmake -S . -B out/build/windows-clang-development -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/out/windows/conan/conan_toolchain.cmake" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLUDUS_BUILD_FLAVOR=Development \
            -DLUDUS_BUILD_TESTS=ON -DLUDUS_WARNINGS_AS_ERRORS=ON -DLUDUS_ENABLE_CCACHE=OFF \
            -DLUDUS_SLANG_COMPILER="$tools/slang/bin/slangc.exe" -DLUDUS_DXC_DIRECTORY="$tools/dxc"
          cmake --build out/build/windows-clang-development --target \
            ludus_platform ludus_graphics_rhi \
            ludus_platform_win32_tests ludus_platform_entropy_tests ludus_rhi_d3d12_tests ludus_rhi_lifecycle_tests \
            ludus_filesystem_tests ludus_filesystem_windows_recovery_probe ludus_foundation_logging_tests -- -k 0
      - name: Test the Win32 window and Direct3D 12 backends
        run: |
          export PATH="$PWD/out/host-tools/venv/Scripts:$PATH"
          ctest --test-dir out/build/windows-clang-development --output-on-failure --no-tests=error \
            --tests-regex '^ludus_((platform_win32|platform_entropy|rhi_d3d12|rhi_lifecycle|filesystem|foundation_logging)_tests|filesystem_windows_recovery)$'
          out/build/windows-clang-development/modules/graphics/rhi/ludus_rhi_d3d12_tests.exe --list-tests \
            | grep -q "Portable texture transfers initialize mips"
          # The DXIL pixel tests are configured only with the shader tools; require them here.
          out/build/windows-clang-development/modules/graphics/rhi/ludus_rhi_d3d12_tests.exe --list-tests \
            | grep -q "draws the fullscreen pipeline across resizes"
          out/build/windows-clang-development/modules/graphics/rhi/ludus_rhi_d3d12_tests.exe --list-tests '[ordered-compute]' \
            | grep -q "Portable ordered compute dispatches feed indirect raster"
          diagnostics="$(out/build/windows-clang-development/modules/graphics/rhi/ludus_rhi_d3d12_tests.exe --list-tests '[d5b]')"
          grep -q "Direct3D 12 frame and pass timestamps follow submission fences" <<< "$diagnostics"
          grep -q "Direct3D 12 device removal invalidates pending timestamps" <<< "$diagnostics"
      - name: Preserve Windows test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-direct3d12
          path: out/build/windows-clang-development/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14
