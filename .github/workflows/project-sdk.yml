name: project-sdk

# Installed host-tooling package checks. The Development job in ci.yml builds,
# installs and relocates the SDK once, and enforces the external consumer check.
# Release publication remains in release.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_call:
    inputs:
      batch_sha:
        description: Frozen develop commit selected by the trusted batch coordinator.
        required: true
        type: string
      batch_base_sha:
        description: Stable main commit captured with this candidate.
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

# Thanks to GitHub's "Concurrency" guidance: superseded PR checks can cancel.
# https://docs.github.com/en/actions/concepts/workflows-and-actions/concurrency
# Only a push (synchronize) supersedes the runs for earlier commits. Other PR
# activity (opened, ready_for_review, edited, ...) can fire for the commit a
# concurrent push run is validating, so it runs in a per-commit group that never
# cancels. A cancelled duplicate would otherwise leave a cancelled or failed
# required check on the head commit and block the PR.
concurrency:
  group: project-sdk-${{ inputs.batch_sha || github.ref }}${{ github.event_name == 'pull_request' && github.event.action != 'synchronize' && format('-head-{0}', github.event.pull_request.head.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  host-tooling:
    name: Host tooling (ludus_tools) unit tests
    runs-on: ubuntu-24.04
    outputs:
      native_required: ${{ steps.scope.outputs.native_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/change-scope
        id: scope
      - name: Report documentation-only validation
        if: steps.scope.outputs.native_required == 'false'
        run: echo 'Documentation-only changes; native host-tooling validation skipped.'
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.native_required == 'true'
        with:
          python-version: "3.11"
      - name: Install the host tooling into a fresh venv at a new location
        if: steps.scope.outputs.native_required == 'true'
        run: |
          python3 -m venv /tmp/ludus-venv
          /tmp/ludus-venv/bin/pip install ./scripts/python
          /tmp/ludus-venv/bin/pip install cmake==3.29.6 ninja==1.11.1.3
      - name: Install native package inspection tools
        if: steps.scope.outputs.native_required == 'true'
        run: |
          llvm_major="$(python3 -c 'import json; print(int(json.load(open("config/tool_versions.json"))["minimum"]["clang"].split(".")[0]))')"
          if [[ -f scripts/python/llvm_apt_source.py ]]; then python3 scripts/python/llvm_apt_source.py; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq "clang-$llvm_major" binutils
      - name: Prove the installed CLI runs with no checkout/Qt on the path
        if: steps.scope.outputs.native_required == 'true'
        run: |
          cd /tmp
          /tmp/ludus-venv/bin/ludus --version
          /tmp/ludus-venv/bin/ludus --store /tmp/store sdk list
          /tmp/ludus-venv/bin/ludus render-graph new /tmp/ludus-rg0-present
          /tmp/ludus-venv/bin/ludus render-graph dump /tmp/ludus-rg0-present/main.lurender.json
          /tmp/ludus-venv/bin/ludus render-graph new /tmp/ludus-rg0-depth --output depth
          /tmp/ludus-venv/bin/ludus --json render-graph validate /tmp/ludus-rg0-depth/main.lurender.json
          /tmp/ludus-venv/bin/ludus render-graph validate /tmp/ludus-rg0-depth/rasterize.lurender.json --library
          /tmp/ludus-venv/bin/ludus render-graph new-build /tmp/ludus-rg0-depth/main.lurender.json --profiles spirv wgsl glsl
          /tmp/ludus-venv/bin/python -c "import ludus_tools, sys; mods=[m for m in sys.modules if 'PyQt' in m or 'PySide' in m or m=='engine']; assert mods==[], mods; print('no Qt/engine imports')"
      - name: Run host-tooling unit/integration tests
        if: steps.scope.outputs.native_required == 'true'
        run: |
          cd scripts/python
          PATH=/tmp/ludus-venv/bin:$PATH python3 -m unittest test_editor_debugger test_editor_tool test_project_setup test_engine_pin test_macos_project_tooling test_creation_engine test_ludus_tools test_ludus_project_ops test_ludus_cli test_render_graph test_render_graph_build test_render_graph_execution test_render_graph_authoring test_ludus_failure_scenarios test_ludus_release test_ludus_itch_release test_macos_release test_ludus_butler -v

      - name: Exercise the installed release backend outside the checkout
        if: steps.scope.outputs.native_required == 'true'
        working-directory: /tmp
        run: |
          PATH=/tmp/ludus-venv/bin:$PATH PYTHONPATH=/tmp/ludus-venv/lib/python3.11/site-packages:${{ github.workspace }}/scripts/python /tmp/ludus-venv/bin/python -m unittest test_ludus_release test_ludus_itch_release test_macos_release test_ludus_butler -v

  butler-install:
    needs: host-tooling
    if: needs.host-tooling.outputs.native_required == 'true' && (github.event_name != 'pull_request' || github.base_ref != 'develop')
    name: Pinned butler installation (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests install on Ubuntu only; macOS installs run in the queue
        # and on main. Use supported runners with explicit Intel coverage.
        # https://github.com/actions/runner-images/issues/13518
        runner: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-15", "macos-15-intel"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.batch_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install standalone host tooling
        run: |
          python3 -m venv out/butler-cli-venv
          out/butler-cli-venv/bin/python -m pip install --no-deps ./scripts/python
      - name: Test installer contracts against the installed wheel
        run: |
          out/butler-cli-venv/bin/python -c 'import sys, unittest; sys.path.append("scripts/python"); unittest.main(module="test_ludus_butler", verbosity=2)'
      - name: Download verified host pin and execute only version
        run: out/butler-cli-venv/bin/python tests/sdk_consumer/verify_butler_install.py --cli "$PWD/out/butler-cli-venv/bin/ludus"
